<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo IDERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
/* Plan: índice en columna izquierda, ficha a la derecha. Azul tinta = objeto, ocre = dato básico y fundamental. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#15262e; --muted:#5b6b73; --line:#d9e0e3;
  --obj:#1b5e86; --obj-soft:#e3eef5; --dbyf:#b5560a; --dbyf-soft:#fbeadb; --loc:#2b7a4b; --loc-soft:#e0f1e7; --focus:#1b5e86;
  --hl:#fff1a8;
  --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace; --f-disp:'Source Serif 4',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --panel:#16252d; --ink:#e4ecef; --muted:#93a5ad; --line:#2a3d47;
  --obj:#6fb4de; --obj-soft:#1b3646; --dbyf:#f0a35e; --dbyf-soft:#402a16; --loc:#7fd1a1; --loc-soft:#1b3a2a; --focus:#6fb4de; --hl:#5c4d00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --panel:#16252d; --ink:#e4ecef; --muted:#93a5ad; --line:#2a3d47;
  --obj:#6fb4de; --obj-soft:#1b3646; --dbyf:#f0a35e; --dbyf-soft:#402a16; --loc:#7fd1a1; --loc-soft:#1b3a2a; --focus:#6fb4de; --hl:#5c4d00; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
header{padding:14px 20px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font:600 22px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.ver{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;align-items:center}
.search{flex:1 1 320px;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button[data-k="f"][aria-pressed="true"]{background:var(--dbyf);color:#fff}
.seg button[data-k="o"][aria-pressed="true"]{background:var(--obj);color:#fff}
.seg .n{font-family:var(--f-mono);font-size:12px;opacity:.8;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;align-items:center;font-size:13px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:240px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--obj-soft);border-color:var(--obj);color:var(--obj)}
.scope label{margin-right:10px;white-space:nowrap;cursor:pointer}
.lbl{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--obj);cursor:pointer;text-decoration:underline;padding:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,430px) 1fr}
#list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 14px;cursor:pointer;border-left:4px solid var(--obj)}
.item.f{border-left-color:var(--dbyf)}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--obj-soft)}
.item.f[aria-current="true"]{background:var(--dbyf-soft)}
.item .r1{display:flex;gap:8px;align-items:baseline}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .nm{font-weight:500}
.item .r2{font-size:12.5px;color:var(--muted);margin-top:1px}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.f{background:var(--dbyf-soft);color:var(--dbyf);border-color:var(--dbyf)}
.badge.l{background:var(--loc-soft);color:var(--loc);border-color:var(--loc)}
.badge.w{background:var(--dbyf-soft);color:var(--dbyf);border-color:var(--dbyf)}
.item.l{border-left-color:var(--loc)}
.item.l[aria-current="true"]{background:var(--loc-soft)}
.lcard{border:1px solid var(--line);border-left:4px solid var(--loc);border-radius:8px;background:var(--panel);padding:10px 14px;margin:0 0 10px;max-width:72ch}
.lcard p{margin:6px 0 0}
.defb{margin:0 0 14px;max-width:70ch}
.defb .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.chip.l[aria-pressed="true"]{background:var(--loc-soft);border-color:var(--loc);color:var(--loc)}
.srcline{font-size:13px;color:var(--muted)}
.badge.o{background:var(--obj-soft);color:var(--obj);border-color:var(--obj)}
#detail{overflow:auto;padding:22px 28px 40px}
.crumb{font-size:13px;color:var(--muted)}
#detail h2{font:600 26px/1.2 var(--f-disp);margin:6px 0 10px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.def{max-width:68ch;margin:0 0 20px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.note{background:var(--dbyf-soft);border-left:3px solid var(--dbyf);padding:8px 12px;font-size:13.5px;margin:10px 0;max-width:68ch}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.c{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.dom{background:var(--bg)}
.dom td{padding-left:28px;font-size:13.5px}
.tg{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 9px;font-size:12.5px;cursor:pointer;color:var(--obj)}
.pill{display:inline-block;margin:0 6px 6px 0}
.empty{padding:40px 20px;color:var(--muted);text-align:center}
.back{display:none}
.use button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer;text-align:left}
.use button.f{border-color:var(--dbyf)}
.use .code{margin-right:6px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(680px,92vw)}
dialog textarea{width:100%;height:240px;font:12px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  #detail{display:none;padding:16px}
  body.show #list{display:none} body.show #detail{display:block}
  .back{display:inline-block;margin-bottom:8px}
  header{padding:12px 16px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Catálogo de Objetos Geográficos IDERA</h1>
    <div class="ver" id="ver"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-obj" aria-selected="true">Objetos y datos fundamentales</button>
    <button class="tab" role="tab" id="tab-atr" aria-selected="false">Atributos</button>
    <button class="tab" role="tab" id="tab-loc" aria-selected="false">Catálogo gobiernos locales</button>
  </div>
  <div class="controls">
    <div class="search"><input id="q" type="search" placeholder="Buscar por nombre, código, definición, atributo o valor…" aria-label="Buscar"></div>
    <div class="seg" id="seg" role="group" aria-label="Tipo de dato"></div>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <section id="list" aria-label="Resultados"></section>
  <section id="detail" aria-live="polite"></section>
</main>
<input type="file" id="lfile" accept=".xlsx,.xls,.csv" hidden>
<dialog id="dlg"><p>Copiá el texto (Ctrl+C) y pegalo en una planilla.</p><textarea id="ta" readonly></textarea><p><button class="tg" id="dclose">Cerrar</button></p></dialog>

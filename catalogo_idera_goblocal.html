{"c":"010101","n":"Yacimiento hidrocarburífero","cl":"01","sc":"0101","g":"Polígono","d":"Cuerpo geológico aproximado, constituido por petróleo y / o gas, económicamente explotable.","a":["FNA","GNA","NAM","FUN","PPO","CAA","SAG"]},{"c":"010102","n":"Yacimiento mineral","cl":"01","sc":"0101","g":"Polígono","d":"Parte de la corteza terrestre en la cual, debido a procesos geológicos, ha habido acumulación de materias primas minerales susceptibles de ser explotadas para el aprovechamiento de sus propiedades físicas o químicas.","a":["FNA","GNA","NAM","FUN","PPO","CAA","SAG"]},{"c":"010103","n":"Área de explotación hidrocarburífera","cl":"01","sc":"0101","g":"Polígono","d":"Área donde se efectúa una actividad extractiva de origen hidrocarburífera para su aprovechamiento económico.","a":["FNA","GNA","NAM","TIA","EOP","EIF","PCS","SAG"],"f":1},{"c":"010104","n":"Pozo hidrocarburífero","cl":"01","sc":"0101","g":"Punto","d":"Perforación realizada con el objetivo de realizar la extracción de hidrocarburos líquidos o gaseosos.","a":["FNA","GNA","NAM","FUN","PPO","SAG"]},{"c":"010105","n":"Pozo de agua","cl":"01","sc":"0101","g":"Punto","d":"Excavación o perforación hecha en la tierra con el objetivo de extraer agua para diversos usos.","a":["FUN","SAG"]},{"c":"010106","n":"Mina de extracción","cl":"01","sc":"0101","g":"Punto/Polígono","d":"Lugar de explotación de sustancias minerales de primera y segunda categoría.","a":["FNA","GNA","NAM","FUN","PPO","ARA","SAG"]},{"c":"010107","n":"Cantera","cl":"01","sc":"0101","g":"Punto/Polígono","d":"Explotación generalmente a cielo abierto de sustancias minerales de tercera categoría, a partir de la cual se obtienen rocas industriales, ornamentales y otros materiales. Una cantera puede tener más de una cava.","a":["FNA","GNA","NAM","FUN","PPO","ARA","SAG"]},{"c":"010201","n":"Fábrica","cl":"01","sc":"0102","g":"Punto","d":"Lugar que posee Instalaciones donde se realiza un conjunto de actividades técnicas destinadas a producir bienes materiales transformando materias primas. Incluye planta de ensamble, entre otros. No incluye astillero, matadero ni establecimiento agroindustrial.","a":["FNA","GNA","NAM","FUN","ISIC","SAG"]},{"c":"010202","n":"Planta de tratamiento de efluentes cloacales","cl":"01","sc":"0102","g":"Polígono","d":"Instalaciones destinadas al tratamiento de aguas servidas.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010203","n":"Astillero","cl":"01","sc":"0102","g":"Punto/Polígono","d":"Sitio ubicado al lado del mar o corriente de agua, en la que se construyen o reparan buques.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010204","n":"Planta potabilizadora de agua","cl":"01","sc":"0102","g":"Punto/Polígono","d":"Instalaciones cuya función es la producción de agua para consumo humano.","a":["FNA","GNA","NAM","FUN","SAG"],"f":1},{"c":"010205","n":"Área de fabricación y procesamiento","cl":"01","sc":"0102","g":"Punto/Polígono","d":"Área con instalaciones para producción o procesamiento de materias primas, transformándolas en bienes o productos utilizables en otras actividades. Incluye parques industriales, polos petroquímicos, entre otros.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"010206","n":"Pileta de tratamiento","cl":"01","sc":"0102","g":"Punto/Polígono","d":"Depósito destinado al almacenamiento de aguas residuales para su tratamiento.","a":["FUN","TPL","SAG"]},{"c":"010207","n":"Acueducto","cl":"01","sc":"0102","g":"Línea","d":"Conducto artificial que transporta agua en forma de flujo continuo con el objetivo de que esta sea accesible para su consumo u otros usos no industriales","a":["FNA","GNA","NAM","FUN","LOC","SAG"]},{"c":"010301","n":"Área de actividad agrícola","cl":"01","sc":"0103","g":"Polígono","d":"Área donde se realizan actividades productivas con el fin de obtener materias primas de origen vegetal a través de los cultivos sembrados.","a":["FNA","GNA","NAM","SAG"]},{"c":"010302","n":"Área de actividad pecuaria","cl":"01","sc":"0103","g":"Polígono","d":"Área donde se realiza un proceso de transformación de la materia prima proporcionada por la naturaleza, en este caso el animal y se obtiene, de la aplicación de capital y trabajo del hombre, un producto para satisfacer sus necesidades.","a":["FNA","GNA","NAM","TGD","SAG"]},{"c":"010303","n":"Rodal forestal","cl":"01","sc":"0103","g":"Polígono","d":"Unidad forestal establecida mediante plantación y / o siembra durante el proceso de forestación o reforestación. Puede estar formado por: especies introducidas (todos los rodales plantados) o masas de especies autóctonas sujetas a una explotación intensiva, que cumplen los siguientes requisitos: una o dos especies en el momento de la plantación, clase de edad homogénea y espaciamiento regular.","a":["SAG"]},{"c":"010304","n":"Área de riesgo agropecuario","cl":"01","sc":"0103","g":"Polígono","d":"Área caracterizada por la combinación de la probabilidad de que se produzca un evento y sus consecuencias negativas sobre la actividad agropecuaria. Principalmente son los riesgos derivados del impacto del clima.","a":["SAG"]},{"c":"010305","n":"Barrera sanitaria","cl":"01","sc":"0103","g":"Polígono","d":"Lugar físico establecido por algún organismo, en donde se aplican medidas sanitarias para la protección de áreas en riesgo.","a":["FNA","GNA","NAM","SAG"]},{"c":"010306","n":"Frigorífico, matadero","cl":"01","sc":"0103","g":"Punto","d":"Establecimiento donde se lleva a cabo la faena de animales y / o el proceso productivo posterior a la matanza. Cuenta con cámara frigorífica en el predio en el que funciona y en él se pueden efectuar o no tareas de elaboración y / o industrialización.","a":["FNA","GNA","NAM","CIF","FRI","FUN","SAG"]},{"c":"010307","n":"Establecimiento agroindustrial","cl":"01","sc":"0103","g":"Punto","d":"Estructura dedicada a una serie de actividades de manufacturación mediante las cuales se elaboran materias primas y productos intermedios derivados del sector agrícola. La agroindustria significa así la transformación de productos procedentes de la agricultura y la actividad forestal.","a":["FNA","GNA","NAM","FUN","TDE","SAG"]},{"c":"010401","n":"Central eléctrica","cl":"01","sc":"0104","g":"Punto/Polígono","d":"Edificio y equipamiento necesario para la generación de energía eléctrica.","a":["FNA","GNA","NAM","FUN","PPC","SAG"],"f":1},{"c":"010402","n":"Línea de transmisión eléctrica","cl":"01","sc":"0104","g":"Línea","d":"Sistema de cableado que transmite o distribuye energía eléctrica.","a":["FNA","GNA","NAM","FUN","TEN","SCN","DTS","EPR","ECN","SAG"],"f":1},{"c":"010403","n":"Estación transformadora","cl":"01","sc":"0104","g":"Punto/Polígono","d":"Planta que se encuentra junto a las centrales generadoras o en la periferia de las diversas zonas de consumo, donde se transforma la tensión de la energía eléctrica.","a":["FNA","GNA","NAM","FUN","DTS","EPR","ECN","POI","TNE","TNS","SAG"],"f":1},{"c":"010501","n":"Torre de comunicación","cl":"01","sc":"0105","g":"Punto","d":"Estructura metálica de gran altura que se utiliza para sostener antenas con fines de transmisión o recepción de ondas electromagnéticas.","a":["FNA","GNA","NAM","SAG"]},{"c":"010502","n":"Antena","cl":"01","sc":"0105","g":"Punto","d":"Dispositivo diseñado con el objetivo de emitir o recibir ondas electromagnéticas. Está ubicado sobre el suelo. (IDECOM 2022)","a":["CIC","BDA","SIR","MSL","EGL","FUN","FDD","OBS","SAG"],"f":1},{"c":"010503","n":"Traza de fibra óptica","cl":"01","sc":"0105","g":"Línea","d":"Representa la traza de los troncales de tendidos de fibra óptica de la Red Federal de Fibra Óptica (ReFeFO) - (IDECOM 2022)","a":["CIC","NOT","FDD","OBS","SAG"]},{"c":"010504","n":"Nodo de fibra óptica","cl":"01","sc":"0105","g":"Punto","d":"Los nodos son todos aquellos puntos de conexión físicos en la fibra óptica y son dispositivos que permiten la comunicación óptica bidireccional entre el usuario de una red coaxial y un operador cuya red troncal es de fibra óptica. En esta gama también se incluyen receptores ópticos como equipos terminales de usuario. (IDECOM 2022)","a":["CIC","BA1","FUN","FDD","OBS","SAG"]},{"c":"010601","n":"Ducto","cl":"01","sc":"0106","g":"Línea","d":"Serie de tubos conectados para el transporte de sólidos, líquidos o gases por bombeo.","a":["FNA","GNA","NAM","FUN","TDU","CAA","NOT","DIM","LZN","SAG"],"f":1},{"c":"010602","n":"Chimenea","cl":"01","sc":"0106","g":"Punto","d":"Conducto o cañón de sillería, hierro u hormigón de forma cónica truncada, sección circular, que permite la ventilación o evacuación de los gases de combustión.","a":["FUN","SAG"]},{"c":"010603","n":"Elevador de Granos","cl":"01","sc":"0106","g":"Punto","d":"Estructura que eleva y transportan los granos de manera vertical y horizontal entre las diferentes operaciones de la planta de almacenaje de granos. (Agroindustria, 2018)","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010701","n":"Silo","cl":"01","sc":"0107","g":"Punto","d":"Construcción en la cual se almacenan grandes cantidades de granos secos. Construcción de estructura cilíndrica, destinada al almacenamiento de granos, semillas, harinas, etc. Puede ser de chapa, hormigón, mampostería o cualquier otro material. (INDEC, CNA 2002)","a":["FUN","SAG"]},{"c":"010702","n":"Tanque de combustible","cl":"01","sc":"0107","g":"Punto/Polígono","d":"Depósito destinado a almacenar combustibles líquidos o gaseosos para su posterior utilización.","a":["FUN","SAG"]},{"c":"010801","n":"Vertedero, basurero","cl":"01","sc":"0108","g":"Polígono","d":"Área destinada al depósito de materiales de desecho, sin tratamiento previo.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010802","n":"Relleno sanitario","cl":"01","sc":"0108","g":"Polígono","d":"Área destinada al depósito definitivo de desechos con tratamiento ingenieril.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010803","n":"Planta de tratamiento de residuos","cl":"01","sc":"0108","g":"Polígono","d":"Instalaciones donde se realiza algún tipo de clasificación o tratamiento a los residuos. Incluye plantas de residuos patológicos plantas recicladoras, entre otros.","a":["FNA","GNA","NAM","FUN"],"f":1,"fa":["FNA","GNA","NAM","FUN","SAG"]},{"c":"010804","n":"Puesto separador de residuos","cl":"01","sc":"0108","g":"Punto","d":"Contenedores destinados a la deposición diferenciada de residuos domicialiarios. (IDE TDF 2022)","a":["IDC","FUN","WSC","SAG"]},{"c":"010901","n":"Cotos de caza","cl":"01","sc":"0109","g":"Polígono","d":"Superficie de terreno suceptible de aprovechamiento cinegético organizado con o sin fines de lucro, para un uso sustentable de la fauna silvestre, que haya sido registrado como tal por la autoridad competente. (Ley 1.194 Prov. De La Pampa) - (IDELP 2022)","a":["CAZ","SPP","TCD","SAG"]},{"c":"010902","n":"Campos autorizados","cl":"01","sc":"0109","g":"Polígono","d":"Son aquellos predios con alambrados perimetrales o interiores que contengan animales silvestres, donde se realice el manejo cinegético. Predios rurales o subrurales que se encuentren a mas de 2km de los centros poblados. (Ley 1,194 Prov. De la Pampa) - (IDELP 2022)","a":["CAO","SPP","TCD","SAG"]},{"c":"020101","n":"Edificio de comunicaciones","cl":"02","sc":"0201","g":"Punto","d":"Edificio público destinado a la transmisión y recepción de mensajes realizados por distintas tecnologías y medios.","a":["FNA","GNA","NAM","TC1","SAG"]},{"c":"020102","n":"Sitio de interés","cl":"02","sc":"0201","g":"Punto/Polígono","d":"Lugar declarado de importancia o de interés. Incluye sitio arqueológico, sitio histórico, entre otros. No incluye ruina.","a":["FNA","GNA","NAM","SAG"]},{"c":"020103","n":"Asentamiento humano","cl":"02","sc":"0201","g":"Punto","d":"Conjunto de edificios y elementos asociados emplazados en un lugar donde una comunidad se asienta y lleva a cabo actividades socioeconómicas. INDEC 2025 - (Adaptación de UN-GGIM)","a":["FNA","GNA","NAM","TYA","CA1","BA1","FDC","SAG"],"f":1},{"c":"020104","n":"Planta urbana","cl":"02","sc":"0201","g":"Polígono","d":"Área urbana aproximada que incluye la zona contigua de amanzanamiento edificado, cuyos límites son reconocibles.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"020105","n":"Ruina","cl":"02","sc":"0201","g":"Punto/Polígono","d":"Construcciones semidestruidas por acción del tiempo, antrópica o acontecimiento natural, que tienen reconocido valor histórico.","a":["FNA","GNA","NAM","SAG"]},{"c":"020106","n":"Casco de estancia","cl":"02","sc":"0201","g":"Punto","d":"Infraestructura principal, destinada a la vivienda, de un establecimiento rural cuyo principal uso es la cria extensiva de ganado, incluyendo estructuras y reducidas zonas de cultivos. (IDETDF 2022)","a":["FNA","GNA","NAM","SAG"]},{"c":"020201","n":"Cementerio","cl":"02","sc":"0202","g":"Punto/Polígono","d":"Espacio público o privado reservado para dar sepultura. Incluye cementerio parque, entre otros.","a":["FNA","GNA","NAM","FUN","CAA","SAG"]},{"c":"020202","n":"Refugio","cl":"02","sc":"0202","g":"Punto","d":"Estructura destinada a dar albergue eventualmente en zonas carentes de medios o bajo condiciones adversas.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"020203","n":"Monumento","cl":"02","sc":"0202","g":"Punto","d":"Obra arquitectónica o artística, sea conmemorativa o histórica. Incluye estatua, fuente, busto, inscripción, monolito, calvario, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"020204","n":"Espacio verde","cl":"02","sc":"0202","g":"Polígono","d":"Terreno reservado en toda planta urbana como espacio destinado a jardines para recreo y expansión de la población. Incluye plaza, plaza seca, rotonda, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"020301","n":"Complejo comercial","cl":"02","sc":"0203","g":"Polígono","d":"Instalación que consiste en locales comerciales y puede tener locales gastronómicos, de entretenimiento y de otros rubros. Puede contar con una amplia zona de estacionamiento. Incluye supermercado, mercado, mercado concentrador, entre otros.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"020302","n":"Centro de convenciones","cl":"02","sc":"0203","g":"Polígono","d":"Área donde existen instalaciones permanentes para realizar convenciones y exhibiciones.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"020303","n":"Alojamiento Turístico","cl":"02","sc":"0203","g":"Polígono","d":"Establecimiento de uso público que brinda alojamiento en forma habitual o temporaria, por un período determinado. Ley 4631/13 CABA.","a":["FNA","GNA","NAM","TAT","CAT","ADR","ADN","BAR","NCM","RZN","TIP","GES","ACC","SAG"]},{"c":"020304","n":"Prestador turístico","cl":"02","sc":"0203","g":"Punto","d":"Personas físicas o jurídicas que en forma habitual y permanente, o transitoria, desarrollan actividades con fines de lucro, dirigidas a los turistas (Ley profincial T.D.F. N° 65) - (INFUETUR 2024)","a":["ADR","ADN","NCM","RZN","TPR","SDA","SAG"]},{"c":"020305","n":"Agentes de viajes y turismo","cl":"02","sc":"0203","g":"Punto","d":"Personas físicas o jurídicasque estén inscriptas en el Registro Nacional de agentes de Viaje a cargo de la Federación Argentina de Asociaciones de Empresas de Viajes y Turismo (Resolición INFUETUR N° 541/2024) - (INFUETUR 2024)","a":["ADR","ADN","NCM","RZN","SAG"]},{"c":"020306","n":"Instalación turística","cl":"02","sc":"0203","g":"Punto/Línea","d":"Infraestructuras de pequeña escala, las cuales facilitan las prácticas netamente turísticas y que son imprescindibles para que una actividad pueda desarrollarse. (INFUETUR 2024)","a":["FNA","GNA","NAM","LZN","ARA","FUN","TIT","GDI","ACC","TIP","GES","FIN","SAG"]},{"c":"020307","n":"Evento turístico","cl":"02","sc":"0203","g":"Punto","d":"Son aquellos eventos de relevancia que estén organizados, o cuenten con la colaboración, de las Organizaciones de Gestión del Destino (OGD), que tiendan a generar la llegada de turistas, que aporte al posicionamiento y visibilidad del destino, y sean limitados en el tiempo. (INFUETUR 2024)","a":["FNA","GNA","NAM","TIE","PER","SAG"]},{"c":"020308","n":"Acceso a playa","cl":"02","sc":"0203","g":"Punto/Línea","d":"Camino o sendero por donde se accede a la playa, que puede tener o no estructuras artificiales, como una rampa que se nivela y se construye sobre una pendiente natural, o estructuras mas complejas. Su uso puede estar asociado al turismo, el esparcimiento o la pesca. También se denominan bajada a playa. (IDESoB 2025)","a":["FNA","GNA","NAM","SAG"]},{"c":"020401","n":"Anfiteatro","cl":"02","sc":"0204","g":"Polígono","d":"Lugar descubierto en forma de semicírculo, destinado a acoger espectáculos.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"020402","n":"Instalación deportiva y de esparcimiento","cl":"02","sc":"0204","g":"Punto/Polígono","d":"Instalación destinada al desarrollo de actividades sociales, recreativas y deportivas. Hace referencia a club, balneario, polígono de tiro, conjunto de canchas, campo de golf, campo de polo, pista de carreras, estadio, gimnasios urbanos, postas deportiva/aerobica, entre otros.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"020403","n":"Centro de montaña","cl":"02","sc":"0204","g":"Punto/Polígono","d":"Área que dispone de equipamiento para actividades de esparcimiento y deportes de invierno y verano en un espacio geográfico delimitado por colinas o montañas. Puede contener alojamiento y establecimientos gastronómicos. (INFUETUR 2024)","a":["FNA","GNA","NAM","ARA","ADR","ADN","PEA","APC","ACC","RZN","OBS","SAG"]},{"c":"020404","n":"Sendero","cl":"02","sc":"0204","g":"Línea","d":"Itinerario que cuenta con señalización y cuyo recorrido se encuentra dentro de las áreas recreativas turísticas. (INFUETUR 2024)","a":["FNA","GNA","NAM","CAA","LZN","GDC","DOT","TIR","EGL","SNL","SAG"]},{"c":"020501","n":"Casa de gobierno","cl":"02","sc":"0205","g":"Punto","d":"Asiento del Poder Ejecutivo de la Nación o Provincia.","a":["FNA","GNA","NAM","SAG"]},{"c":"020502","n":"Congreso","cl":"02","sc":"0205","g":"Punto","d":"Asiento del Poder Legislativo de la Nación, Provincia o Ciudad Autónoma de Buenos Aires. También se lo denomina Legislatura.","a":["FNA","GNA","NAM","SAG"]},{"c":"020503","n":"Tribunales","cl":"02","sc":"0205","g":"Punto","d":"Asiento de la autoridad del Poder Judicial de la Nación o Provincia.","a":["FNA","GNA","NAM","SAG"]},{"c":"020504","n":"Edificio de gobierno local","cl":"02","sc":"0205","g":"Punto","d":"Asiento de la máxima autoridad del gobierno local.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"020505","n":"Delegación de gobierno local","cl":"02","sc":"0205","g":"Punto","d":"Sede de descentralización del gobierno local.","a":["FNA","GNA","NAM","SAG"]},{"c":"020506","n":"Ministerio, secretaría","cl":"02","sc":"0205","g":"Punto","d":"Organismo ejecutivo del Estado de más alta jerarquía, inmediatamente por debajo del Presidente de la Nación en el caso del gobierno nacional, y de los gobernadores en el caso de las provincias, y del Jefe de Gobierno de la Ciudad de Buenos Aires, en el caso de la Ciudad Autónoma de Buenos Aires.","a":["FNA","GNA","NAM","SAG"]},{"c":"020507","n":"Juzgado","cl":"02","sc":"0205","g":"Punto","d":"Tribunal u órgano jurisdiccional con asiento de un juez.","a":["FNA","GNA","NAM","TJU","SAG"]},{"c":"020508","n":"Registro del estado civil y capacidad de las personas","cl":"02","sc":"0205","g":"Punto","d":"Organismo donde se asientan las actividades inherentes al registro del estado civil y la capacidad de las personas, de acuerdo a las disposiciones de leyes y decretos nacionales, provinciales y sus reglamentaciones, a fin de obtener su registración e identificación. Registra hechos vinculados al estado civil o la capacidad de las personas, como inscripción de nacimientos, matrimonios, defunciones, toma razón de aquellos hechos y actos jurídicos de carácter complementario, como adopciones, reconocimientos, divorcios, rectificaciones, anulaciones de registros y toda otra situación jurídicamente relevante que incida en las constancias registrales.","a":["FNA","GNA","NAM","SAG"]},{"c":"020509","n":"Centro cívico","cl":"02","sc":"0205","g":"Punto","d":"Equipamiento de carácter público para la prestación de servicios y actividades socioculturales, que actúa como lugar polivalente para facilitar el encuentro de personas, con el fin de fomentar la participación activa de la ciudadanía.","a":["FNA","GNA","NAM","SAG"]},{"c":"020510","n":"Centro integrador comunitario","cl":"02","sc":"0205","g":"Punto","d":"Espacio público de integración comunitaria, construido para el encuentro y la participación de diferentes actores que trabajan de modo intersectorial y participativo con el objetivo de promover el desarrollo local en pos de la inclusión social y del mejoramiento de la calidad de vida de las comunidades. Es una instancia de articulación entre el Gobierno nacional, provincial, municipal, organizaciones sociales y políticas y la sociedad civil.","a":["FNA","GNA","NAM","SAG"]},{"c":"020511","n":"Otro edificio gubernamental","cl":"02","sc":"0205","g":"Punto","d":"Hace referencia a otro tipo de edificio gubernamental no contemplado en los anteriores dominios. En este caso, los atributos de toponimia podrán aclararlo. Incluye comisionado comunal, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"020601","n":"Establecimiento educativo","cl":"02","sc":"0206","g":"Punto/Polígono","d":"Es la unidad institucional donde se registra la oferta educativa, cuya creación o autorización se registra bajo un acto administrativo - ley, decreto, resolución o disposición. Existe en él una autoridad máxima coo responsable pedagógico administrativo, con una planta funcional asignada, para impartir educacióna un grupo de alumnos. El establecimiento constituye la unidad organizacional que contiene en su interior a la/s unidades educativas, las cuales forman parte del establecimiento y se corresponden con cada uno de los niveles de enseñanza para los cuales se imparte educación. Un establecimiento puede funcionar en una o varias localizaciones geográficas. En caso de ser varias se compone de sede/s y anexo/s. Sede: es la localización donde cumple sus funciones la máxima autoridad pedagógica administrativa del establecimiento. La sede puede no tener alumnos. Anexo: es la localización donde funciona una sección o grupo de secciones que depende pedagógica y administrativamente de una localización sede y funciona en otro lugar geográfico (Ministerio de Educación, Ciencia y Tecnología, 2018).","a":["FNA","GNA","NAM","FUN","CUE","GES","AMG","MDE","NEN","PRE","SAG"],"f":1},{"c":"020602","n":"Institución universitaria","cl":"02","sc":"0206","g":"Punto/Polígono","d":"Institución de enseñanza superior que otorga distintos grados académicos. Incluye Universidades e Institutos Universitarios.","a":["FNA","GNA","NAM","FUN","IDI","TDI","CAA","SAG"],"f":1},{"c":"020701","n":"Edificio religioso","cl":"02","sc":"0207","g":"Punto","d":"Construcción destinada a la práctica de actividades religiosas.","a":["FNA","GNA","NAM","RFA","SAG"]},{"c":"020702","n":"Edificio de cultura","cl":"02","sc":"0207","g":"Punto","d":"Construcción destinada a la manifestación de expresiones culturales y artísticas.","a":["FNA","GNA","NAM","TE1","SAG"]},{"c":"020801","n":"Edificio de salud","cl":"02","sc":"0208","g":"Punto","d":"Construcción destinada a la asistencia de personas. Incluye hospital, sala de primeros auxilios, puesto asistencial, dispensario, entre otros.","a":["FNA","GNA","NAM","CAA","SAG"],"f":1},{"c":"020901","n":"Centro científico","cl":"02","sc":"0209","g":"Punto/Polígono","d":"Instalaciones destinadas a realizar investigaciones científicas. Incluye observatorio astronómico, polo científico y tecnológico, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"021001","n":"Ex centro clandestino de detencion","cl":"02","sc":"0210","g":"Punto","d":"Lugares que funcionaron como centros clandestinos de detención, durante el terrorismo de Estado ejercido en el país hasta el 10 de diciembre de 1983. (Leyes Nacional 26691 y Provincial 13584). Se incluye toda dependencia, lugar o predio militar, policial, privado o de propiedad estatal, que durante el período mencionado, hubiera alojado detenidos en forma ilegal o clandestina. (Sec DDHH Bs As - 2019)","a":["FNA","GNA","NAM","ODN","DTS","DTE","ZNM","SBZ","ARM","ETB","PCT","ETR","FUN","SEZ","MEM","CIR","SAG"]},{"c":"021002","n":"Comunidades indígenas","cl":"02","sc":"0210","g":"Polígono","d":"Area de influencia aproximada de aquellas comunidades indígenas en actividad, radicadas en el actual territorio de la República Argentina, considerando que acorde al Art. Nº 2 de la Ley Nº 23.302 (y su Decreto regalmentario 155/89) \"Se entenderá como comunidades indígenas á los conjuntos de familias que se reconozcan como tales por el hecho de descender de poblaciones que habitaban el territorio nacional en la época de la conquista o colonización e indígenas o indios a los miembros de dicha comunidad. NO representa ocupación territorial efectiva (la cual se establece a través del Programa Nacional Relevamiento Territorial de Comunidades Indígena RETECI, Resolución INAI Nº 587/07, para la ejecución Ley Nacional Nº 26.160)” (CPAI - Subsec. DDHH Bs As - 2021)","a":["FNA","GNA","NAM","PIP","NMB","NFC","SIN","SAG"]},{"c":"030101","n":"Ferrocarril","cl":"03","sc":"0301","g":"Línea","d":"Vía férrea constituida por dos o tres rieles paralelos entre sí, sobre los cuales encajan y giran las ruedas de los trenes (incluye varios modos: ferrocarril, subterráneo, tranvía, entre otros).","a":["FNA","GNA","NAM","FUN","RGC","LTN","RAL","CAA","LOC","SAG"],"f":1},{"c":"030102","n":"Estación ferroviaria","cl":"03","sc":"0301","g":"Punto/Polígono","d":"Instalación edilicia y demás dependencias donde regularmente se detiene el transporte ferroviario, suben y bajan pasajeros y / o mercancías. Incluye apeadero, embarcadero y parada.","a":["FNA","GNA","NAM","FUN","SAG"],"f":1},{"c":"030103","n":"Playa ferroviaria","cl":"03","sc":"0301","g":"Polígono","d":"Lugar que contiene talleres, galpones y vías destinadas al movimiento y acoplado de formaciones ferroviarias.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030201","n":"Red vial","cl":"03","sc":"0302","g":"Línea","d":"Trayecto diseñado con una superficie especialmente preparada, que se mantiene para ser usado por vehículos generalmente a motor.","a":["FNA","GNA","NAM","RTN","FUN","RST","TYP","MES","HCT","LOC","SAG"],"f":1},{"c":"030202","n":"Calle","cl":"03","sc":"0302","g":"Línea","d":"Vía de transporte para circulación en el interior de una planta urbana y que no es parte del acceso a la misma. Delimita las manzanas.","a":["FNA","GNA","NAM","FUN","RST","MES","HCT","LOC","SAG"],"f":1},{"c":"030203","n":"Huella","cl":"03","sc":"0302","g":"Línea","d":"Camino de acceso y recorrido de establecimientos. Incluye caminos de poca importancia que se desprenden de caminos de tierra, caminos demarcados en loteos, entre otros.","a":["CAA","SAG"],"f":1},{"c":"030204","n":"Senda","cl":"03","sc":"0302","g":"Línea","d":"Camino angosto de trazo sinuoso, abierto por el tránsito de personas, vehículos y/ o animales.","a":["TSE","CAA","SAG"]},{"c":"030205","n":"Picada","cl":"03","sc":"0302","g":"Línea","d":"Desmonte con diseño específico hecho con el objetivo de realizar estudios sísmicos, cortafuegos, gasoductos, oleoductos, u otros fines.","a":["CAA","SAG"]},{"c":"030206","n":"Línea de bus","cl":"03","sc":"0302","g":"Línea","d":"Recorrido de una línea de autotransporte público de pasajeros .","a":["FNA","GNA","NAM","RAL","CAA","LZN","SAG"]},{"c":"030207","n":"Parada de bus","cl":"03","sc":"0302","g":"Punto","d":"Parada correspondiente a una línea de servicios de autotransporte público de pasajeros.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030208","n":"Estación de ómnibus","cl":"03","sc":"0302","g":"Punto","d":"Predio destinado a la maniobra de ómnibus nacionales e internacionales, carga, ascenso y descenso de pasajeros. Puede o no tener aduana.","a":["FNA","GNA","NAM","FUN","SAG"],"f":1},{"c":"030301","n":"Transporte guiado aéreo","cl":"03","sc":"0303","g":"Línea","d":"Sistema de transporte que consiste en cables de carga unidos entre torres en los que están suspendidas las unidades. Incluye teleférico, entre otros.","a":["FNA","GNA","NAM","FUN","LZN","CAA","SAG"]},{"c":"030302","n":"Transporte guiado terrestre","cl":"03","sc":"0303","g":"Línea","d":"Sistema de transporte que consiste en cables conductores de la electricidad necesaria para el movimiento las unidades terrestres. Incluye trolebús, entre otros.","a":["FNA","GNA","NAM","FUN","LZN","CAA","SAG"]},{"c":"030303","n":"Estación de transporte guiado","cl":"03","sc":"0303","g":"Punto/Polígono","d":"Instalación edilicia y demás dependencias donde regularmente se detiene el transporte guiado por cable y suben y bajan pasajeros.","a":["FNA","GNA","NAM","FUN","LOC","SAG"]},{"c":"030401","n":"Derrota de balsa","cl":"03","sc":"0304","g":"Línea","d":"Recorrido que sigue una balsa definido por una línea imaginaria que une dos atracaderos.","a":["FNA","GNA","NAM","SAG"]},{"c":"030402","n":"Derrota recomendada","cl":"03","sc":"0304","g":"Línea","d":"Trayectoria o derrota no mantenida que se recomienda a todos o sólo a determinados buques.","a":["FNA","GNA","NAM","SAG"]},{"c":"030403","n":"Puerto","cl":"03","sc":"0304","g":"Punto/Polígono","d":"Lugar dotado de instalaciones de terminales y de transferencia para la carga y descarga de mercaderías o pasajeros. Incluye atracadero para balsas, clubes deportivos y cualquier otra instalación para transferencia de pasajeros y / o mercaderías. No incluye puerto natural.","a":["FNA","GNA","NAM","FUN","FUC","SAG"],"f":1},{"c":"030404","n":"Muelle","cl":"03","sc":"0304","g":"Línea","d":"Obra construida sobre el agua, afianzada en el lecho acuático por medio de bases que la sostienen firmemente, para facilitar tareas de atraque de embarcaciones, carga, descarga, embarque.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030405","n":"Vía navegable","cl":"03","sc":"0304","g":"Línea/Polígono","d":"Vía definida y mantenida por autoridad competente que permite la navegación de una embarcación. Incluye traza de canales en el Río de la Plata, accesos a puertos de La Plata, Buenos Aires y Bahía Blanca, entre otros. Incluye hidrovía.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"030406","n":"Ayuda a la navegación","cl":"03","sc":"0304","g":"Punto","d":"Objeto flotante o terrestre instalado en un lugar en particular cuya finalidad es servir como una ayuda a la navegación o para otros fines específicos. Incluye faro, boya, baliza, semáforo de costa, señal de niebla, luces, radiofaro, señal de enfilación, sistemas de posicionamiento fijo, entre otros.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030407","n":"Obstáculo para la navegación","cl":"03","sc":"0304","g":"Punto/Polígono","d":"Elemento o condición que podría impedir, obstruir, poner en peligro o constituir de otro modo un peligro para la seguridad a la navegación. Incluye naufragio, roca, fondo sucio, rompiente, escarceo, entre otros. No incluye bajo, banco.","a":["FNA","GNA","NAM","SAG"]},{"c":"030501","n":"Aeródromo","cl":"03","sc":"0305","g":"Punto/Polígono","d":"Zona definida sobre tierra o agua (incluidos eventuales edificios, instalaciones y equipos), cuyo propósito es ser utilizada total o parcialmente para la llegada, salida y movimiento en superficie de aeronaves y / o helicópteros.","a":["FNA","GNA","NAM","FUN","IKO","ITA","ANA","AER","CAA","SAG"],"f":1},{"c":"030502","n":"Ruta aérea","cl":"03","sc":"0305","g":"Línea","d":"Línea que representa el corredor aéreo definido entre el aeródromo de origen y el aeródromo de destino. (Línea de flujo ortodrómica)","a":["FNA","GNA","NAM","ILO","AER","SAG"],"f":1},{"c":"030503","n":"Pista","cl":"03","sc":"0305","g":"Línea","d":"Calzada rectangular de tierra o asfalto, definida en un campo de aviación o aeropuerto, utilizada para despegue y aterrizaje de aeronaves.","a":["FUN","RST","SAG"]},{"c":"030504","n":"Superficie de despegue","cl":"03","sc":"0305","g":"Polígono","d":"Espacio aéreo que debe mantenerse libre de obstáculos alrededor de un aeródromo para que puedan llevarse a cabo con seguridad las operaciones de aeronaves previstas, evitando que el aeródromo quede inutilizado por la multiplicidad de obstáculos en sus alrededores.","a":["FNA","GNA","NAM","CAA","SAG"]},{"c":"030601","n":"Puesto de control","cl":"03","sc":"0306","g":"Punto","d":"Lugar con instalaciones para controlar el paso, declarar y/o inspeccionar los bienes, vehículos y/o personas.","a":["FNA","GNA","NAM","BCP","SAG"]},{"c":"030701","n":"Puente","cl":"03","sc":"0307","g":"Punto/Línea","d":"Estructura que asegura la continuidad de una vía de transporte (red vial, calle, ferrocarril, entre otros) sobre un obstáculo natural o artificial del terreno (corriente de agua, canal, entre otros).","a":["FNA","GNA","NAM","FUN","TUP","MCC","BSC","FEO","SAG"],"f":1},{"c":"030702","n":"Alcantarilla","cl":"03","sc":"0307","g":"Punto/Línea","d":"Estructura ingenieril en forma tubular o en bóveda que se encuentra asociada a la red de transporte y que permite el cruce de una corriente de agua u otro obstáculo.","a":["FEO","SAG"]},{"c":"030703","n":"Túnel","cl":"03","sc":"0307","g":"Punto/Línea","d":"Paso subterráneo abierto artificialmente para establecer una comunicación a través de una montaña, por debajo de una corriente de agua u otro obstáculo.","a":["FNA","GNA","NAM","FUN","FEO","SAG"],"f":1},{"c":"030704","n":"Vado","cl":"03","sc":"0307","g":"Punto/Línea","d":"Lugar en una corriente de agua o espejo de agua con lecho más o menos firme y poco profundo, por donde es posible pasar a pie, caballo o vehículo.","a":["FEO","SAG"]},{"c":"030705","n":"Badén","cl":"03","sc":"0307","g":"Punto/Línea","d":"Piso artificial de roca u hormigón construido sobre el fondo natural de una corriente de agua o espejo de agua para facilitar su cruce.","a":["FEO","SAG"]},{"c":"030706","n":"Pasarela","cl":"03","sc":"0307","g":"Punto/Línea","d":"Estructura que permite el paso de peatones salvando algún obstáculo.","a":["FEO","SAG"]},{"c":"030707","n":"Cobertizo para nieve","cl":"03","sc":"0307","g":"Punto/Línea","d":"Estructura de madera, mampostería u hormigón, construida en los faldeos de los cerros, para proteger a las vías de transporte de la acumulación de nieve, derrumbes y avalanchas.","a":["FUN","FEO","SAG"]},{"c":"030708","n":"Guardaganado","cl":"03","sc":"0307","g":"Punto","d":"Reja de hierro o madera colocada transversalmente sobre un lugar de tránsito vial, para impedir el paso del ganado.","a":["FEO","SAG"]},{"c":"030709","n":"Cruce ferrovial","cl":"03","sc":"0307","g":"Punto","d":"Intersección definida entre una red vial o calle y una vía férrea.","a":["FUN","FEO","SAG"]},{"c":"030801","n":"Estación de servicio","cl":"03","sc":"0308","g":"Punto","d":"Instalación ubicada a la vera de una vía de comunicación, destinada a la provisión de combustible y asistencia mecánica a automotores.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030802","n":"Estación de peaje","cl":"03","sc":"0308","g":"Punto","d":"Instalación situada sobre una vía de transporte con el fin de cobrar la tasa correspondiente al mantenimiento, mejoramiento y conservación de la vía en cuestión.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030803","n":"Estación de pesaje","cl":"03","sc":"0308","g":"Punto","d":"Instalación pública ubicada al costado de una vía de comunicación, provista de una báscula o balanza destinada al pesaje de vehículos de transporte.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"030804","n":"Parador","cl":"03","sc":"0308","g":"Punto","d":"Predio a la vera de una vía de comunicación, con infraestructura de comedor, minimercados, duchas, descanso, estacionamientos y comunicaciones.","a":["FNA","SAG","FNA","SAG"]},{"c":"030805","n":"Indicador de kilómetros","cl":"03","sc":"0308","g":"Punto","d":"Mojón de madera, metal o cemento que indica la distancia en kilómetros desde ese punto al origen. Se sitúan alternativamente a un lado y otro en vías de transporte y ferrocarril.","a":["FNA","SAG"]},{"c":"030806","n":"Estación de bicicletas","cl":"03","sc":"0308","g":"Punto","d":"Estructura diseñada para el retiro y devolución de bicicletas públicas que pertenece a la infraestructura del sistema de transporte público. Una estación puede ser o no automática.","a":["FNA","SAG"]},{"c":"030807","n":"Bicisenda","cl":"03","sc":"0308","g":"Línea","d":"Sector señalizado y especialmente acondicionado en aceras y espacios verdes para la circulación de ciclo rodados. Las bicisendas se pueden instalar siempre que no generen conflictos con la circulación peatonal y sólo cuando en los tramos de arterias correspondientes no exista posibilidad de demarcar una ciclovía o ciclocarril.","a":["FNA","SAG"]},{"c":"030808","n":"Ciclovía","cl":"03","sc":"0308","g":"Línea","d":"Sector de la calzada señalizado especialmente con una separación que permita la circulación exclusiva de ciclo rodados (vehículo no motorizado de dos o más ruedas, impulsado por mecanismos con el esfuerzo de quien o quienes lo utilizan).","a":["FNA","SAG"]},{"c":"030809","n":"Centro de transbordo","cl":"03","sc":"0308","g":"Polígono","d":"Nodo central del sistema de transporte que permite la articulación entre redes de los distintos modos o entre líneas de un mismo modo de transporte, organizando el transporte. También se lo denomina estación intermodal.","a":["FNA","SAG","FNA","SAG"]},{"c":"030810","n":"Puesto de boleto electrónico","cl":"03","sc":"0308","g":"Punto","d":"Punto de venta y / o recarga de dispositivos de los sistemas de pago electrónico de boleto.","a":["FUN","TEM","SAG"]},{"c":"040101","n":"Océano","cl":"04","sc":"0401","g":"Polígono","d":"Vasta extensión de agua salada que ocupa cuencas oceánicas.","a":["FNA","GNA","NAM","SAG"]},{"c":"040102","n":"Costa","cl":"04","sc":"0401","g":"Línea","d":"Es la línea del nivel de agua más alto. Si existe una playa, la línea de costa es el límite de la playa hacia el lado de la tierra, por lo que corresponde aproximadamente a la marca de agua más alta de las mareas más altas.","a":["SAG"]},{"c":"040103","n":"Playa","cl":"04","sc":"0401","g":"Polígono","d":"Área ribereña de mar, corriente de agua o espejo de agua, que por lo general se caracteriza por ser una superficie casi plana de arena, conchilla o grava.","a":["FNA","GNA","NAM","SMC","SAG"]},{"c":"040104","n":"Accidente costero","cl":"04","sc":"0401","g":"Línea","d":"Configuración geomorfológica de la zona litoral.","a":["FNA","GNA","NAM","TA1","SAG"]},{"c":"040105","n":"Isla","cl":"04","sc":"0401","g":"Punto/Polígono","d":"Parte de la superficie terrestre rodeada de agua y de dimensiones menores que un continente.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"040301","n":"Curva batimétrica","cl":"04","sc":"0403","g":"Línea","d":"Línea trazada en un espejo de agua, corriente de agua, mar u océano, que une puntos de igual profundidad respecto de un nivel de referencia definido. También se la denomina isobata.","a":["CRV","SAG"],"f":1},{"c":"040302","n":"Accidente submarino","cl":"04","sc":"0403","g":"Punto/Polígono","d":"Elemento geomorfológico del fondo marino. Incluye cañadón submarino, banco (Burdwood/Namuncurá, entre otros), cordilleras submarinas, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"040601","n":"Mareógrafo, hidrómetro","cl":"04","sc":"0406","g":"Punto","d":"Dispositivo instalado con el fin de registrar las variaciones del nivel del agua a través del tiempo.","a":["FNA","GNA","NAM","SAG"]},{"c":"040602","n":"Estación de aforo","cl":"04","sc":"0406","g":"Punto","d":"Dispositivo utilizado para determinar la velocidad y el caudal del agua en una corriente de agua o canal.","a":["SAG"]},{"c":"040603","n":"Correntómetro, olígrafo","cl":"04","sc":"0406","g":"Punto","d":"Dispositivo que sirve para medir la velocidad y la dirección de las corrientes de agua, mareas, oleaje y / o viento, especialmente en las aguas marinas.","a":["SAG"]},{"c":"040604","n":"Boya","cl":"04","sc":"0406","g":"Punto","d":"Cuerpo flotante sujeto al fondo del mar que se coloca como señal, con fines de investigación (INIDEP 2022)","a":["IDB","TBO","SAG"]},{"c":"040605","n":"Punto, estación de muestreo","cl":"04","sc":"0406","g":"Punto","d":"Dispositivo que se utiliza en la medición de variables oceanográficas, pueden ser fijos o móviles o estar \"adjuntos\" a otro (INIDEP 2022)","a":["TEM","TPE","IDR","CE1","LAG","LAM","LAS","LGR","LOM","LOS","CDV","CDM","SAG"]},{"c":"040606","n":"Área de interés","cl":"04","sc":"0406","g":"Polígono","d":"Comprende la definción de objetivos de una colección de observaciones y/o el despliegue de instalaciones de monitoreo en el océano. por lo general tiene una perspectiva a largo plazo durante al menos algunos años, cubre un área de interés y se basa en legislación medioambiental (INIDEP 2022)","a":["FNA","GNA","NAM","DCT","ARA","SAG"]},{"c":"040607","n":"Campaña de investigación","cl":"04","sc":"0406","g":"Línea","d":"Travesía realizada en un lugar determinado por una embarcación con diferentes instrumentos de medición en el océano (INIDEP 2022)","a":["AM2","CBI","IDR","PRG","DTS","DTE","SAG"]},{"c":"041101","n":"Canal","cl":"04","sc":"0411","g":"Línea/Polígono","d":"Excavación artificial sin flujo o con flujo controlado, construido con el objetivo de transportar agua.","a":["FNA","GNA","NAM","FUN","SAG"]},{"c":"041102","n":"Corriente de agua","cl":"04","sc":"0411","g":"Línea/Polígono","d":"Flujo natural de agua que sigue los desniveles del terreno, siendo arreico o desembocando en otra corriente de agua, en un espejo de agua o en el mar.","a":["FNA","GNA","NAM","HYP","SI1","CU1","SAG"],"f":1},{"c":"041103","n":"Acequia, zanja, zanjón","cl":"04","sc":"0411","g":"Línea","d":"Excavación longilínea construida en la tierra, con o sin revestimiento, con el objetivo de conducir, drenar, irrigar o controlar el agua para riego u otros usos.","a":["FNA","GNA","NAM","SAG"]},{"c":"041104","n":"Dique","cl":"04","sc":"0411","g":"Punto/Línea","d":"Terraplén natural o artificial destinado a detener o estancar el escurrimiento del agua en su curso, a los efectos de su almacenamiento para fines rurales o industriales.","a":["FNA","GNA","NAM","FUN","SAG"],"f":1},{"c":"041105","n":"Rápido","cl":"04","sc":"0411","g":"Punto/Línea","d":"Sector de una corriente de agua donde ésta fluye con gran rapidez, debido a alteraciones provocadas por desniveles u obstrucciones en su lecho.","a":["FNA","GNA","NAM","SAG"]},{"c":"041106","n":"Embalse","cl":"04","sc":"0411","g":"Polígono","d":"Masa de agua retenida por una estructura artificial para su posterior aprovechamiento.","a":["FNA","GNA","NAM","EMP","RTP","VOL","SAG"]},{"c":"041107","n":"Espejo de agua","cl":"04","sc":"0411","g":"Polígono","d":"Cuerpo natural o artificial de agua, dulce o salada, cuyo aporte proviene de corrientes de agua, afloramientos subterráneos o precipitaciones. Quedan excluidos los embalses y los embalses rurales.","a":["FNA","GNA","NAM","HYP","SI1","CU1","SAG"],"f":1},{"c":"041108","n":"Fuente natural","cl":"04","sc":"0411","g":"Punto","d":"Flujo natural de agua formado por drenaje en la superficie o por afloramiento de la freática subterránea.","a":["FNA","GNA","NAM","SWT","SAG"]},{"c":"041109","n":"Catarata, cascada, salto","cl":"04","sc":"0411","g":"Punto/Línea","d":"Caída vertical de un curso de agua, producida por brusco desnivel del cauce.","a":[]},{"c":"041110","n":"Muro de embalse","cl":"04","sc":"0411","g":"Punto/Línea","d":"Represa construida transversalmente a una corriente de agua o canal para contener o controlar el caudal.","a":["FUN","SAG"]},{"c":"041111","n":"Humedal","cl":"04","sc":"0411","g":"Polígono","d":"Áreas del territorio que se caracterizan por la presencia temporaria o permanente de agua, suelos o sustratos característicos y biota adaptada a estas condiciones, comúnmente plantas hidrófitas. Incluye las extensiones de marismas, pantanos y turberas, o superficies cubiertas de aguas, sean éstas de régimen natural o artificial, permanentes o temporales, estancadas o corrientes, dulces, salobres o saladas, incluidas las extensiones de agua marina cuya profundidad en marea baja no exceda de seis metros.","a":["FNA","GNA","NAM","THH","SAG"]},{"c":"041112","n":"Tajamar","cl":"04","sc":"0411","g":"Línea","d":"Obra que une dos laderas que se aproximan mediante una cortina de tierra bien apisonada, con el objetivo de detener el escurrimiento del agua de lluvia, formando un espejo de agua.","a":["FNA","GNA","NAM","SAG"]},{"c":"041113","n":"Cuenca hidrográfica","cl":"04","sc":"0411","g":"Polígono","d":"Territorio drenado por un único sistema de drenaje natural, es decir, que a través de un curso hídrico, sus aguas pueden dar a un cuerpo de agua, infiltrarse o evaporarse.​ Una cuenca hidrográfica es delimitada por la línea de las cumbres, también llamada divisoria de aguas.","a":["FNA","GNA","NAM","JUR","DRE","ARA","SAG"]},{"c":"041115","n":"Subcuenca hidrográfica","cl":"04","sc":"0411","g":"Polígono","d":"Superficie de terreno cuya escorrentía superficial fluye en su totalidad a través de una serie de corrientes, ríos y, eventualmente, lagos, hacia un determinado punto de un curso de agua, generalmente un lago o una confluencia de ríos. (IDESoB 2024)","a":["FNA","GNA","NAM","SAG"]},{"c":"041116","n":"Acuífero","cl":"04","sc":"0411","g":"Polígono","d":"Estrato o formación geológica permeable que permite la circulación y el almacenamiento de agua subterránea por sus poros y grietas. Incluye el acuífero Guaraní y el acuífero Puelche, entre otros.","a":["CU1","DOF","CAL","SAG"]},{"c":"041117","n":"Escurrimiento superficial","cl":"04","sc":"0411","g":"Línea/Polígono","d":"Movimiento del agua en la superficie terrestre, a manera de un manto o lineal, que fluye por gravedad, después de fuertes precipitaciones pluviales o deshielos. (IDESoB 2025)","a":[]},{"c":"041201","n":"Frente marino","cl":"04","sc":"0412","g":"Línea","d":"Limite, variable en tiempo y espacio, entre dos masas de agua de características fisicas diferentes (DFDD)","a":["OCF","OFI","SAG"]},{"c":"041202","n":"Isolínea marina","cl":"04","sc":"0412","g":"Línea","d":"Curva que representa un valor particular de algún fenómeno físico o químico marino como la temperatura, la salinidad o la altura de las olas.","a":["VFQ","VPR","SAG"]},{"c":"041203","n":"Trayectoria","cl":"04","sc":"0412","g":"Línea/Multipunto","d":"Representación gráfica de las características fisico/quimicas del agua a lo largo de una trayectoria definida (INIDEP 2022)","a":["VFQ","VPR","SAG"]},{"c":"050101","n":"Curva de nivel","cl":"05","sc":"0501","g":"Línea","d":"Línea que une puntos que tienen el mismo valor de altitud respecto al nivel medio del mar. También se la denomina isohipsa o curva hipsométrica.","a":["HQC","CRV","MO2","SAG"],"f":1},{"c":"050102","n":"Punto acotado","cl":"05","sc":"0501","g":"Punto","d":"Punto del terreno que ha sido medido altimétricamente y no está materializado en el terreno.","a":["MSL","PDT","MO1","SAG"]},{"c":"050201","n":"Abra, paso, portillo, portezuelo","cl":"05","sc":"0502","g":"Punto","d":"Depresión del terreno entre dos alturas o cerros, que constituye un portal en unos casos o simplemente una puerta de paso a valles situados a ambos lados.","a":["FNA","GNA","NAM","SAG"]},{"c":"050202","n":"Caverna, gruta, cueva","cl":"05","sc":"0502","g":"Punto","d":"Cavidad subterránea y profunda, de formación natural o artificial, producida en la montaña o en la roca.","a":["FNA","GNA","NAM","SAG"]},{"c":"050203","n":"Cerro","cl":"05","sc":"0502","g":"Punto","d":"Elevación que sobresale de los lineamientos serranos o montañosos. Incluye monte, morro, nevado, pico, entre otros. No incluye volcán. El nevado es un cerro de gran altura que posee nieves perpetuas en su cumbre y permanece blanco durante todo el año. Un pico es una elevación montañosa, de cumbre aguda y puntiaguda con flancos escarpados.","a":["FNA","GNA","NAM","MSL","SAG"],"f":1},{"c":"050204","n":"Hoya","cl":"05","sc":"0502","g":"Punto","d":"Depresión cerrada del terreno, en donde puede existir presencia de agua.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050205","n":"Médano, duna","cl":"05","sc":"0502","g":"Polígono","d":"Acumulación de sedimentos sueltos, tamaño arena, que puede trasladarse por acción del viento. Puede estar en ambiente continental o costero.","a":["FNA","GNA","NAM","SAG"]},{"c":"050206","n":"Meseta","cl":"05","sc":"0502","g":"Polígono","d":"Forma de relieve elevada, plana y generalmente de gran extensión, limitada por barrancas, circundada por valles.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050207","n":"Mogote","cl":"05","sc":"0502","g":"Punto","d":"Elevación del terreno, cónica, aislada, y con su parte superior trunca.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050208","n":"Sierra","cl":"05","sc":"0502","g":"Línea","d":"Secuencia eslabonada de cerros que en conjunto presentan disposición longilínea y altitudes intermedias entre la cordillera y montañas. Incluye la serranía, entendida como una extensión sinónima de sierra, entre otros.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050209","n":"Barranca","cl":"05","sc":"0502","g":"Línea","d":"Desnivel pronunciado del terreno con pendiente variable y de origen diverso. En el caso de costa marina se denomina acantilado. En el caso de origen fluvial se denomina barranca. Si se encuentra en terreno no anexo a una corriente de agua o mar se denomina escarpa o barda.","a":["FNA","GNA","NAM","EGL","SAG"]},{"c":"050210","n":"Quebrada, cañadón, garganta","cl":"05","sc":"0502","g":"Línea","d":"Valle de paredes abruptas más o menos profundo que generalmente puede estar surcado por un curso de agua permanente o temporario. Incluye cajón, entre otros.","a":["FNA","GNA","NAM","SAG"]},{"c":"050211","n":"Cordillera","cl":"05","sc":"0502","g":"Línea","d":"Secuencia eslabonada de cadenas orográficas de considerable altura con una disposición homogénea y pertenecientes al mismo proceso orogénico.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050212","n":"Cordón","cl":"05","sc":"0502","g":"Línea","d":"Grupo de elevaciones con disposición orográfica similar e igual orogenia, que forman parte de una cordillera o sistema montañoso.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050213","n":"Cuchilla","cl":"05","sc":"0502","g":"Línea","d":"Elevación de poca altura, alargada y estrecha, con cumbre convexa y con pendientes suaves hacia el llano. Incluye lomada, entre otros.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050214","n":"Cuesta","cl":"05","sc":"0502","g":"Línea","d":"Parte de un relieve constituido por dos pendientes asimétricas, una abrupta y escarpada (cuesta propiamente dicha) y la opuesta, de suave inclinación.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050215","n":"Filo","cl":"05","sc":"0502","g":"Línea","d":"Cima de un cordón montañoso agudo, que es divisoria de aguas.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050216","n":"Huaico","cl":"05","sc":"0502","g":"Polígono","d":"Cañadón de paredes abruptas y a veces aterrazadas, por el que suele correr un curso de agua intermitente, coincidente con la época de lluvias y avenidas. Es producto de la acción conjunta de la erosión fluvial y eólica sumada a la meteorización de terrenos impermeables desintegrados por la acción pluvial y se encuentra asociado a climas áridos. También se lo denomina guaico.","a":["FNA","GNA","NAM","SAG"]},{"c":"050217","n":"Valle","cl":"05","sc":"0502","g":"Línea","d":"Forma de erosión fluvial cuyas laderas tienen alturas, pendientes y profundidades diversas.","a":["FNA","GNA","NAM","SAG"]},{"c":"050218","n":"Lugar geomorfológico","cl":"05","sc":"0502","g":"Línea","d":"Geoforma caracterizada por la acción de algún agente geomorfológico.","a":["FNA","GNA","NAM","TLG","SAG"]},{"c":"050219","n":"Línea de quiebre","cl":"05","sc":"0502","g":"Línea","d":"Línea donde se presenta un cambio de forma abrupta en la pendiente del terreno.","a":["TLQ","SAG"]},{"c":"050401","n":"Suelo consolidado","cl":"05","sc":"0504","g":"Polígono","d":"Superficie cuyas partes o partículas integrantes están unidas con una gran fuerza de cohesión interna. Corresponde a las rocas.","a":["TCC","SAG"]},{"c":"050402","n":"Suelo no consolidado","cl":"05","sc":"0504","g":"Polígono","d":"Superficie constituida por material sedimentario de variados tamaños, desde los mayores a los menores, cuya energía de unión es nula o muy baja.","a":["TSN","IPS","IED","CPT","UDR","SAG"]},{"c":"050403","n":"Suelo congelado","cl":"05","sc":"0504","g":"Polígono","d":"Superficie de material no consolidado que, por estar en zonas muy frías o por estar siempre cubierto de nieve o hielo, se congela la humedad retenida y con esto aumenta la dureza del mismo.","a":["TGG","SAG"]},{"c":"050601","n":"Volcán","cl":"05","sc":"0506","g":"Punto","d":"Conducto en la superficie de la Tierra, a través del cual asciende magma y gases asociados; también, se denomina a la estructura o forma (usualmente cónica) que se produce a partir del material eyectado (SEGEMAR, 2019).","a":["FNA","GNA","NAM","MSL","VOA","SAG"],"f":1},{"c":"050602","n":"Estación sismológica","cl":"05","sc":"0506","g":"Punto","d":"Recinto especialmente diseñado para albergar al sismógrafo. Lo ideal es que se encuentre alejado de ruidos naturales y culturales para aumentar su sensibilidad. Incluye acelerómetro.","a":["FNA","GNA","NAM","ESI","SAG"]},{"c":"050603","n":"Epicentro de sismo","cl":"05","sc":"0506","g":"Punto","d":"Punto de la superficie de la tierra que está directamente sobre el hipocentro de un sismo.","a":["CDV","EQD","SSA","IEM","SAG"]},{"c":"050701","n":"Glaciar","cl":"05","sc":"0507","g":"Punto/Polígono","d":"Masa de hielo permanente y en movimiento, alimentada desde un ventisquero y que en forma de lengua ocupa un valle moviéndose cuesta abajo. También incluye glaciar de circo, entre otros.","a":["FNA","GNA","NAM","FDD","SAG"]},{"c":"050702","n":"Ventisquero","cl":"05","sc":"0507","g":"Polígono","d":"Zona de alta montaña cubierta de nieve permanente, con precipitación nívea continua y que el viento transporta y acumula constituyendo la zona de acumulación de los glaciares.","a":["FNA","GNA","NAM","FDD","SAG"]},{"c":"050703","n":"Penitente","cl":"05","sc":"0507","g":"Polígono","d":"Remanente glaciar o de roca, en forma de aguja, columna aguda y filosa, generada por la acción eólica y los efectos de la radiación solar.","a":["FNA","GNA","NAM","FDD","SAG"]},{"c":"050704","n":"Morena, morrena","cl":"05","sc":"0507","g":"Línea/Polígono","d":"Lugar de acumulación heterogénea de detritos en cuanto a tamaño y composición que, llevada por el glaciar, es acumulada por éste.","a":["FNA","GNA","NAM","FDD","SAG"]},{"c":"050705","n":"Nunatak","cl":"05","sc":"0507","g":"Punto/Polígono","d":"Afloramiento rocoso rodeado de hielo.","a":["FNA","GNA","NAM","MSL","SAG"]},{"c":"050706","n":"Espesor del hielo","cl":"05","sc":"0507","g":"Punto","d":"Punto de referencia que indica el grosor del recubrimiento de la masa de hielo.","a":["FDD","EGL","SAG"]},{"c":"050707","n":"Borde de hielo","cl":"05","sc":"0507","g":"Línea","d":"Línea exterior que fija la posición que alcanza la masa de hielo.","a":["FDD","SAG"]},{"c":"050708","n":"Barrera de hielo","cl":"05","sc":"0507","g":"Línea/Polígono","d":"Masa de hielo permanente, flotante y de espesor variable, formada a lo largo de la costa y que se encuentra adherida a ella avanzando sobre el océano.","a":["FNA","GNA","NAM","FDD","SAG"]},{"c":"051001","n":"Falla","cl":"05","sc":"0510","g":"Línea","d":"Fractura macroscópica de los materiales de la corteza terrestre acompañada por el desplazamiento de los bloques.","a":["FNA","GNA","NAM","AZI","SDI","FDI","ACD","MDF","SAG"]},{"c":"051002","n":"Unidad geológica","cl":"05","sc":"0510","g":"Polígono","d":"Área cuyo volumen de roca es identificable de acuerdo a su origen y edad.","a":["FNA","GNA","NAM","ARA","SAG"]},{"c":"051101","n":"Ecorregión","cl":"05","sc":"0511","g":"Polígono","d":"Zona en las que dominan determinadas condiciones geomorfológicas y climáticas relativamente uniformes o recurrentes, caracterizada por una fisonomía vegetal de comunidades naturales y seminaturales que comparten un grupo considerable de especies dominantes, una dinámica y condiciones ecológicas generales cuyas interacciones son indispensables para su persistencia a largo plazo.","a":["FNA","GNA","NAM","ARA","SAG"]},{"c":"051201","n":"Tierras áridas","cl":"05","sc":"0512","g":"Polígono","d":"Área clasificada según la escasez estacional y / o anual de los recursos hídricos. Se define comúnmente como la insuficiencia de agua en el suelo y en la atmósfera.","a":["ARA","IDA","UDS","SAG"]},{"c":"051202","n":"Tierras degradadas","cl":"05","sc":"0512","g":"Polígono","d":"Área que sufre un cambio en la salud del suelo, resultando en una disminución de la capacidad del ecosistema para producir bienes o prestar servicios para sus beneficiarios. Las tierras degradadas cubren todos los cambios negativos en la capacidad del ecosistema para prestar bienes y servicios (incluso biológicos y servicios y bienes relacionados con el agua, y también su relación con bienes y servicios sociales y económicos).","a":["ARA","GDD","TDD","ETD","UDS","SAG"]},{"c":"051203","n":"Área de erosión","cl":"05","sc":"0512","g":"Polígono","d":"Zona del terreno donde los procesos de remoción han provocado una degradación areal de las partículas del suelo (por ejemplo: erosión por acción del viento) o a una degradación lineal con erosión profunda de diferentes grados (por ejemplo: erosión por acción de agua en movimiento). IDESoB 2025","a":["FNA","FDD","TDR","SAG"]},{"c":"051301","n":"Área protegida","cl":"05","sc":"0513","g":"Polígono","d":"Son zonas de ecosistemas continentales (terrestres o acuáticos), costeros/marinos o marinos, o una combinación de los mismos, con límites definidos y bajo un marco normativo acorde con sus objetivos de conservación, que constituyen una estrategia fundamental para la conservación a largo plazo de la diversidad biológica y cultural, proporcionando bienes y servicios ecosistémicos esenciales para la sociedad y la vida en general. (SIFAP 2023)","a":["FNA","GNA","NAM","TAP","ARA","DCT","CAA","SAG"],"f":1},{"c":"051302","n":"Reserva de Biosfera","cl":"05","sc":"0513","g":"Polígono","d":"Ecosistema terrestre o costero/ marino, o una combinación de los mismos, reconocido como tal en un plano internacional en el marco del Programa MAB (Hombre y la Atmósfera) de la UNESCO.","a":["FNA","GNA","NAM","ARA","DCT","SAG"],"f":1,"fn":"Reserva de biósfera"},{"c":"051303","n":"Sitio Ramsar","cl":"05","sc":"0513","g":"Polígono","d":"Son humedales que están incluidos en la Lista de Humedales de Importancia Internacional de la Convención sobre los Humedales (conocida como Convención de Ramsar). https://www.ramsar.org/sites/default/files/documents/library/ramsarsites_criteria_sp.pdf","a":["FNA","GNA","NAM","ARA","DCT","SAG"],"f":1},{"c":"051304","n":"Ordenamiento Territorial de Bosques Nativos","cl":"05","sc":"0513","g":"Polígono","d":"Áreas de protección ambiental a los bosques nativos según lo establecido en la Ley de 26.331. (OTBN)","a":["FNA","GNA","NAM","CAM","DCT","ARA","SAG"],"f":1,"fn":"Ordenamiento Territorial de Bosque Nativo"},{"c":"060101","n":"Área de cultivo de especies arbóreas","cl":"06","sc":"0601","g":"Polígono","d":"Área dedicada al cultivo de árboles bajo riego o en secano, sean latifoliados o coníferas.","a":["TCU","SAG"]},{"c":"060102","n":"Área de cultivo de arbustos","cl":"06","sc":"0601","g":"Polígono","d":"Área dedicada al cultivo de arbustos bajo riego o en secano.","a":["TCU","SAG"]},{"c":"060103","n":"Área de cultivo de herbáceas","cl":"06","sc":"0601","g":"Polígono","d":"Área dedicada al cultivo de herbáceas bajo riego o en secano, sean graminoideas, no graminoideas o múltiples.","a":["TCU","SAG"]},{"c":"060201","n":"Vegetación natural herbácea cerrada","cl":"06","sc":"0602","g":"Polígono","d":"Área de vegetación natural cubierta por pastizal cerrado, sea de cobertura simple, con árboles, con arbustos, o con árboles y arbustos.","a":["TDP","TVN","SAG"]},{"c":"060202","n":"Vegetación natural herbácea abierta","cl":"06","sc":"0602","g":"Polígono","d":"Área de vegetación natural cubierta por pastizal abierto, sea de cobertura simple, con árboles, con arbustos, o con árboles y arbustos.","a":["TDP","TVN","SAG"]},{"c":"060203","n":"Vegetación natural herbácea dispersa","cl":"06","sc":"0602","g":"Polígono","d":"Área de vegetación natural cubierta por pastizal disperso.","a":["SAG"]},{"c":"060301","n":"Área de vegetación natural arbórea cerrada","cl":"06","sc":"0603","g":"Polígono","d":"Área de vegetación natural cubierta por bosque cerrado, sea de un estrato arbóreo o de más de un estrato arbóreo, sin emergentes o con emergentes.","a":["CEA","TVN","SAG"]},{"c":"060302","n":"Área de vegetación natural arbórea abierta","cl":"06","sc":"0603","g":"Polígono","d":"Área de vegetación natural cubierta por bosque abierto, sea con arbustos, con estrato herbáceo, o con arbustos y emergentes.","a":["TBA","TVN","SAG"]},{"c":"060303","n":"Área de vegetación natural arbórea dispersa","cl":"06","sc":"0603","g":"Polígono","d":"Área de vegetación natural cubierta por árboles dispersos.","a":["SAG"]},{"c":"060901","n":"Área de vegetación natural arbustiva cerrada","cl":"06","sc":"0609","g":"Polígono","d":"Área de vegetación natural cubierta por arbustal cerrado, sea sin emergentes, con árboles emergentes, o con arbustos emergentes.","a":["TVA","TVN","SAG"]},{"c":"060902","n":"Área de vegetación natural arbustiva abierta","cl":"06","sc":"0609","g":"Polígono","d":"Área de vegetación natural cubierta por arbustal abierto, sea sin estrato herbáceo o con estrato herbáceo.","a":["TVA","TVN","SAG"]},{"c":"060903","n":"Área de vegetación natural arbustiva dispersa","cl":"06","sc":"0609","g":"Polígono","d":"Área de vegetación natural cubierta por arbustos dispersos.","a":["TVN","SAG"]},{"c":"070101","n":"Línea de base normal","cl":"07","sc":"0701","g":"Línea","d":"Línea a partir de la cual se mide el mar territorial, zona contigua, zona económica exclusiva y plataforma continental. También representa el límite exterior de las aguas interiores. Se define como la línea de bajamar a lo largo de la costa. Es la isobata de 0 metro, que corresponde al nivel del datum vertical local.","a":["SAG"],"f":1},{"c":"070102","n":"Línea de base recta","cl":"07","sc":"0701","g":"Línea","d":"Línea a partir de la cual se mide el mar territorial, zona contigua, zona económica exclusiva y plataforma continental. También representa el límite exterior de las aguas interiores. Se define como la línea recta que une puntos sobre la línea de base normal. Las líneas de base archipelágicas rectas definen la periferia de un grupo de islas.","a":["SAG"],"f":1},{"c":"070103","n":"Línea de costa","cl":"07","sc":"0701","g":"Línea","d":"Línea que marca el contacto entre una masa de tierra y un cuerpo de agua, establecida por la línea de las más bajas bajamares, ya sea en las aguas litorales o interiores.","a":["SAG"],"f":1},{"c":"070104","n":"Límite del lecho y subsuelo","cl":"07","sc":"0701","g":"Línea","d":"Línea demarcatoria de aguas jurisdiccionales en los fondos fluviales, definida en el Tratado del Río de la Plata y su Frente Marítimo.","a":["SAG"],"f":1},{"c":"070105","n":"Límite lateral marítimo","cl":"07","sc":"0701","g":"Línea","d":"Línea de deslinde entre mares jurisdiccionales contiguos, definida en el Tratado del Río de la Plata su Frente Marítimo.","a":["SAG"],"f":1},{"c":"070106","n":"Límite del Mar Territorial Argentino","cl":"07","sc":"0701","g":"Línea","d":"Delimitación exterior del Mar Territorial Argentino, el cual se extiende hasta una distancia de 12 millas marinas a partir de las líneas de base.","a":["SAG"],"f":1},{"c":"070107","n":"Mar Territorial Argentino","cl":"07","sc":"0701","g":"Polígono","d":"Zona marítima que se extiende hasta una distancia de 12 millas marinas a partir de la línea de base.","a":["SAG"],"f":1},{"c":"070108","n":"Límite de la Zona Contigua Argentina","cl":"07","sc":"0701","g":"Línea","d":"Delimitación exterior de la Zona Contigua Argentina, la cual se extiende más allá del límite exterior del mar territorial, hasta una distancia de 24 millas marinas medidas a partir de las líneas de base.","a":["SAG"],"f":1},{"c":"070109","n":"Zona Contigua Argentina","cl":"07","sc":"0701","g":"Polígono","d":"Zona marítima que se extiende desde el límite exterior del mar territorial, hasta una distancia de 24 millas marinas medidas a partir de las líneas de base.","a":["SAG"],"f":1},{"c":"070110","n":"Límite de la Zona Económica Exclusiva Argentina","cl":"07","sc":"0701","g":"Línea","d":"Delimitación exterior de la Zona Económica Exclusiva Argentina, la cual se extiende más allá del límite exterior del mar territorial, hasta una distancia de 200 millas marinas a partir de las líneas de base.","a":["SAG"],"f":1},{"c":"070111","n":"Zona Económica Exclusiva Argentina","cl":"07","sc":"0701","g":"Polígono","d":"Zona marítima que se extiende más allá del límite exterior del mar territorial, hasta una distancia de 200 millas marinas a partir de las líneas de base.","a":["SAG"],"f":1},{"c":"070112","n":"Límite de la Plataforma Continental","cl":"07","sc":"0701","g":"Línea","d":"Delimitación exterior de la Plataforma Continental, la cual comprende el lecho y el subsuelo de las áreas submarinas que se extienden más allá del mar territorial y a todo lo largo de la prolongación natural del territorio hasta el borde exterior del margen continental, o bien hasta una distancia de 200 millas marinas medidas a partir de las líneas de base, en los casos en que el borde exterior no llegue a esa distancia.","a":["SAG"],"f":1},{"c":"070113","n":"Plataforma Continental","cl":"07","sc":"0701","g":"Polígono","d":"Zona marítima que comprende el lecho y el subsuelo de las áreas submarinas que se extienden más allá del mar territorial y a todo lo largo de la prolongación natural del territorio hasta el borde exterior del margen continental, o bien hasta una distancia de 200 millas marinas contadas desde la línea de base, en los casos en que el borde exterior del margen continental no llegue a esa distancia.","a":["SAG"],"f":1},{"c":"070114","n":"Límite de gobierno local","cl":"07","sc":"0701","g":"Línea","d":"Línea que constituye la representación de la traza demarcadora que delimita un gobierno local (municipios, comunas y demás categorías) de menor jerarquía que un departamento o partido.","a":["VLP","SAG"],"f":1},{"c":"070115","n":"Límite interdepartamental o de partido","cl":"07","sc":"0701","g":"Línea","d":"Línea que constituye la representación de la traza demarcadora que delimita la jurisdicción de un departamento o partido de otro.","a":["VLP","SAG"],"f":1},{"c":"070116","n":"Límite interprovincial","cl":"07","sc":"0701","g":"Línea","d":"Línea que constituye la representación de la traza demarcadora que delimita una provincia de otra.","a":["VLJ","SAG"],"f":1},{"c":"070117","n":"Límite internacional","cl":"07","sc":"0701","g":"Línea","d":"Línea que constituye la representación de la traza demarcadora que delimita un país.","a":["SAG"],"f":1},{"c":"070118","n":"Límite de Zona de Frontera","cl":"07","sc":"0701","g":"Línea","d":"Línea que constituye la representación de la traza demarcadora que delimita la Zona de Frontera.","a":["SAG"],"f":1},{"c":"070119","n":"Zona de Frontera","cl":"07","sc":"0701","g":"Polígono","d":"Zona adyacente al límite internacional, que constituye una zona de seguridad destinada a complementar las previsiones territoriales de la defensa nacional y / o un área prioritaria para su desarrollo.","a":["TZ1","TZZ","SAG"],"f":1},{"c":"070120","n":"Gobierno local","cl":"07","sc":"0701","g":"Polígono","d":"División político administrativa de tercer orden, que incluye municipios, comunas, juntas vecinales y demás formas de gobierno local.","a":["FNA","GNA","NAM","CMU","CA3","TGL","SAG"],"f":1},{"c":"070121","n":"Departamento","cl":"07","sc":"0701","g":"Polígono","d":"División político administrativa de segundo orden. Incluye partido y comuna.","a":["FNA","GNA","NAM","CDE","CCA","ARA","CA3","SAG"],"f":1},{"c":"070122","n":"Provincia","cl":"07","sc":"0701","g":"Polígono","d":"División político territorial de primer orden. Incluye la Ciudad Autónoma de Buenos Aires (CABA).","a":["FNA","GNA","NAM","CPR","CA3","SAG"],"f":1},{"c":"070123","n":"País","cl":"07","sc":"0701","g":"Polígono","d":"Nación jurídicamente organizada.","a":["FNA","GNA","NAM","CA3","SAG"],"f":1},{"c":"070124","n":"Paso fronterizo","cl":"07","sc":"0701","g":"Punto","d":"Punto geográfico (hecho físico) que permite ingresar o salir de un país.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"070301","n":"Red RAMSAC","cl":"07","sc":"0703","g":"Punto","d":"Red de estaciones GPS/GNSS permanentes que poseen coordenadas en el Marco de Referencia Geodésico Nacional POSGAR 2007. Esta red es denominada Red Argentina de Monitoreo Satelital Continuo (RAMSAC).","a":["FUN","CER","AI1","SAG"],"f":1},{"c":"070302","n":"Red Geocéntrica","cl":"07","sc":"0703","g":"Punto","d":"Red de pilares o mojones de primer orden que poseen coordenadas en el Marco de Referencia Geodésico Nacional POSGAR 2007.","a":["MRG","FNA","PA1","PA2","PA3","PR1","PR2","PR3","PSG","DEN","RNI","LAG","LAM","LAS","LGR","LOM","LOS","AEL","PAL","EPG","ULV"],"f":1,"fa":["MRG","FNA","PA1","PA2","PA3","PR1","PR2","PR3","PSG","DEN","RNI","LAG","LAM","LAS","LGR","LOM","LOS","AEL","PAL","EPG","ULV","SAG"]},{"c":"070303","n":"Red Altimérica","cl":"07","sc":"0703","g":"Punto","d":"Red de pilares o mojones que poseen una altura referida al nivel medio del mar, a la que se la denomina cota.","a":[],"f":1,"fa":["MRG","FNA","LAG","LAM","LAS","LGR","LOM","LOS","PLA","PAL","COO","EPG","ULV"],"fn":"Red Altimétrica"},{"c":"070304","n":"Red gravimétrica","cl":"07","sc":"0703","g":"Punto","d":"Red de pilares o mojones que poseen un valor de aceleración de la gravedad en el datum gravimétrico por el Instituto Geográfico Nacional.","a":["MRG","FNA","LAG","LAM","LAS","LGR","LOM","LOS","PLA","PAL","COO","EPG","ULV"],"f":1,"fa":["MRG","FNA","LAG","LAM","LAS","LGR","LOM","LOS","PLA","AEL","COO","GSF","TGO","PAA","AM1","FDC","ULV"]},{"c":"070401","n":"Círculo Polar","cl":"07","sc":"0704","g":"Línea","d":"Cada uno de los dos paralelos situados a 66º 33' 45\" Norte y 66º 33' 45\" Sur, refiriéndose respectivamente a los círculos polares Ártico y Antártico.","a":["TCP","SAG"]},{"c":"070402","n":"Trópico","cl":"07","sc":"0704","g":"Línea","d":"Cada uno de los dos círculos imaginarios de la esfera celeste paralelos al Ecuador, ubicados aproximadamente a la latitudes de 23º 26` 17``,43 Norte y 23º 26` 17``,43 Sur.","a":["TTR","SAG"]},{"c":"070403","n":"Ecuador","cl":"07","sc":"0704","g":"Línea","d":"Círculo máximo, perpendicular al eje de rotación de la Tierra que la divide en dos hemisferios: Norte y Sur. En él se origina la coordenada geográfica latitud.","a":["SAG"]},{"c":"070404","n":"Meridiano de Greenwich","cl":"07","sc":"0704","g":"Línea","d":"Meridiano que pasa por el Real Observatorio de Greenwich, aceptado universalmente como meridiano principal, de longitud cero. A partir de él se mide la coordenada longitud.","a":["SAG"]},{"c":"070405","n":"Polo","cl":"07","sc":"0704","g":"Punto","d":"Cada uno de los dos puntos más septentrional y más austral de la superficie terrestre, opuestos entre sí.","a":["TP1","SAG"]},{"c":"070501","n":"Distrito","cl":"07","sc":"0705","g":"Polígono","d":"Espacio urbano que tiene una regulación en la subdivisión de la tierra, el tejido urbano, la intensidad de uso y los usos del suelo.","a":[]},{"c":"070502","n":"Barrio","cl":"07","sc":"0705","g":"Polígono","d":"División geográfica de tercer orden (DGEyC-GCBA).","a":[]},{"c":"070503","n":"Usos de suelo","cl":"07","sc":"0705","g":"Polígono","d":"La clasificación del uso de suelo está definida por las distintas categorías de espacios dentro de un municipio, en términos de los niveles de usos urbanos, de transición y rurales. (Mun SS de Jujuy - 2021)","a":[],"f":1,"fa":["COZ","DSP","SDP","ARA","SAG"]},{"c":"070504","n":"Ejido urbano","cl":"07","sc":"0705","g":"Polígono","d":"Área urbana delimitada legalmente.","a":[],"f":1,"fa":["FNA","GNA","NAM","SAG"]},{"c":"090101","n":"Edificio de seguridad","cl":"09","sc":"0901","g":"Punto","d":"Construcción destinada al asiento de la autoridad encargada de la seguridad.","a":["FNA","GNA","NAM","TES","SAG"],"f":1},{"c":"090102","n":"Institución penitenciaria","cl":"09","sc":"0901","g":"Punto/Polígono","d":"Instalación destinada al cumplimiento de las penas previstas en las sentencias judiciales, penas pecuniarias (multas) o pena de privación de ciertos derechos.","a":["FNA","GNA","NAM","SAG"]},{"c":"090103","n":"Cuartel de bomberos","cl":"09","sc":"0901","g":"Punto","d":"Estructura preparada para almacenar el equipamiento necesario para apagar fuegos, incluyendo mangueras, vehículos, equipos de protección del personal, extintores de fuego, entre otros. Puede tener también dormitorios e instalaciones de trabajo como salas de reunión, entre otros.","a":["FNA","GNA","NAM","SAG"],"f":1},{"c":"090104","n":"Instalación militar","cl":"09","sc":"0901","g":"Punto","d":"Instalación destinada al asentamiento de paz de las Fuerzas Armadas.","a":["FNA","GNA","NAM","FAA","SAG"]},{"c":"100101","n":"Avalancha de nieve","cl":"10","sc":"1001","g":"Punto","d":"Lugar de deslizamiento gravitacional de nieve.","a":["DCT","CAU","DMA","SAG"]},{"c":"100201","n":"Estación meteorológica","cl":"10","sc":"1002","g":"Punto","d":"Instalación destinada a medir y registrar regularmente diversas variables meteorológicas.","a":["FNA","GNA","NAM","TEM","CEM","CE1","SAG"]},{"c":"100202","n":"Estación de ozono y altura","cl":"10","sc":"1002","g":"Punto","d":"Instalación destinada a medir y registrar regularmente diversas variables relacionadas con la capa de ozono y la vigilancia atmosférica.","a":["FNA","GNA","NAM","CEO","SAG"]},{"c":"100203","n":"Isoterma","cl":"10","sc":"1002","g":"Línea","d":"Línea que une puntos de igual temperatura media anual en un determinado período de tiempo.","a":["VDI","SAG"]},{"c":"100204","n":"Isohieta","cl":"10","sc":"1002","g":"Línea","d":"Línea que une puntos de igual precipitación media anual en un determinado período de tiempo.","a":["VDA","SAG"]},{"c":"100301","n":"Región climática cálida","cl":"10","sc":"1003","g":"Polígono","d":"Área bioclimática considerada de rigor climático por calor, según la influencia del clima sobre la actividad educativa.","a":["RIC","SAG"]},{"c":"100302","n":"Región climática fría","cl":"10","sc":"1003","g":"Polígono","d":"Área bioclimática considerada de rigor climático por frío, según la influencia del clima sobre la actividad educativa.","a":["RIC","SAG"]},{"c":"100303","n":"Zona según frecuencia anual media de nevadas","cl":"10","sc":"1003","g":"Polígono","d":"Área definida en función de las precipitaciones nivales.","a":["IFN","SAG"]},{"c":"100304","n":"Zona según riesgo UV","cl":"10","sc":"1003","g":"Polígono","d":"Área definida por la peligrosidad de la exposición ante la radiación solar.","a":["RUV","SAG"]},{"c":"100305","n":"Zona según frecuencia anual media de heladas","cl":"10","sc":"1003","g":"Polígono","d":"Área definida en función del la ocurrencia media de heladas..","a":["IFH","SAG"]},{"c":"100306","n":"Zona según frecuencia anual media de granizadas","cl":"10","sc":"1003","g":"Polígono","d":"Área definida en función del la ocurrencia media de granizadas.","a":["IFG","SAG"]},{"c":"110101","n":"Parcela","cl":"11","sc":"1101","g":"Polígono","d":"Extensión territorial continua, deslindada por un polígono de límites conocidos, perteneciente a un propietario.","a":["CCA","PDA","TPA","ARA","NMP","SAG"],"f":1},{"c":"110102","n":"Macizo","cl":"11","sc":"1101","g":"Polígono","d":"Extensión de territorio cuya superficie varía según su tipología y ubicación; y que por lo general está totalmente rodeado de vías de circulación. Se interpreta como macizo al área conformada por la sucesión de los frentes y ochavas de cada parcela, que separa el dominio privado de la vía pública, y que no siempre se materializa constructivamente.","a":["CCA","TYM","TPA","ARA","SAG"],"f":1},{"c":"110103","n":"Sección catastral","cl":"11","sc":"1101","g":"Polígono","d":"Registro administrativo dependiente del Estado en el que se describen los bienes inmuebles.","a":["CCA","TPA","ARA","SAG"],"f":1},{"c":"110104","n":"Circunscripción","cl":"11","sc":"1101","g":"Polígono","d":"Polígonos en los que un Partido (Departamento) se subdivide, pudiendo contener en conjunto o separadamente plantas urbanas, suburbanas y rurales (ARBA,2018).","a":["CCA","ARA","SAG"],"f":1},{"c":"110105","n":"Subparcela","cl":"11","sc":"1101","g":"Polígono","d":"La propiedad de la unidad funcional o subparcela comprende la parte indivisa del terreno, de las cosas y partes de uso común del inmueble o indispensables para mantener su seguridad, y puede abarcar una o más unidades complementarias destinadas a servirla (ARBA, 2018).","a":["CCA","PDA","ARA","SAG"]},{"c":"110106","n":"Lado catastral","cl":"11","sc":"1101","g":"Línea","d":"Valor numérico del lado de un polígono (referido a un objeto catastral) que representa su longitud (ARBA, 2018).","a":["CCA","TDL","LZN","FEO","SAG"]},{"c":"110107","n":"Conjunto Inmobiliario","cl":"11","sc":"1101","g":"Polígono","d":"Son conjuntos inmobiliarios los clubes de campo, barrios cerrados o privados, parques industriales, empresariales o náuticos, o cualquier otro emprendimiento urbanístico independientemente del destino de vivienda permanente o temporaria, laboral, comercial o empresarial que tenga, comprendidos asimismo aquellos que contemplan usos mixtos, con arreglo a lo dispuesto en las normas administrativas locales. (ARBA 2019)","a":["FNA","GNA","NAM","TCI","ARA","SAG"]},{"c":"110108","n":"Parcela superficiaria","cl":"11","sc":"1101","g":"Polígono","d":"Es la parcela catastral sobre la que se ejerce el derecho de superficie, que es un derecho real temporario, que se constituye sobre un inmueble ajeno, que otorga a su titular la facultad de uso, goce y disposición material y jurídica del derecho de plantar, forestar o construir, o sobre lo plantado, forestado o construido en el terreno, el vuelo o el subsuelo, según las modalidades de su ejercicio y plazo de duración establecidos en el título suficiente para su constitución y dentro de lo previsto en el título VII del Código Civil y las leyes especiales. (ARBA 2019)","a":["CCA","PDA","TPA","ARA","NMP","EGL","SAG"]},{"c":"110109","n":"Cementerio privado","cl":"11","sc":"1101","g":"Polígono","d":"Se consideran cementerios privados a los inmuebles de propiedad privada afectados a la inhumación de restos humanos. Art. 2103 - CCCN - (UNCa - 2024)","a":["FNA","GNA","NAM","CCA","PDA","TPA","ARA","NMP","NUP","SAG"]},{"c":"110110","n":"Tiempo compartido","cl":"11","sc":"1101","g":"Polígono","d":"Se considera que existe tiempo compartido si uno o mas bienes están afectados a su uso periódico y por turnos, para alojamiento, hospedaje, comercio, turismo, industria u otros fines y para brindar las prestaciones compatibles con su destino. Art. 2087 - CCCN - (UNCa - 2024)","a":["FNA","GNA","NAM","CCA","PDA","TPA","ARA","NMP","NUP","SAG"]},{"c":"110201","n":"Cateo","cl":"11","sc":"1102","g":"Polígono","d":"Permiso exclusivo para prospectar un área determinada, por el tiempo y la extensión que señala la Ley.","a":["NEX","ARA","SAG"]},{"c":"110202","n":"Pertenencia","cl":"11","sc":"1102","g":"Polígono","d":"Extensión del terreno dentro de cuyos límites es posible realizar actividades de prospección. El terreno correspondiente a cada pertenencia se determina en superficie por líneas rectas, y en profundidad por planos verticales indicados por esas líneas.","a":["NEX","PPO","ARA","SAG"]},{"c":"110203","n":"Manifestación de descubrimiento","cl":"11","sc":"1102","g":"Punto","d":"Localización de un criadero mineral a ser explorado. Se encuentra asociada a un área de exploración y constituye la causa originaria mas importante de adquisición de las concesiones mineras.","a":["NEX","PPO","SAG"]},{"c":"120101","n":"Fracción censal","cl":"12","sc":"1201","g":"Polígono","d":"Unidad operativa que subdivide

e cumple sus funciones la máxima autoridad pedagógica administrativa del establecimiento. La sede puede no tener alumnos. Anexo: es la localización donde funciona una sección o grupo de secciones que depende pedagógica y administrativamente de una localización sede y funciona en otro lugar geográfico (Ministerio de Educación, Ciencia y Tecnología, 2018).","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",206.0,"EDUCACIÓN",20601.0,"Establecimiento educativo","Punto","Río Cuarto","","Descripción de institucion educativa  pública o privada discriminada también por nivel inicial, primario o secundario.",""],["",2.0,"INFRAESTRUCTURA SOCIAL",206.0,"EDUCACIÓN",20602.0,"Institución universitaria","Punto/Polígono","","Institución de enseñanza superior que otorga distintos grados académicos. Incluye Universidades e Institutos Universitarios.","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",207.0,"CULTURA",20701.0,"Edificio religioso","Punto","","Construcción destinada a la práctica de actividades religiosas.","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",207.0,"CULTURA",20702.0,"Edificio de cultura","Punto","","Construcción destinada a la manifestación de expresiones culturales y artísticas.","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",208.0,"SALUD",20801.0,"Edificio de salud","Punto","","Construcción destinada a la asistencia de personas. Incluye hospital, sala de primeros auxilios, puesto asistencial, dispensario, entre otros.","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",208.0,"SALUD",20801.0,"Dispensarios","Punto","Río Cuarto","","Ubicacion del centro sanitario de atencion primaria.",""],["",2.0,"INFRAESTRUCTURA SOCIAL",208.0,"SALUD",20801.0,"Zona de Influencia de Dispensarios","Poligono","Río Cuarto","","Sector de influencia en la atencion primaria de un dispensario.",""],["",2.0,"INFRAESTRUCTURA SOCIAL",209.0,"TECNOLOGÍA Y CIENCIA",20901.0,"Centro científico","Punto/Polígono","","Instalaciones destinadas a realizar investigaciones científicas. Incluye observatorio astronómico, polo científico y tecnológico, entre otros.","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",210.0,"DERECHOS HUMANOS",21001.0,"Ex centro clandestino de detencion","Punto","","Lugares que funcionaron como centros clandestinos de detención, durante el terrorismo de Estado ejercido en el país hasta el 10 de diciembre de 1983. (Leyes Nacional 26691 y Provincial 13584). Se incluye toda dependencia, lugar o predio militar, policial, privado o de propiedad estatal, que durante el período mencionado, hubiera alojado detenidos en forma ilegal o clandestina. (Sec DDHH Bs As - 2019)","",""],["",2.0,"INFRAESTRUCTURA SOCIAL",210.0,"DERECHOS HUMANOS",21002.0,"Comunidades indígenas","Polígono","","Area de influencia aproximada de aquellas comunidades indígenas en actividad, radicadas en el actual territorio de la República Argentina, considerando que acorde al Art. Nº 2 de la Ley Nº 23.302 (y su Decreto regalmentario 155/89) \"Se entenderá como comunidades indígenas á los conjuntos de familias que se reconozcan como tales por el hecho de descender de poblaciones que habitaban el territorio nacional en la época de la conquista o colonización e indígenas o indios a los miembros de dicha comunidad. NO representa ocupación territorial efectiva (la cual se establece a través del Programa Nacional Relevamiento Territorial de Comunidades Indígena RETECI, Resolución INAI Nº 587/07, para la ejecución Ley Nacional Nº 26.160)” (CPAI - Subsec. DDHH Bs As - 2021)","",""],["",3.0,"TRANSPORTE",301.0,"FERROVIARIO",30101.0,"Ferrocarril","Línea","","Vía férrea constituida por dos o tres rieles paralelos entre sí, sobre los cuales encajan y giran las ruedas de los trenes (incluye varios modos: ferrocarril, subterráneo, tranvía, entre otros).","",""],["",3.0,"TRANSPORTE",301.0,"FERROVIARIO",30102.0,"Estación ferroviaria","Punto/Polígono","","Instalación edilicia y demás dependencias donde regularmente se detiene el transporte ferroviario, suben y bajan pasajeros y / o mercancías. Incluye apeadero, embarcadero y parada.","",""],["",3.0,"TRANSPORTE",301.0,"FERROVIARIO",30103.0,"Playa ferroviaria","Polígono","","Lugar que contiene talleres, galpones y vías destinadas al movimiento y acoplado de formaciones ferroviarias.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30201.0,"Red vial","Línea","","Trayecto diseñado con una superficie especialmente preparada, que se mantiene para ser usado por vehículos generalmente a motor.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30202.0,"Calle","Línea","","Vía de transporte para circulación en el interior de una planta urbana y que no es parte del acceso a la misma. Delimita las manzanas.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30203.0,"Huella","Línea","","Camino de acceso y recorrido de establecimientos. Incluye caminos de poca importancia que se desprenden de caminos de tierra, caminos demarcados en loteos, entre otros.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30204.0,"Senda","Línea","","Camino angosto de trazo sinuoso,  abierto por el tránsito de personas, vehículos y/ o animales.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30205.0,"Picada","Línea","","Desmonte con diseño específico hecho con el objetivo de realizar estudios sísmicos, cortafuegos, gasoductos, oleoductos, u otros fines.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30206.0,"Línea de bus","Línea","","Recorrido de una línea de autotransporte público de pasajeros .","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30207.0,"Parada de bus","Punto","","Parada correspondiente a una línea de servicios de autotransporte público de pasajeros.","",""],["",3.0,"TRANSPORTE",302.0,"VIAL",30208.0,"Estación de ómnibus","Punto","","Predio destinado a la maniobra de ómnibus nacionales e internacionales, carga, ascenso y descenso de pasajeros. Puede o no tener aduana.","",""],["",3.0,"TRANSPORTE",303.0,"TRANSPORTE POR GUÍA",30301.0,"Transporte guiado aéreo","Línea","","Sistema de transporte que consiste en cables de carga unidos entre torres en los que están suspendidas las unidades. Incluye teleférico, entre otros.","",""],["",3.0,"TRANSPORTE",303.0,"TRANSPORTE POR GUÍA",30302.0,"Transporte guiado terrestre","Línea","","Sistema de transporte que consiste en cables conductores de la electricidad necesaria para el movimiento las unidades terrestres. Incluye trolebús, entre otros.","",""],["",3.0,"TRANSPORTE",303.0,"TRANSPORTE POR GUÍA",30303.0,"Estación de transporte guiado","Punto/Polígono","","Instalación edilicia y demás dependencias donde regularmente se detiene el transporte guiado por cable y suben y bajan pasajeros.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30401.0,"Derrota de balsa","Línea","","Recorrido que sigue una balsa definido por una línea imaginaria que une dos atracaderos.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30402.0,"Derrota recomendada","Línea","","Trayectoria o derrota no mantenida que se recomienda a todos o sólo a determinados buques.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30403.0,"Puerto","Punto/Polígono","","Lugar dotado de instalaciones de terminales y de transferencia para la carga y descarga de mercaderías o pasajeros. Incluye atracadero para balsas, clubes deportivos y cualquier otra instalación para transferencia de pasajeros y / o mercaderías. No incluye puerto natural.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30404.0,"Muelle","Línea","","Obra construida sobre el agua, afianzada en el lecho acuático por medio de bases que la sostienen firmemente, para facilitar tareas de atraque de embarcaciones, carga, descarga, embarque.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30405.0,"Vía navegable","Línea/Polígono","","Vía  definida y mantenida por autoridad competente que permite la navegación de una embarcación. Incluye traza de canales en el Río de la Plata, accesos a puertos de La Plata, Buenos Aires y Bahía Blanca, entre otros. Incluye hidrovía.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30406.0,"Ayuda a la navegación","Punto","","Objeto flotante o terrestre instalado en un lugar en particular cuya finalidad es servir como una ayuda a la navegación o para otros fines específicos. Incluye faro, boya, baliza, semáforo de costa, señal de niebla, luces, radiofaro, señal de enfilación, sistemas de posicionamiento fijo, entre otros.","",""],["",3.0,"TRANSPORTE",304.0,"FLUVIAL, MARÍTIMO Y LACUSTRE",30407.0,"Obstáculo para la navegación","Punto/Polígono","","Elemento o condición que podría impedir, obstruir, poner en peligro o constituir de otro modo un peligro para la seguridad a la navegación. Incluye naufragio, roca, fondo sucio, rompiente, escarceo, entre otros. No incluye bajo, banco.","",""],["",3.0,"TRANSPORTE",305.0,"AÉREO",30501.0,"Aeródromo","Punto/Polígono","","Zona definida sobre tierra o agua (incluidos eventuales edificios, instalaciones y equipos), cuyo propósito es ser utilizada total o parcialmente para la llegada, salida y movimiento en superficie de aeronaves y / o helicópteros.","",""],["",3.0,"TRANSPORTE",305.0,"AÉREO",30502.0,"Ruta aérea","Línea","","Línea que representa el corredor aéreo definido entre el aeródromo de origen y el aeródromo de destino. (Línea de flujo ortodrómica)","",""],["",3.0,"TRANSPORTE",305.0,"AÉREO",30503.0,"Pista","Línea","","Calzada rectangular de tierra o asfalto, definida en un campo de aviación o aeropuerto, utilizada para despegue y aterrizaje de aeronaves.","",""],["",3.0,"TRANSPORTE",305.0,"AÉREO",30504.0,"Superficie de despegue","Polígono","","Espacio aéreo que debe mantenerse libre de obstáculos alrededor de un aeródromo para que puedan llevarse a cabo con seguridad las operaciones de aeronaves previstas, evitando que el aeródromo quede inutilizado por la multiplicidad de obstáculos en sus alrededores.","",""],["",3.0,"TRANSPORTE",306.0,"CONTROLES",30601.0,"Puesto de control","Punto","","Lugar con instalaciones para controlar el paso, declarar y/o inspeccionar los bienes, vehículos y/o personas.","",""],["",3.0,"TRANSPORTE",306.0,"CONTROLES",30602.0,"Cámara / Radar","Punto","","","Dispositivo tecnológico, óptico, electrónico o cinemométrico instalado de forma fija o móvil en la vía pública o sobre infraestructura de transporte, destinado a la fiscalización, registro y/o sanción de infracciones de tránsito (exceso de velocidad, cruce de semáforo en rojo, invasión de senda peatonal) o al monitoreo y conteo del flujo vehicular.",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30701.0,"Puente","Punto/Línea","","Estructura que asegura la continuidad de una vía de transporte (red vial, calle, ferrocarril, entre otros) sobre un obstáculo natural o artificial del terreno (corriente de agua, canal, entre otros).","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30702.0,"Alcantarilla","Punto/Línea","","Estructura ingenieril en forma tubular o en bóveda que se encuentra asociada a la red de transporte y que permite el cruce de una corriente de agua u otro obstáculo.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30703.0,"Túnel","Punto/Línea","","Paso subterráneo abierto artificialmente para establecer una comunicación a través de una montaña, por debajo de una corriente de agua u otro obstáculo.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30704.0,"Vado","Punto/Línea","","Lugar en una corriente de agua o espejo de agua con lecho más o menos firme y poco profundo, por donde es posible pasar a pie, caballo o vehículo.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30705.0,"Badén","Punto/Línea","","Piso artificial de roca u hormigón construido sobre el fondo natural de una corriente de agua o espejo de agua para facilitar su cruce.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30706.0,"Pasarela","Punto/Línea","","Estructura que permite el paso de peatones salvando algún obstáculo.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30707.0,"Cobertizo para nieve","Punto/Línea","","Estructura de madera, mampostería u hormigón, construida en los faldeos de los cerros, para proteger a las vías de transporte de la acumulación de nieve, derrumbes y avalanchas.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30708.0,"Guardaganado","Punto","","Reja de hierro o madera colocada transversalmente sobre un lugar de tránsito vial, para impedir el paso del ganado.","",""],["",3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30709.0,"Cruce ferrovial","Punto","","Intersección definida entre una red vial o calle y una vía férrea.","",""],[12.0,3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30710.0,"Semáforo","Punto","","","Dispositivo óptico y regulador de tramo o intersección vial que emite señales lumínicas de colores normalizados (rojo, amarillo, verde) para regular de manera alternativa y ordenada la prioridad de paso de vehículos, peatones y ciclistas en la red urbana.",""],[13.0,3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30711.0,"Nomenclador de arterias","Punto","","","",""],[14.0,3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30712.0,"Rampa","Punto","","","Plano inclinado u obra de infraestructura vial y peatonal construida en aceras, esquinas o accesos a edificios y espacios públicos, destinada a superar desniveles fijos para garantizar la accesibilidad universal y facilitar el desplazamiento de personas con movilidad reducida, cochecitos de bebé o vehículos livianos de traslado.",""],[15.0,3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30713.0,"Darsena","Punto","","","",""],[16.0,3.0,"TRANSPORTE",307.0,"CRUCES Y ENLACES",30714.0,"Siniestro vial","Punto","","","",""],[17.0,3.0,"TRANSPORTE",302.0,"CRUCES Y ENLACES","","Rotonda","Punto","Lujan de Cuyo","","",""],[18.0,3.0,"TRANSPORTE",302.0,"CRUCES Y ENLACES",30716.0,"Reductor de velocidad","Punto","Lujan de Cuyo","","Obra de infraestructura, elemento o deformación física sobre la calzada (ejecutada en asfalto, hormigón, plástico, metálico, etc.), destinada a reducir la velocidad de circulación vehicular o generar una alerta táctil y acústica en el conductor. Comprende salientes semicirculares o trapezoidales elevadas, dispositivos modulares premoldeados y franjas de relieve vibratorio o sonoro.",""],[19.0,3.0,"TRANSPORTE",302.0,"CRUCES Y ENLACES","","Vía Stop","Punto","Lujan de Cuyo","","Via stop se trata de una obra de intervención vial similar al lomo extendido",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30801.0,"Estación de servicio","Punto","","Instalación ubicada a la vera de una vía de comunicación, destinada a la provisión de combustible y asistencia mecánica a automotores.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30802.0,"Estación de peaje","Punto","","Instalación situada sobre una vía de transporte con el fin de cobrar la tasa correspondiente al mantenimiento, mejoramiento y conservación de la vía en cuestión.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30803.0,"Estación de pesaje","Punto","","Instalación pública ubicada al costado de una vía de comunicación, provista de una báscula o balanza destinada al pesaje de vehículos de transporte.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30804.0,"Parador","Punto","","Predio a la vera de una vía de comunicación, con infraestructura de comedor, minimercados, duchas, descanso, estacionamientos y comunicaciones.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30805.0,"Indicador de kilómetros","Punto","","Mojón de madera, metal o cemento que indica la distancia en kilómetros desde ese punto al origen. Se sitúan alternativamente a un lado y otro en vías de transporte y ferrocarril.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30806.0,"Estación de bicicletas","Punto","","Estructura diseñada para el retiro y devolución de bicicletas públicas que pertenece a la infraestructura del sistema de transporte público. Una estación puede ser o no automática.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30807.0,"Bicisenda","Línea","","Sector señalizado y especialmente acondicionado en aceras y espacios verdes para la circulación de ciclo rodados. Las bicisendas se pueden instalar siempre que no generen conflictos con la circulación peatonal y sólo cuando en los tramos de arterias correspondientes no exista posibilidad de demarcar una ciclovía o ciclocarril.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30808.0,"Ciclovía","Línea","","Sector de la calzada señalizado especialmente con una separación que permita la circulación exclusiva de ciclo rodados (vehículo no motorizado de dos o más ruedas, impulsado por mecanismos con el esfuerzo de quien o quienes lo utilizan).","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30809.0,"Centro de transbordo","Polígono","","Nodo central del sistema de transporte que permite la articulación entre redes de los distintos modos o entre líneas de un mismo modo de transporte, organizando el transporte. También se lo denomina estación intermodal.","",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30810.0,"Puesto de boleto electrónico","Punto","","Punto de venta y / o recarga de dispositivos de los sistemas de pago electrónico de boleto.","",""],[20.0,3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30811.0,"Senda peatonal","Punto","","","",""],[21.0,3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30812.0,"Senialetica vial (horizontal y vertical)","Punto","","","Dispositivo físico, cartel o estructura sustentante instalada de forma fija en el espacio público a la vera o sobre las vías de circulación, provista de pictogramas, símbolos, leyendas o texto, cuya finalidad es reglamentar el tránsito, advertir riesgos, orientar la navegación territorial o indicar la nomenclatura e información de arterias viales y áreas urbanas.",""],[22.0,3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30813.0,"Restriccion de circulacion","Punto/Línea","","","",""],[23.0,3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE",30814.0,"Estacionamiento","Punto/Línea/Polígono","","","Espacio, sector de la vía pública, dársena o recinto delimitado y/o acondicionado (público o privado), destinado a la detención, parada prolongada o guarda temporal de vehículos automotores, motocicletas, bicicletas u otros medios de transporte, sujeto o no a normativas específicas de restricción, horario, reserva o arancelamiento.",""],["",3.0,"TRANSPORTE",308.0,"INFRAESTRUCTURA DE TRANSPORTE","","PES","Punto","Lujan de cuyo","","Puntos de Encuentro Saludables. Son espacios o nodos que conectan las ciclovías y donde el que circula o camina puede hacer una pausa de estiramiento, además suelen ubicarse en ellos puesto de bicicletas que corresponden al plan provincial de unicipio de ciclovias",""],["","","","","","","Parada de bus","Punto","LM","Parada correspondiente a una línea de servicios de autotransporte público de pasajeros.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",401.0,"COSTAS Y ZONAS LITORALES",40101.0,"Océano","Polígono","","Vasta extensión de agua salada que ocupa cuencas oceánicas.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",401.0,"COSTAS Y ZONAS LITORALES",40102.0,"Costa","Línea","","Es la línea del nivel de agua más alto. Si existe una playa, la línea de costa es el límite de la playa hacia el lado de la tierra, por lo que corresponde aproximadamente a la marca de agua más alta de las mareas más altas.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",401.0,"COSTAS Y ZONAS LITORALES",40103.0,"Playa","Polígono","","Área ribereña de mar, corriente de agua o espejo de agua, que por lo general se caracteriza por ser una superficie casi plana de arena, conchilla o grava.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",401.0,"COSTAS Y ZONAS LITORALES",40104.0,"Accidente costero","Línea","","Configuración geomorfológica de la zona litoral.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",401.0,"COSTAS Y ZONAS LITORALES",40105.0,"Isla","Punto/Polígono","","Parte de la superficie terrestre rodeada de agua y de dimensiones menores que un continente.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",403.0,"PROFUNDIDADES",40301.0,"Curva batimétrica","Línea","","Línea trazada en un espejo de agua, corriente de agua, mar u océano, que une puntos de igual profundidad respecto de un nivel de referencia definido. También se la denomina isobata.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",403.0,"PROFUNDIDADES",40302.0,"Accidente submarino","Punto/Polígono","","Elemento geomorfológico del fondo marino. Incluye cañadón submarino, banco (Burdwood/Namuncurá, entre otros), cordilleras submarinas, entre otros.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40601.0,"Mareógrafo, hidrómetro","Punto","","Dispositivo instalado con el fin de registrar las variaciones del nivel del agua a través del tiempo.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40602.0,"Estación de aforo","Punto","","Dispositivo utilizado para determinar la velocidad y el caudal del agua en una corriente de agua o canal.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40603.0,"Correntómetro, olígrafo","Punto","","Dispositivo que sirve para medir la velocidad y la dirección de las corrientes de agua, mareas, oleaje y / o viento, especialmente en las aguas marinas.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40604.0,"Boya","Punto","","Cuerpo flotante sujeto al fondo del mar que se coloca como señal, con fines de investigación (INIDEP 2022)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40605.0,"Punto, estación de muestreo","Punto","","Dispositivo que se utiliza en la medición de variables oceanográficas, pueden ser fijos o móviles o estar \"adjuntos\" a otro (INIDEP 2022)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40606.0,"Área de interés","Polígono","","Comprende la definción de objetivos de una colección de observaciones y/o el despliegue de instalaciones de monitoreo en el océano. por lo general tiene una perspectiva a largo plazo durante al menos algunos años, cubre un área de interés y se basa en legislación medioambiental (INIDEP 2022)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",406.0,"MAREAS Y CORRIENTES",40607.0,"Campaña de investigación","Línea","","Travesía realizada en un lugar determinado por una embarcación con diferentes instrumentos de medición en el océano (INIDEP 2022)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41101.0,"Canal","Línea/Polígono","","Excavación artificial sin flujo o con flujo controlado, construido con el objetivo de transportar agua.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41102.0,"Corriente de agua","Línea/Polígono","","Flujo natural de agua que sigue los desniveles del terreno, siendo arreico o desembocando en otra corriente de agua, en un espejo de agua o en el mar.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41103.0,"Acequia, zanja, zanjón","Línea","","Excavación longilínea construida en la tierra, con o sin revestimiento, con el objetivo de conducir, drenar, irrigar o controlar el agua para riego u otros usos.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41104.0,"Dique","Punto/Línea","","Terraplén natural o artificial destinado a detener o estancar el escurrimiento del agua en su curso, a los efectos de su almacenamiento para fines rurales o industriales.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41105.0,"Rápido","Punto/Línea","","Sector de una corriente de agua donde ésta fluye con gran rapidez, debido a alteraciones provocadas por desniveles u obstrucciones en su lecho.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41106.0,"Embalse","Polígono","","Masa de agua retenida por una estructura artificial para su posterior aprovechamiento.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41107.0,"Espejo de agua","Polígono","","Cuerpo natural o artificial de agua, dulce o salada, cuyo aporte proviene de corrientes de agua, afloramientos subterráneos o precipitaciones. Quedan excluidos los embalses y los embalses rurales.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41108.0,"Fuente natural","Punto","","Flujo natural de agua formado por drenaje en la superficie o por afloramiento de la freática subterránea.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41109.0,"Catarata, cascada, salto","Punto/Línea","","Caída vertical de un curso de agua, producida por brusco desnivel del cauce.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41110.0,"Muro de embalse","Punto/Línea","","Represa construida transversalmente a una corriente de agua o canal para contener o controlar el caudal.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41111.0,"Humedal","Polígono","","Áreas del territorio que se caracterizan por la presencia temporaria o permanente de agua, suelos o sustratos característicos y biota adaptada a estas condiciones, comúnmente plantas hidrófitas. Incluye las extensiones de marismas, pantanos y turberas, o superficies cubiertas de aguas, sean éstas de régimen natural o artificial, permanentes o temporales, estancadas o corrientes, dulces, salobres o saladas, incluidas las extensiones de agua marina cuya profundidad en marea baja no exceda de seis metros.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41112.0,"Tajamar","Línea","","Obra que une dos laderas que se aproximan mediante una cortina de tierra bien apisonada, con el objetivo de detener el escurrimiento del agua de lluvia, formando un espejo de agua.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41113.0,"Cuenca hidrográfica","Polígono","","Territorio drenado por un único sistema de drenaje natural, es decir, que a través de un curso hídrico, sus aguas pueden dar a un cuerpo de agua, infiltrarse o evaporarse.​ Una cuenca hidrográfica es delimitada por la línea de las cumbres, también llamada divisoria de aguas.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41115.0,"Subcuenca hidrográfica","Polígono","","Superficie de terreno cuya escorrentía superficial fluye en su totalidad a través de una serie de corrientes, ríos y, eventualmente, lagos, hacia un determinado punto de un curso de agua, generalmente un lago o una confluencia de ríos. (IDESoB 2024)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41116.0,"Acuífero","Polígono","","Estrato o formación geológica permeable que permite la circulación y el almacenamiento de agua subterránea por sus poros y grietas. Incluye el acuífero Guaraní y el acuífero Puelche, entre otros.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41117.0,"Escurrimiento superficial","Línea/Polígono","","Movimiento del agua en la superficie terrestre, a manera de un manto o lineal, que fluye por gravedad, después de fuertes precipitaciones pluviales o deshielos. (IDESoB 2025)","",""],[24.0,4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",411.0,"AGUAS CONTINENTALES",41118.0,"Línea de rivera","Línea","","","",""],["","","HIDROGRAFÍA Y OCEANOGRAFÍA","","","","Bañado","Polígono","LM","","",""],["","","HIDROGRAFÍA Y OCEANOGRAFÍA","","","","Camino de Sirga","Línea/Polígono","LM","","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",412.0,"CONDICIONES OCEANOGRÁFICAS",41201.0,"Frente marino","Línea","","Limite, variable en tiempo y espacio, entre dos masas de agua de características fisicas diferentes (DFDD)","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",412.0,"CONDICIONES OCEANOGRÁFICAS",41202.0,"Isolínea marina","Línea","","Curva que representa un valor particular de algún fenómeno físico o químico marino como la temperatura, la salinidad o la altura de las olas.","",""],["",4.0,"HIDROGRAFÍA Y OCEANOGRAFÍA",412.0,"CONDICIONES OCEANOGRÁFICAS",41203.0,"Trayectoria","Línea/Multipunto","","Representación gráfica de las características fisico/quimicas del agua a lo largo de una trayectoria definida (INIDEP 2022)","",""],["",5.0,"GEOGRAFÍA FÍSICA",501.0,"HIPSOGRAFÍA",50101.0,"Curva de nivel","Línea","","Línea que une puntos que tienen el mismo valor de altitud respecto al nivel medio del mar. También se la denomina isohipsa o curva hipsométrica.","",""],["",5.0,"GEOGRAFÍA FÍSICA",501.0,"HIPSOGRAFÍA",50102.0,"Punto acotado","Punto","","Punto del terreno que ha sido medido altimétricamente y no está materializado en el terreno.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50201.0,"Abra, paso, portillo, portezuelo","Punto","","Depresión del terreno entre dos alturas o cerros, que constituye un portal en unos casos o simplemente una puerta de paso a valles situados a ambos lados.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50202.0,"Caverna, gruta, cueva","Punto","","Cavidad subterránea y profunda, de formación natural o artificial, producida en la montaña o en la roca.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50203.0,"Cerro","Punto","","Elevación que sobresale de los lineamientos serranos o montañosos. Incluye monte, morro, nevado, pico, entre otros. No incluye volcán. El nevado es un cerro de gran altura que posee nieves perpetuas en su cumbre y permanece blanco durante todo el año. Un pico es una elevación montañosa, de cumbre aguda y puntiaguda con flancos escarpados.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50204.0,"Hoya","Punto","","Depresión cerrada del terreno, en donde puede existir presencia de agua.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50205.0,"Médano, duna","Polígono","","Acumulación de sedimentos sueltos, tamaño arena, que puede trasladarse por acción del viento. Puede estar en ambiente continental o costero.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50206.0,"Meseta","Polígono","","Forma de relieve elevada, plana y generalmente de gran extensión, limitada por barrancas, circundada por valles.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50207.0,"Mogote","Punto","","Elevación del terreno, cónica, aislada, y con su parte superior trunca.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50208.0,"Sierra","Línea","","Secuencia eslabonada de cerros que en conjunto presentan disposición longilínea y altitudes intermedias entre la cordillera y montañas. Incluye la serranía, entendida como una extensión sinónima de sierra, entre otros.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50209.0,"Barranca","Línea","","Desnivel pronunciado del terreno con pendiente variable y de origen diverso. En el caso de costa marina se denomina acantilado. En el caso de origen fluvial se denomina barranca. Si se encuentra en terreno no anexo a una corriente de agua o mar se denomina escarpa o barda.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50210.0,"Quebrada, cañadón, garganta","Línea","","Valle de paredes abruptas más o menos profundo que generalmente puede estar surcado por un curso de agua permanente o temporario. Incluye cajón, entre otros.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50211.0,"Cordillera","Línea","","Secuencia eslabonada de cadenas orográficas de considerable altura con una disposición homogénea y pertenecientes al mismo proceso orogénico.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50212.0,"Cordón","Línea","","Grupo de elevaciones con disposición orográfica similar e igual orogenia, que forman parte de una cordillera o sistema montañoso.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50213.0,"Cuchilla","Línea","","Elevación de poca altura, alargada y estrecha, con cumbre convexa y con pendientes suaves hacia el llano. Incluye lomada, entre otros.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50214.0,"Cuesta","Línea","","Parte de un relieve constituido por dos pendientes asimétricas, una abrupta y escarpada (cuesta propiamente dicha) y la opuesta, de suave inclinación.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50215.0,"Filo","Línea","","Cima de un cordón montañoso agudo, que es divisoria de aguas.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50216.0,"Huaico","Polígono","","Cañadón de paredes abruptas y a veces  aterrazadas, por el que suele correr un curso de agua intermitente, coincidente con la época de lluvias y avenidas. Es producto de la acción conjunta de la erosión fluvial y eólica sumada a la meteorización de terrenos impermeables desintegrados por la acción pluvial y se encuentra asociado a climas áridos. También se lo denomina guaico.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50217.0,"Valle","Línea","","Forma de erosión fluvial cuyas laderas tienen alturas, pendientes y profundidades diversas.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50218.0,"Lugar geomorfológico","Línea","","Geoforma caracterizada por la acción de algún agente geomorfológico.","",""],["",5.0,"GEOGRAFÍA FÍSICA",502.0,"GEOMORFOLOGÍA",50219.0,"Línea de quiebre","Línea","","Línea donde se presenta un cambio de forma abrupta en la pendiente del terreno.","",""],["",5.0,"GEOGRAFÍA FÍSICA",504.0,"EDAFOLOGÍA",50401.0,"Suelo consolidado","Polígono","","Superficie cuyas partes o partículas integrantes están unidas con una gran fuerza de cohesión interna. Corresponde a las rocas.","",""],["",5.0,"GEOGRAFÍA FÍSICA",504.0,"EDAFOLOGÍA",50402.0,"Suelo no consolidado","Polígono","","Superficie constituida por material sedimentario de variados tamaños, desde los mayores a los menores, cuya energía de unión es nula o muy baja.","",""],["",5.0,"GEOGRAFÍA FÍSICA",504.0,"EDAFOLOGÍA",50403.0,"Suelo congelado","Polígono","","Superficie de material no consolidado que, por estar en zonas muy frías o por estar siempre cubierto de nieve o hielo, se congela la humedad retenida y con esto aumenta la dureza del mismo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",506.0,"VULCANISMO Y SISMICIDAD",50601.0,"Volcán","Punto","","Conducto en la superficie de la Tierra, a través del cual asciende magma y gases asociados; también, se denomina a la estructura o forma (usualmente cónica) que se produce a partir del material eyectado (SEGEMAR, 2019).","",""],["",5.0,"GEOGRAFÍA FÍSICA",506.0,"VULCANISMO Y SISMICIDAD",50602.0,"Estación sismológica","Punto","","Recinto especialmente diseñado para albergar al sismógrafo. Lo ideal es que se encuentre alejado de ruidos naturales y culturales para aumentar su sensibilidad. Incluye acelerómetro.","",""],["",5.0,"GEOGRAFÍA FÍSICA",506.0,"VULCANISMO Y SISMICIDAD",50603.0,"Epicentro de sismo","Punto","","Punto de la superficie de la tierra que está directamente sobre el hipocentro de un sismo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50701.0,"Glaciar","Punto/Polígono","","Masa de hielo permanente y en movimiento, alimentada desde un ventisquero y que en forma de lengua ocupa un valle moviéndose cuesta abajo. También incluye glaciar de circo, entre otros.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50702.0,"Ventisquero","Polígono","","Zona de alta montaña cubierta de nieve permanente, con precipitación nívea continua y que el viento transporta y acumula constituyendo la zona de acumulación de los glaciares.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50703.0,"Penitente","Polígono","","Remanente glaciar o de roca, en forma de aguja, columna aguda y filosa, generada por la acción eólica y los efectos de la radiación solar.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50704.0,"Morena, morrena","Línea/Polígono","","Lugar de acumulación heterogénea de detritos en cuanto a tamaño y composición que, llevada por el glaciar, es acumulada por éste.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50705.0,"Nunatak","Punto/Polígono","","Afloramiento rocoso rodeado de hielo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50706.0,"Espesor del hielo","Punto","","Punto de referencia que indica el grosor del recubrimiento de la masa de hielo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50707.0,"Borde de hielo","Línea","","Línea exterior que fija la posición que alcanza la masa de hielo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",507.0,"GLACIOLOGÍA",50708.0,"Barrera de hielo","Línea/Polígono","","Masa de hielo permanente, flotante y de espesor variable, formada a lo largo de la costa y que se encuentra adherida a ella avanzando sobre el océano.","",""],["",5.0,"GEOGRAFÍA FÍSICA",510.0,"GEOLOGÍA",51001.0,"Falla","Línea","","Fractura macroscópica de los materiales de la corteza terrestre acompañada por el desplazamiento de los bloques.","",""],["",5.0,"GEOGRAFÍA FÍSICA",510.0,"GEOLOGÍA",51002.0,"Unidad geológica","Polígono","","Área cuyo volumen de roca es identificable de acuerdo a su origen y edad.","",""],["",5.0,"GEOGRAFÍA FÍSICA",511.0,"ECORREGIONES",51101.0,"Ecorregión","Polígono","","Zona en las que dominan determinadas condiciones geomorfológicas y climáticas relativamente uniformes o recurrentes, caracterizada por una fisonomía vegetal de comunidades naturales y seminaturales que comparten un grupo considerable de especies dominantes, una dinámica y condiciones ecológicas generales cuyas interacciones son indispensables para su persistencia a largo plazo.","",""],["",5.0,"GEOGRAFÍA FÍSICA",512.0,"DEGRADACIÓN DE TIERRAS Y DESERTIFICACIÓN",51201.0,"Tierras áridas","Polígono","","Área clasificada según la escasez estacional y / o anual de los recursos hídricos. Se define comúnmente como la insuficiencia de agua en el suelo y en la atmósfera.","",""],["",5.0,"GEOGRAFÍA FÍSICA",512.0,"DEGRADACIÓN DE TIERRAS Y DESERTIFICACIÓN",51202.0,"Tierras degradadas","Polígono","","Área que sufre un cambio en la salud del suelo, resultando en una disminución de la capacidad del ecosistema para producir bienes o prestar servicios para sus beneficiarios. Las tierras degradadas cubren todos los cambios negativos en la capacidad del ecosistema para prestar bienes y servicios (incluso biológicos y servicios y bienes relacionados con el agua, y también su relación con bienes y servicios sociales y económicos).","",""],["",5.0,"GEOGRAFÍA FÍSICA",512.0,"DEGRADACIÓN DE TIERRAS Y DESERTIFICACIÓN",51203.0,"Área de erosión","Polígono","","Zona del terreno donde los procesos de remoción han provocado una degradación areal de las partículas del suelo (por ejemplo: erosión por acción del viento) o a una degradación lineal con erosión profunda de diferentes grados (por ejemplo: erosión por acción de agua en movimiento). IDESoB 2025","",""],["",5.0,"GEOGRAFÍA FÍSICA",513.0,"ÁREAS DE CONSERVACIÓN Y MANEJO SUSTENTABLE",51301.0,"Área protegida","Polígono","","Son zonas de ecosistemas continentales (terrestres o acuáticos), costeros/marinos o marinos, o una combinación de los mismos, con límites definidos y bajo un marco normativo acorde con sus objetivos de conservación, que constituyen una estrategia fundamental para la conservación a largo plazo de la diversidad biológica y cultural, proporcionando bienes y servicios ecosistémicos esenciales para la sociedad y la vida en general. (SIFAP 2023)","",""],["",5.0,"GEOGRAFÍA FÍSICA",513.0,"ÁREAS DE CONSERVACIÓN Y MANEJO SUSTENTABLE",51302.0,"Reserva de la Biosfera","Polígono","","Ecosistema terrestre o costero/ marino, o una combinación de los mismos, reconocido como tal en un plano internacional en el marco del Programa MAB (Hombre y la Atmósfera) de la UNESCO.","",""],["",5.0,"GEOGRAFÍA FÍSICA",513.0,"ÁREAS DE CONSERVACIÓN Y MANEJO SUSTENTABLE",51303.0,"Sitio Ramsar","Polígono","","Son humedales que están incluidos en la Lista de Humedales de Importancia Internacional de la Convención sobre los Humedales (conocida como Convención de Ramsar). https://www.ramsar.org/sites/default/files/documents/library/ramsarsites_criteria_sp.pdf","",""],["",5.0,"GEOGRAFÍA FÍSICA",513.0,"ÁREAS DE CONSERVACIÓN Y MANEJO SUSTENTABLE",51304.0,"Ordenamiento Territorial de Bosques Nativos","Polígono","","Áreas  de protección ambiental a los bosques nativos según lo establecido en la Ley  de 26.331. (OTBN)","",""],[25.0,5.0,"GEOGRAFÍA FÍSICA",513.0,"ÁREAS DE CONSERVACIÓN Y MANEJO SUSTENTABLE",51305.0,"Reserva Natural","Polígono","Salta","","",""],["",6.0,"BIOTA",601.0,"ÁREAS DE CULTIVO",60101.0,"Área de cultivo de especies arbóreas","Polígono","","Área dedicada al cultivo de árboles bajo riego o en secano, sean latifoliados o coníferas.","",""],["",6.0,"BIOTA",601.0,"ÁREAS DE CULTIVO",60102.0,"Área de cultivo de arbustos","Polígono","","Área dedicada al cultivo de arbustos bajo riego o en secano.","",""],["",6.0,"BIOTA",601.0,"ÁREAS DE CULTIVO",60103.0,"Área de cultivo de herbáceas","Polígono","","Área dedicada al cultivo de herbáceas bajo riego o en secano, sean graminoideas, no graminoideas o múltiples.","",""],["",6.0,"BIOTA",602.0,"ÁREAS DE VEGETACIÓN NATURAL HERBÁCEA",60201.0,"Vegetación natural herbácea cerrada","Polígono","","Área de vegetación natural cubierta por pastizal cerrado, sea de cobertura simple, con árboles, con arbustos, o con árboles y arbustos.","",""],["",6.0,"BIOTA",602.0,"ÁREAS DE VEGETACIÓN NATURAL HERBÁCEA",60202.0,"Vegetación natural herbácea abierta","Polígono","","Área de vegetación natural cubierta por pastizal abierto, sea de cobertura simple, con árboles, con arbustos, o con árboles y arbustos.","",""],["",6.0,"BIOTA",602.0,"ÁREAS DE VEGETACIÓN NATURAL HERBÁCEA",60203.0,"Vegetación natural herbácea dispersa","Polígono","","Área de vegetación natural cubierta por pastizal disperso.","",""],["",6.0,"BIOTA",603.0,"ÁREAS DE VEGETACIÓN NATURAL ARBÓREA",60301.0,"Área de vegetación natural arbórea cerrada","Polígono","","Área de vegetación natural cubierta por bosque cerrado, sea de un estrato arbóreo o de más de un estrato arbóreo, sin emergentes o con emergentes.","",""],["",6.0,"BIOTA",603.0,"ÁREAS DE VEGETACIÓN NATURAL ARBÓREA",60302.0,"Área de vegetación natural arbórea abierta","Polígono","","Área de vegetación natural cubierta por bosque abierto, sea con arbustos, con estrato herbáceo, o con arbustos y emergentes.","",""],["",6.0,"BIOTA",603.0,"ÁREAS DE VEGETACIÓN NATURAL ARBÓREA",60303.0,"Área de vegetación natural arbórea dispersa","Polígono","","Área de vegetación natural cubierta por árboles dispersos.","",""],["",6.0,"BIOTA",609.0,"ÁREAS DE VEGETACIÓN NATURAL ARBUSTIVA",60901.0,"Área de vegetación natural arbustiva cerrada","Polígono","","Área de vegetación natural cubierta por arbustal cerrado, sea sin emergentes, con árboles emergentes, o con arbustos emergentes.","",""],["",6.0,"BIOTA",609.0,"ÁREAS DE VEGETACIÓN NATURAL ARBUSTIVA",60902.0,"Área de vegetación natural arbustiva abierta","Polígono","","Área de vegetación natural cubierta por arbustal abierto, sea sin estrato herbáceo o con estrato herbáceo.","",""],["",6.0,"BIOTA",609.0,"ÁREAS DE VEGETACIÓN NATURAL ARBUSTIVA",60903.0,"Área de vegetación natural arbustiva dispersa","Polígono","","Área de vegetación natural cubierta por arbustos dispersos.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70101.0,"Línea de base normal","Línea","","Línea a partir de la cual se mide el mar territorial, zona contigua, zona económica exclusiva y plataforma continental. También representa el límite exterior de las aguas interiores. Se define como la línea de bajamar a lo largo de la costa. Es la isobata de 0 metro, que corresponde al nivel del datum vertical local.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70102.0,"Línea de base recta","Línea","","Línea a partir de la cual se mide el mar territorial, zona contigua, zona económica exclusiva y plataforma continental. También representa el límite exterior de las aguas interiores. Se define como la línea recta que une puntos sobre la línea de base normal. Las líneas de base archipelágicas rectas definen la periferia de un grupo  de islas.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70103.0,"Línea de costa","Línea","","Línea que marca el contacto entre una masa de tierra y un cuerpo de agua, establecida por la línea de las más bajas bajamares, ya sea en las aguas litorales o interiores.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70104.0,"Límite del lecho y subsuelo","Línea","","Línea demarcatoria de aguas jurisdiccionales en los fondos fluviales, definida en el Tratado del Río de la Plata y su Frente Marítimo.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70105.0,"Límite lateral marítimo","Línea","","Línea de deslinde entre mares jurisdiccionales contiguos, definida en el Tratado del Río de la Plata su Frente Marítimo.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70106.0,"Límite del Mar Territorial Argentino","Línea","","Delimitación exterior del Mar Territorial Argentino, el cual se extiende hasta una distancia de 12 millas marinas a partir de las líneas de base.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70107.0,"Mar Territorial Argentino","Polígono","","Zona marítima que se extiende hasta una distancia de 12 millas marinas a partir de la línea de base.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70108.0,"Límite de la Zona Contigua Argentina","Línea","","Delimitación exterior de la Zona Contigua Argentina, la cual se extiende más allá del límite exterior del mar territorial, hasta una distancia de 24 millas marinas medidas a partir de las líneas de base.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70109.0,"Zona Contigua Argentina","Polígono","","Zona marítima que se extiende desde el límite exterior del mar territorial, hasta una distancia de 24 millas marinas medidas a partir de las líneas de base.","",""],["",7.0,"DEMARCACIÓN",701.0,"FRONTERAS Y LÍMITES",70110.0,"Límite de la Zona Económica Exclusiva Argentina","Línea","","Delimitación exterior de la Zona Económica Exclusiva Argentina, la cual se extiende más allá del límite exterior del mar territorial, hasta una distancia de 200 millas marinas a partir de las líneas de base.","",""],["",7.0,"DEMARCA function normGob(g){const s=String(g||'').trim(); if(!s)return ''; const n=norm(s); if(n.includes('lujan'))return 'Luján de Cuyo'; if(n.includes('rio cuarto'))return 'Río Cuarto'; return s}
function codeOf(x){if(x===''||x==null)return ''; const n=parseFloat(String(x).replace(',','.')); return isNaN(n)?'':String(Math.round(n)).padStart(6,'0')}
function buildLocal(rows){
  let hi=-1; for(let i=0;i<Math.min(rows.length,15);i++){if((rows[i]||[]).some(c=>nrm(c)==='objeto')){hi=i;break}}
  if(hi<0)return null;
  const h={}; rows[hi].forEach((c,j)=>{const k=nrm(c); if(k&&!(k in h))h[k]=j});
  const col=k=>h[k]===undefined?-1:h[k];
  const ix={cc:col('codigoclase'),cl:col('clase'),cs:col('codigosubclase'),sc:col('subclase'),co:col('codigoobjeto'),ob:col('objeto'),ge:col('geometria'),gl:col('gobiernolocal'),dc:col('definicioncog'),dp:col('definicionpropuesta')};
  if(ix.ob<0)return null;
  const g=(r,i)=>i<0?'':String(r[i]==null?'':r[i]).trim();
  const last=Math.max(...Object.values(ix));
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[]; const nombre=g(r,ix.ob); if(!nombre)continue;
    const code=codeOf(g(r,ix.co));
    const nota=r.slice(last+1).map(x=>String(x==null?'':x).trim()).filter(Boolean).join(' ');
    const e={id:i+1,code,nombre,geom:normGeom(g(r,ix.ge)),gob:normGob(g(r,ix.gl)),dc:g(r,ix.dc),dp:g(r,ix.dp),nota,cl:g(r,ix.cl),sc:g(r,ix.sc)};
    let o=code?byCode[code]:null; e.por='';
    if(o)e.por='codigo'; else {const m=byName[norm(nombre).trim()]; if(m){o=m;e.por='nombre'}}
    e.io=o?o.c:'';
    e.st=o?'idera':(code?'nuevo':'sinc');
    if(o){e.cl=(CL[o.cl]||e.cl).trim();e.sc=SC[o.sc]||e.sc}
    e.cl=(e.cl||'(sin clase)').trim(); e.sc=(e.sc||'').trim();
    e.ap=!!(e.gob||e.dp||e.nota||(o&&norm(o.n).trim()!==norm(nombre).trim()));
    e.gdif=!!(o&&e.geom&&norm(e.geom).replace(/\s/g,'')!==norm(o.g).replace(/\s/g,''));
    e.t=norm([nombre,code,e.dc,e.dp,e.gob,e.sc,e.cl,nota].join(' '));
    out.push(e);
  }
  const dup={}; out.forEach(e=>{if(e.code)(dup[e.code]=dup[e.code]||[]).push(e)});
  out.forEach(e=>{e.dup=e.code&&dup[e.code].length>1?dup[e.code].filter(x=>x!==e):[]; if(e.dup.length)e.ap=true});
  L=out;
  O.forEach(o=>{o.loc=out.filter(e=>e.io===o.c); o.ap=o.loc.some(e=>e.ap); o.tl=norm(o.loc.map(e=>[e.nombre,e.gob,e.dp,e.nota].join(' ')).join(' '))});
  return out.length;
}

const S={ap:false,lst:'',lg:'',lcl:'',lprop:false,view:'obj',q:'',kind:'t',cl:'',sc:'',geo:new Set(),dom:true,sel:null,atype:'',adom:false};

function terms(){return norm(S.q).split(/\s+/).filter(Boolean)}
function hl(text,ts){
  if(!ts.length)return esc(text);
  const n=norm(text); const rg=ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  let out='',i=0; const re=new RegExp(rg,'g'); let m;
  while((m=re.exec(n))){ if(!m[0])break; out+=esc(text.slice(i,m.index))+'<mark>'+esc(text.slice(m.index,m.index+m[0].length))+'</mark>'; i=m.index+m[0].length;}
  return out+esc(text.slice(i));
}
function filterObj(){
  const ts=terms(); let res=[];
  for(const o of O){
    if(S.kind==='f'&&!o.f)continue; if(S.kind==='o'&&o.f)continue;
    if(S.cl&&o.cl!==S.cl)continue; if(S.sc&&o.sc!==S.sc)continue;
    if(S.geo.size&&![...S.geo].some(g=>o.g.includes(g)))continue;
    if(S.ap&&!o.ap)continue;
    let score=0;
    if(ts.length){
      let ok=true;
      for(const t of ts){
        let s=0;
        if(o.tn.includes(t))s=o.tn.startsWith(t)?12:10; else if(o.tc.startsWith(t))s=9; else if(o.ta.includes(t))s=4; else if(o.td.includes(t))s=2; else if(o.tl&&o.tl.includes(t))s=2; else if(S.dom&&o.tv.includes(t))s=1;
        if(!s){ok=false;break} score+=s;
      }
      if(!ok)continue;
    }
    res.push([score,o]);
  }
  if(ts.length)res.sort((a,b)=>b[0]-a[0]||a[1].c.localeCompare(b[1].c)); else res.sort((a,b)=>a[1].c.localeCompare(b[1].c));
  return res.map(r=>r[1]);
}
function filterLoc(){
  const ts=terms(); const res=[];
  for(const e of L){
    if(S.lst==='si'&&e.st!=='idera')continue; if(S.lst==='no'&&e.st==='idera')continue; if((S.lst==='nuevo'||S.lst==='sinc')&&e.st!==S.lst)continue; if(S.lg&&e.gob!==S.lg)continue; if(S.lcl&&e.cl!==S.lcl)continue; if(S.lprop&&!e.dp)continue;
    let score=0;
    if(ts.length){let ok=true;
      for(const t of ts){let s=0; const nn=norm(e.nombre); if(nn.includes(t))s=nn.startsWith(t)?12:10; else if(e.code.startsWith(t))s=9; else if(norm(e.gob).includes(t))s=6; else if(e.t.includes(t))s=2; if(!s){ok=false;break} score+=s}
      if(!ok)continue;}
    res.push([score,e]);
  }
  if(ts.length)res.sort((a,b)=>b[0]-a[0]||a[1].id-b[1].id); else res.sort((a,b)=>(a[1].code||'~').localeCompare(b[1].code||'~')||a[1].id-b[1].id);
  return res.map(r=>r[1]);
}
function filterAttr(){
  const ts=terms(); const res=[];
  for(const c of attrList){
    const a=A[c];
    if(S.atype&&a.t!==S.atype)continue; if(S.adom&&!a.dom)continue;
    let score=0;
    if(ts.length){let ok=true;
      for(const t of ts){let s=0; if(norm(c)===t)s=14; else if(a.tn.includes(t))s=10; else if(a.td.includes(t))s=3; else if(S.dom&&a.tv.includes(t))s=1; if(!s){ok=false;break} score+=s}
      if(!ok)continue;}
    res.push([score,c]);
  }
  res.sort((a,b)=>b[0]-a[0]||a[1].localeCompare(b[1]));
  return res.map(r=>r[1]);
}

      <p class="def">${esc(o.d)||'Sin definición en el catálogo.'}</p>${note}
      <h3>Atributos (${eff.length})</h3>
      ${eff.length?`<div class="tw"><table><thead><tr><th>Código</th><th>Denominación</th><th>Tipo</th><th>Dominio</th></tr></thead>${attrRows(eff)}</table></div>`:'<p class="lbl">El catálogo no lista atributos para este objeto.</p>'}
      <h3>Catálogo para gobiernos locales</h3>
      ${o.loc.length?o.loc.map(e=>`<div class="lcard"><button class="linkbtn" data-l="${e.id}"><b>${esc(e.nombre)}</b></button> ${e.gob?`<span class="badge l">${esc(e.gob)}</span> `:''}<span class="badge">${esc(e.geom||'sin geometría')}</span>${e.dp?`<p><span class="lbl">Definición propuesta:</span> ${esc(e.dp)}</p>`:''}${e.nota?`<p><span class="lbl">Nota:</span> ${esc(e.nota)}</p>`:''}${e.gdif?`<p><span class="badge w">Geometría local distinta de IDERA</span></p>`:''}</div>`).join(''):'<p class="lbl">No figura en el catálogo local.</p>'}`;
    wireAttrTable(d);
    d.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.view='loc';S.q='';$('#q').value='';S.lst=S.lg=S.lcl='';S.lprop=false;setTabs();S.sel=b.dataset.l;location.hash='loc-'+b.dataset.l;draw(true);document.body.classList.add('show')});
  }else{
    const a=A[S.sel]; if(!a){d.innerHTML='';return}
    const u=usage[S.sel]||[];
    d.innerHTML=back+`<div class="crumb">Atributo</div><h2>${esc(a.n)}</h2>
      <div class="meta"><span class="code">${esc(S.sel)}</span><span class="badge">${esc(a.t||'Tipo sin definir')}</span>${a.dom?'<span class="badge o">Con lista de valores</span>':'<span class="badge">Texto o valor libre</span>'}</div>
      <p class="def">${esc(a.d)||'Sin definición en la lista de atributos.'}</p>${a.o?`<p class="lbl">Observaciones: ${esc(a.o)}</p>`:''}
      ${a.dom?`<h3>Valores (${(DM[S.sel]||[]).length})</h3><div class="tw"><table><thead><tr><th>Código</th><th>Etiqueta y definición</th></tr></thead>${(DM[S.sel]||[]).map(r=>`<tr><td class="c">${esc(r[0])}</td><td><b>${esc(r[1])}</b>${r[2]?`<br><span class="lbl">${esc(r[2])}</span>`:''}</td></tr>`).join('')}</table></div>`:''}
      <h3>Usado en ${u.length} ${u.length===1?'objeto':'objetos'}</h3><div class="use">${u.map(o=>`<button class="${o.f?'f':''}" data-o="${o.c}"><span class="code">${o.c}</span>${esc(o.n)}${o.f?' · DByF':''}</button>`).join('')||'<span class="lbl">Ningún objeto lo usa.</span>'}</div>`;
    d.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.view='obj';S.q='';$('#q').value='';S.kind='t';S.cl=S.sc='';S.geo=new Set();setTabs();S.sel=b.dataset.o;location.hash='obj-'+b.dataset.o;draw(true);document.body.classList.add('show')});
  }
  const bk=$('#back'); if(bk)bk.onclick=()=>document.body.classList.remove('show');
}
function setTabs(){['obj','atr','loc'].forEach(v=>$('#tab-'+v).setAttribute('aria-selected',S.view===v));$('#tab-loc').textContent=`Catálogo gobiernos locales (${L.length})`}
function goView(v){if(S.view!==v){S.view=v;S.sel=null;S.q='';$('#q').value='';setTabs();document.body.classList.remove('show');draw(true)}}
$('#tab-obj').onclick=()=>goView('obj');$('#tab-atr').onclick=()=>goView('atr');$('#tab-loc').onclick=()=>goView('loc');
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value;draw(false)},120)};

function copyCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  let rows;
  if(S.view==='loc'){rows=[['Código','Objeto','¿Está en IDERA?','Código IDERA','Clase','Subclase','Geometría','Gobierno local','Definición COG','Definición propuesta','Nota']];
    cur.forEach(e=>rows.push([e.code,e.nombre,e.st==='idera'?'Sí':'No',e.io,e.cl,e.sc,e.geom,e.gob,e.dc,e.dp,e.nota]));}
  else{rows=[['Código','Objeto','Tipo','Clase','Subclase','Geometría','Definición','Atributos']];
  cur.forEach(o=>rows.push([o.c,o.n,o.f?'Dato básico y fundamental':'Objeto',(CL[o.cl]||'').trim(),SC[o.sc]||'',o.g,o.d,effAttrs(o).join(' ')]));}
  const t=rows.map(r=>r.map(q).join(',')).join('\n');
  const fb=()=>{$('#ta').value=t;$('#dlg').showModal();$('#ta').select()};
  try{navigator.clipboard.writeText(t).then(()=>{$('#csv').textContent='Copiado'},fb)}catch(e){fb()}
}
$('#dclose').onclick=()=>$('#dlg').close();
function parseCsv(txt){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){r.push(f);f=''} else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''} else if(c!=='\r')f+=c;}
  if(f||r.length){r.push(f);rows.push(r)} return rows;
}
function loadLib(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko(new Error('lib'));document.head.appendChild(s)})}
$('#lfile').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  const msg=t=>{const m=$('#lmsg');if(m)m.textContent=t};
  try{
    let rows;
    if(/\.csv$/i.test(f.name)){rows=parseCsv(await f.text())}
    else{await loadLib();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(r.slice(0,15).some(x=>x.some(c=>nrm(c)==='objeto'))){rows=r;break}}}
    const n=rows&&buildLocal(rows);
    if(!n){msg('No encontré una columna OBJETO en el archivo.');return}
    META={titulo:f.name,fecha:new Date().toLocaleString('es-AR')};setVer();setTabs();S.sel=null;draw(true);msg(n+' filas cargadas');
  }catch(err){msg('No se pudo leer el archivo. Probá exportándolo como CSV desde la planilla.')}
};

function fromHash(){
  const h=location.hash.slice(1); const m=h.match(/^(obj|atr|loc)-(.+)$/);
  if(m){S.view=m[1];S.sel=m[2];document.body.classList.add('show');setTabs();draw(true)}
}
window.addEventListener('hashchange',()=>{const m=location.hash.slice(1).match(/^(obj|atr|loc)-(.+)$/);if(m&&(m[2]!==S.sel||m[1]!==S.view)){fromHash()}});
setTabs();draw(true);fromHash();
})();
</script>
</body>

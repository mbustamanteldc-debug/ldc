 cerrada que delimita un área localizada de elevación más alta que el terreno circundante en el cual no hay ningún drenaje superficial."]],"HYP":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Perenne","Cuando lleva o contiene agua en forma permanente."],["2","Intermitente","Cuando lleva o contiene agua temporalmente."]],"IDA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Árido","La relación entre la precipitación anual y la evapotranspiración de referencia anual es menor a 0,05."],["2","Hiperárido","La relación entre la precipitación anual y la evapotranspiración de referencia anual se encuentra comprendida entre 0,05 y 0,20."],["3","Semiárido","La relación entre la precipitación anual y la evapotranspiración de referencia anual se encuentra comprendida entre 0,20 y 0,50."],["4","Subhúmedo seco","La relación entre la precipitación anual y la evapotranspiración de referencia anual se encuentra comprendida entre 0,50 y 0,65."],["5","Subhúmedo húmedo","La relación entre la precipitación anual y la evapotranspiración de referencia anual se encuentra comprendida entre 0,65 y 1,00."],["6","Húmedo","La relación entre la precipitación anual y la evapotranspiración de referencia anual es superior a 1,00."]],"IED":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Clase I","Suelos muy aptos para cualquier tipo de agricultura, con mínima o ninguna limitación. Buena capacidad de retención de agua y alto contenido de materia orgánica."],["2","Clase II","Tierras con limitaciones moderadas (erosión, drenaje, salinidad), que permiten cultivos con prácticas de manejo específicas."],["3","Clase III","Limitaciones moderadas a severas, que restringen la elección de cultivos y exigen prácticas de conservación más intensas."],["4","Clase IV","Limitaciones severas, aptas solo para pastoreo, forestación o algunos cultivos específicos con alto manejo."],["5","Clase V","Suelos con limitaciones muy severas; el uso es apto solo para pastoreo, forestación y no son aptos para agricultura."],["6","Clase VI","Limitaciones muy severas, aptas principalmente para pastoreo y forestación. La pedregosidad o la susceptibilidad a inundaciones son comunes."],["7","Clase VII","Limitaciones extremas, uso restringido a pastoreo y conservación, no para agricultura. Pueden tener pendientes pronunciadas o ser pedregosos."],["8","Clase VIII","Suelos no aptos para fines agrícolas o ganaderos, como desiertos. Su uso se limita a la conservación o actividades recreativas."]],"IEM":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","I","Muy débil. Imperceptible para la mayoría excepto en condiciones favorables. Aceleración menor a 0,5 Gal."],["2","II","Débil. Perceptible sólo por algunas personas en reposo, particularmente aquellas que se encuentran ubicadas en los pisos superiores de los edificios. Los objetos colgantes suelen oscilar. Aceleración entre 0,5 y 2,5 Gal."],["3","III","Leve. Perceptible por algunas personas dentro de los edificios, especialmente en pisos altos. Muchos no lo perciben como un terremoto. Los automóviles detenidos se mueven ligeramente. Sensación semejante al paso de un camión pequeño. Aceleración entre 2,5 y 6,0 Gal."],["4","IV","Moderado. Perceptible por la mayoría de personas dentro de los edificios, por pocas personas en el exterior durante el día. Durante la noche algunas personas pueden despertarse. Perturbación en cerámica, puertas y ventanas. Las paredes suelen hacer ruido. Los automóviles detenidos se mueven con más energía. Sensación semejante al paso de un camión grande. Aceleración entre 6,0 y 10 Gal."],["5","V","Poco fuerte. Sacudida sentida casi por todo el país o zona y algunas piezas de vajilla o cristales de ventanas se rompen; pocos casos de agrietamiento de aplanados; caen objetos inestables. Se observan perturbaciones en los árboles, postes y otros objetos altos. Se detienen los relojes de péndulo. Aceleración entre 10 y 20 Gal."],["6","VI","Fuerte. Sacudida sentida por todo el país o zona. Algunos muebles pesados cambian de sitio y provoca daños leves, en especial en viviendas de material ligero. Aceleración entre 20 y 35 Gal."],["7","VII","Muy fuerte. Ponerse de pie es difícil. Muebles dañados. Daños insignificantes en estructuras de buen diseño y construcción. Daños leves a moderados en estructuras ordinarias bien construidas. Daños considerables en estructuras pobremente construidas. Mampostería dañada. Perceptible por personas en vehículos en movimiento. Aceleración entre 35 y 60 Gal."],["8","VIII","Destructivo. Daños leves en estructuras especializadas. Daños considerables en estructuras ordinarias bien construidas, posibles derrumbes. Daño severo en estructuras pobremente construidas. Mampostería seriamente dañada o destruida. Muebles completamente sacados de lugar. Aceleración entre 60 y 100 Gal."],["9","IX","Muy destructivo. Pánico generalizado. Daños considerables en estructuras especializadas, paredes fuera de plomo. Grandes daños en importantes edificios, con derrumbes parciales. Edificios desplazados fuera de las bases. Aceleración entre 100 y 250 Gal."],["10","X","Desastroso. Algunas estructuras de madera bien construidas quedan destruidas. La mayoría de las estructuras de mampostería y el marco destruido con sus bases. Vías ferroviarias dobladas. Aceleración entre 250 y 500 Gal."],["11","XI","Muy desastroso. Pocas estructuras de mampostería, si las hubiera, permanecen en pie. Puentes destruidos. Vías ferroviarias curvadas en gran medida. Aceleración mayor a 500 Gal."],["12","XII","Catastrófico. Destrucción total con pocos supervivientes. Los objetos saltan al aire. Los niveles y perspectivas quedan distorsionados. Imposibilidad de mantenerse en pie."]],"IFN":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","0 a 1","La frecuencia anual media de nevadas se encuentra entre 0 a 1."],["2","2 a 3","La frecuencia anual media de nevadas se encuentra entre 2 a 3."],["3","4 a 5","La frecuencia anual media de nevadas se encuentra entre 4 a 5."],["4","6 a 10","La frecuencia anual media de nevadas se encuentra entre 6 a 10."],["5","11 a 20","La frecuencia anual media de nevadas se encuentra entre 11 a 20."],["6","21 a 30","La frecuencia anual media de nevadas se encuentra entre 21 a 30."],["7","más de 30","La frecuencia anual media de nevadas es superior a 30."]],"ISIC":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["10","Elaboración de productos alimenticios","Comprende la elaboración de los productos de la agricultura, la ganadería, la silvicultura y la pesca para convertirlos en alimentos y bebidas para consumo humano o animal, e incluye la producción de varios productos intermedios que no son directamente productos alimenticios. Se organiza por actividades que se realizan con los distintos tipos de productos: carne, pescado, fruta, legumbres y hortalizas, grasas y aceites, productos lácteos, productos de molinería, alimentos preparados para animales y otros productos alimenticios y bebidas."],["11","Elaboración de bebidas","Comprende la elaboración de bebidas no alcohólicas y agua mineral, la elaboración de bebidas alcohólicas obtenidas principalmente por fermentación, como cerveza y vino, y la elaboración de bebidas alcohólicas destiladas. No se incluyen la producción de jugos de frutas y de hortalizas, la elaboración de bebidas a base de leche, ni la elaboración de productos de café, té y mate."],["12","Elaboración de productos de tabaco","Comprende la elaboración de un producto agrícola, el tabaco, en forma adecuada para su consumo final."],["13","Fabricación de productos textiles","Comprende la preparación e hilatura de fibras textiles y la tejedura y el acabado de productos textiles y prendas de vestir, así como la fabricación de artículos confeccionados de materiales textiles, excepto prendas de vestir."],["14","Fabricación de prendas de vestir","Comprende todas las actividades de confección, en todo tipo de materiales (cuero, tela, tejidos de punto y ganchillo, etc.), de todo tipo de prendas de vestir y accesorios."],["15","Fabricación de productos de cuero y productos conexos","Comprende el adobo y teñido de pieles, la transformación de pieles en cuero mediante operaciones de curtido y adobo y la fabricación de productos acabados de cuero. Abarca también la fabricación de productos similares a partir de otros materiales (cueros de imitación o sucedáneos de cuero), como calzado de caucho, maletas de materiales textiles, y otros."],["16","Producción de madera y fabricación de productos de madera y corcho, excepto muebles","Comprende la fabricación de productos de madera, como maderos, tableros contrachapados, hojas de madera para enchapado, contenedores de madera, pisos de madera, armazones de madera y edificios prefabricados de madera. Los procesos de producción comprenden el aserrado, la acepilladura, el recorte, el laminado y el ensamblaje de productos de madera a partir de troncos que se cortan en trozos o maderos que se pueden volver a cortar o a los que se puede dar forma con tornos u otras herramientas."],["17","Fabricación de papel y de productos de papel","Comprende la fabricación de pasta de madera, papel y productos de papel. La fabricación de esos productos está agrupada porque abarca una serie de procesos conectados verticalmente. Es frecuente que una misma unidad realice más de una de esas actividades. Se trata esencialmente de tres actividades: la fabricación de pasta de madera entraña la separación de las fibras de celulosa de otras impurezas de la madera o el papel usado; la fabricación de papel consiste en el afeltrado de esas fibras hasta convertirlas en una lámina."],["18","Impresión y reproducción de grabaciones","Comprende la impresión de productos, como periódicos, libros, revistas, formularios comerciales, tarjetas de felicitación y otros materiales, y actividades de apoyo conexas, como encuadernación, servicios de preparación de placas y formación de imágenes a partir de datos."],["19","Fabricación de coque y productos de la refinación del petróleo","Comprende la transformación del petróleo crudo y el carbón en productos utilizables. El proceso principal es la refinación del petróleo, que entraña la separación del petróleo crudo en los distintos productos. Comprende la fabricación de gases, como etano, propano y butano, como productos de las refinerías de petróleo."],["20","Fabricación de sustancias y productos químicos","Comprende la transformación de materias primas orgánicas e inorgánicas mediante un proceso químico y la formación de productos."],["21","Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos.","Comprende la fabricación de productos farmacéuticos básicos y preparados farmacéuticos. Se incluye también la fabricación de sustancias químicas medicinales y productos botánicos."],["22","Fabricación de productos de caucho y de plástico","Comprende la fabricación de productos de caucho y de plástico. La división se define por las materias primas utilizadas en el proceso de fabricación, lo que no significa que se clasifique en ella la fabricación de todos los productos hechos con esos materiales."],["23","Fabricación de otros productos minerales no metálicos","Comprende la fabricación de vidrio y productos de vidrio, productos de cerámica, losetas y productos de arcilla cocida, y cemento y yeso desde las materias primas hasta los artículos acabados. Se incluyen también el corte, la talla y el acabado de la piedra, secaderos de sal, y otros productos minerales."],["24","Fabricación de metales comunes","Comprende las actividades de fundición y/o refinación de metales ferrosos y no ferrosos a partir de mineral y escorias de hierro, por medio de técnicas electrometalúrgicas y de otras técnicas metalúrgicas. Abarca también la fabricación de aleaciones y superaleaciones de metales mediante la introducción de otros elementos químicos en los metales puros."],["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo","Comprende la fabricación de productos de metal “puro” (como partes, recipientes y estructuras) que normalmente tienen una función estática, inamovible. También se incluye la fabricación de armas y municiones."],["26","Fabricación de productos de informática, de electrónica y de óptica","Comprende la fabricación de ordenadores, equipo periférico, equipo de comunicaciones y productos electrónicos similares, así como la fabricación de componentes para esos productos. También se incluye la fabricación de aparatos electrónicos de consumo, equipo de medición, prueba, navegación y control, equipo de irradiación, equipo electrónico de uso médico y terapéutico, instrumentos y equipo ópticos y soportes magnéticos y ópticos."],["27","Fabricación de equipo eléctrico","Comprende la fabricación de productos que se utilizan para generar, distribuir y utilizar energía eléctrica. También se incluye la fabricación de lámparas eléctricas, equipo de señales y aparatos eléctricos de uso doméstico. No se incluye la fabricación de productos electrónicos."],["28","Fabricación de maquinaria y equipo n.c.p.","Comprende la fabricación de maquinaria y equipo que actúan de manera independiente sobre los materiales ya sea mecánica o térmicamente, o que realizan operaciones sobre los materiales (como el manejo, el rociado, el pesado o el embalado), incluidos sus componentes mecánicos que producen y aplican fuerza, y cualquier parte primaria fabricada especialmente. Se incluye la fabricación de aparatos fijos y móviles o manuales, destinados a ser utilizados en actividades industriales, de construcción y de ingeniería civil, en la agricultura o en el hogar. Se incluye también la fabricación de equipo especial para el trasporte de pasajeros o de carga en zonas delimitadas. Se incluye también la fabricación de otros tipos de maquinaria de uso especial no clasificados en otra parte, se utilicen o no en un proceso de manufactura, como equipo para atracciones de feria, equipo automático para boleras, y otros."],["29","Fabricación de vehículos automotores, remolques y semirremolques","Comprende la fabricación de vehículos automotores para el transporte de pasajeros o de carga. Se incluye la fabricación de diversas partes, piezas y accesorios, así como la fabricación de remolques y semirremolques."],["30","Fabricación de otro equipo de transporte","Comprende la fabricación de equipo de transporte, como la construcción de buques y otras embarcaciones, la fabricación de locomotoras y material rodante, aeronaves y naves espaciales y la fabricación de partes y piezas de los mismos."],["31","Fabricación de muebles","Comprende la fabricación de muebles y productos conexos de cualquier material, excepto piedra, hormigón y cerámica. Los procesos utilizados en la fabricación de muebles son métodos estandarizados para conformar materiales y ensamblar componentes, como el corte, el moldeo y la laminación."],["32","Otras industrias manufactureras","Comprende la fabricación de diversos productos no clasificados en otra parte. Puesto que se trata de una división residual, los procesos de producción, los materiales utilizados como insumos y la utilización de los productos resultantes pueden variar considerablemente, y no se han aplicado los criterios habitualmente empleados para agrupar las clases en divisiones."],["33","Reparación e instalación de maquinaria y equipo","Comprende las actividades de reparación de productos para volver a poner en funcionamiento maquinaria, equipo y otros productos. Se incluyen las actividades de mantenimiento (servicio) general u ordinario de esos productos para garantizar que funcionen eficientemente y prevenir averías y reparaciones innecesarias."],["100","Fabricación de ladrillos","Comprende la fabricación de ladrillos y productos conexos, incluyendo las ladrilleras."]],"LOC":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["40","Bajo la superficie","Enterrado bajo el terreno."],["44","En la superficie","Localizado a nivel del terreno."],["45","Sobre la superficie","Localizado por encima de la superficie del terreno."],["48","En trinchera","Depresión del terreno natural o como resultado de efectuar un corte en el mismo para el asentamiento de una vía de comunicación, quedando esta situada entre dos paredes (taludes) para permitir la circulación a una altura inferior al perfil orográfico."],["49","En terraplén","Macizo de tierra que se eleva artificialmente para hacer una defensa, vía de comunicación u otra obra semejante."]],"MCC":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["9","Mampostería","El material predominante es ladrillos colocados a mano."],["64","Metálico","El material predominante es hierro, aluminio u otros metales."],["77","Hormigón","El material predominante es cemento, arena u otro árido, material de mortero, con un armazón de hierro."],["138","Madera","El material predominante es madera de cualquier tipo."]],"MDE":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Común","Educación de población para la adquisición de conocimientos, destrezas y capacidades que la estructura del sistema educativo prevé en los plazos preestablecidos y en las edades teóricas previstas. Contiene los niveles: Inicial, Primario / EGB1 y 2, EGB3, Medio / polimodal y Superior Universitario y Superior No Universitario (de formación docente y de formación técnico / profesional)."],["2","Especial","Educación de personas cuyos procesos de aprendizaje se ven dificultados por motivos de origen psico-físico y educativo particular, ya sea de manera transitoria o permanente. Contiene los niveles: Inicial, Primario / EGB1 y 2, EGB3, Medio / polimodal."],["3","Jóvenes y adultos","Proceso educativo organizado por el cual jóvenes y adultos mejoran sus capacidades técnicas y profesionales, desarrollan sus habilidades o enriquecen sus conocimientos con los propósitos de completar un nivel de educación formal, adquirir o actualizar conocimiento y habilidades en un área específica. Contiene los niveles: Primario / EGB1 y 2, EGB3, Medio / polimodal."],["4","Artística","Educación que responde a la necesidad de aquellas personas que, a partir de diferentes motivaciones, inquietudes e iniciativas demandan educación en los diversos campos del arte. Contiene los niveles: Inicial, Primario / EGB1 y 2, EGB3, Medio / polimodal y Superior Universitario y Superior No Universitario (de formación docente y de formación técnico / profesional)."],["5","Técnico profesional","Educación dirigida a población que requiere además de conocimientos curriculares generales, una formación en estudios orientados o formación permanente en áreas ocupacionales en los sectores de la vida económica. Abarca la formación básica hacia el mundo laboral, la formación de técnicos medios y técnicos superiores."],["6","En privación de libertad","Educación destinada a garantizar el derecho a la educación de personas en conflicto con la ley penal o en situación de encierro (institutos de menores, cárceles, centro de atención de adicciones u otros locales similares) de los niveles y servicios educativos: Inicial (atención educativa de los niños menores de 4 años cuyas madres se encuentran en unidades carcelarias) / Primario / Secundario / Superior No Universitario / otros Servicios (Formación Profesional)."],["7","Rural","Educación que satisface, a través de proyectos institucionales o formas de organización escolar, necesidades de alumnos que concurren a unidades educativas ubicadas en entornos alejados del mosaico principal de una localidad. Tiene por objeto garantizar la obligatoriedad y la continuidad de los estudios en los niveles: Inicial / Primario / Secundario."],["8","Intercultural bilingüe","Educación que atiende a alumnos pertenecientes a pueblos originarios o comunidades indígenas que por cuestiones culturales y / o lingüísticas requieren de un enfoque educativo propio. La modalidad intercultural bilingüe satisface estas particularidades en los siguientes servicios educativos: Inicial / Primario / Secundario."],["9","Domiciliaria y hospital","Educación destinada a población escolar de niveles obligatorios con el objeto de garantizar la continuidad de sus estudios y su reinserción en el sistema educativo que, por razones de salud, no puede concurrir con regularidad al establecimiento educativo. Está integrada por los niveles : Inicial / Primario / Secundario."]],"MDF":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Falla normal","Falla generada por tensión horizontal. Las fuerzas inducidas en la roca son perpendiculares al acimut de la falla (línea de ruptura superficial), y el movimiento es predominantemente vertical respecto al plano de falla, el cual típicamente tiene un ángulo de 60º respecto a la horizontal. El bloque que se encuentra por encima del plano de la falla se denomina techo, y se desliza hacia abajo; mientras que el bloque que se encuentra por debajo del plano de la falla se denomina piso, y asciende."],["2","Falla inversa","Falla generada por compresión horizontal. El movimiento es preferentemente horizontal y el plano de falla tiene típicamente un ángulo de 30º respecto a la horizontal. El bloque de techo se encuentra sobre el bloque de piso. Cuando la falla inversa presenta un buzamiento (inclinación) inferior a 45º, ésta también toma el nombre de cabalgamiento."],["3","Falla de desplazamiento","Falla desarrollada a lo largo de un plano vertical, cuyo movimiento de bloques es horizontal. Es típica de límites transformantes de placas tectónicas. Se distinguen dos tipos de fallas de desgarre: lateral derecha y lateral izquierda. Lateral derecha o dextral, es aquella en donde el movimiento relativo de los bloques es hacia la derecha; mientras que en la lateral izquierda o sinestral, el movimiento es opuesto a la anterior. También se la conoce como falla transversal, de desgarre o de rumbo."]],"MEM":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Si",""],["2","No",""]],"MES":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["0","Falso","El objeto no posee separación vial."],["1","Verdadero","El objeto sí posee separación vial."]],"MO1":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Por restitución","Puntos obtenidos por trazado manual, a través de la interpretación visual de la morfología a partir de pares estereoscópicos."],["2","Por plancheta","Puntos generados en el terreno con instrumental topográfico de plancheta. Se tiene en cuenta por la información histórica que aporta."],["3","Por Modelo Digital de Elevaciones","Puntos generados a partir del Modelo Digital de Elevaciones del IGN MDE-Ar."]],"MO2":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Por restitución","Curvas obtenidas por trazado manual, a través de la interpretación visual de la morfología a partir de pares estereoscópicos."],["2","Por Modelo Digital de Elevaciones","Curvas generadas con algoritmos matemáticos a partir de un Modelo Digital de Elevaciones."],["3","Por plancheta","Curvas generadas en el terreno con instrumental topográfico de plancheta. Se tiene en cuenta por la información histórica que aporta."],["4","Por fotogrametría","Curvas generadas por interpolación de puntos acotados por técnicas fotogramétricas."]],"MRG":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["3","Altimétrico - Topográfica","Puntos pertenecientes a líneas de nivelación que densifican las mallas."],["4","Gravimétrico - Primer orden","Puntos pertenecientes a la red gravimétrica de primer orden nacional."],["5","Gravimétrico - Segundo orden","Puntos pertenecientes a la red gravimétrica de segundo orden nacional."],["6","Gravimétrico - Tercer orden","Puntos pertenecientes a la red gravimétrica de tercer orden nacional."],["7","Gravimétrico - RAGA","Puntos pertenecientes a la Red Argentina de Gravedad Absoluta (RAGA)."],["8","Gravimétrico - BACARA","Puntos pertenecientes a la antigua red de primer orden nacional: Base de Calibración de la República Argentina."],["9","Gravimétrico - IGSN71","Puntos pertenecientes a la Red de Estandarización Gravimétrica Internacional."],["10","Gravimétrico - Mar","Puntos gravimétricos capturados en el océano."],["11","Gravimétrico - Aéreo","Puntos gravimétricos capturados mediante gravimetría aérea."],["12","Geocéntrico - POSGAR07","Puntos pertenecientes a la red POSGAR07."],["13","Geocéntrico - PASMA","Puntos pertenecientes a la red PASMA."],["14","Geocéntrico - Provinciales","Puntos pertenecientes a las redes geodésicas provinciales."],["15","Geocéntrico - Densificación POSGAR","Puntos pertenecientes a la red Densificación POSGAR07."]],"NEN":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Inicial","Nivel que tiene por objeto brindar una formación integral que abarca los aspectos sociales, afectivo-emocionales, cognitivos, motrices y expresivos de manera que se promueva y profundice la calidad de los aprendizajes en etapas posteriores. Constituye una unidad pedagógica destinada a niños desde los 45 días a 5 años siendo obligatorios los últimos dos años (sala de 4 y sala de 5)."],["2","Primario","Nivel que tiene por objeto la adquisición de competencias básicas, la apropiación de conocimientos habilidades y valores comunes imprescindibles para toda la población. Para la modalidad común y especial constituye una unidad pedagógica obligatoria a partir de los 6 años de edad cumplidos al día 30 de junio y tiene una duración de 6 o 7 años según la estructura que haya optado cada jurisdicción. Para la modalidad Jóvenes y Adultos existen ofertas específicas que se organizan con una menor duración en los estudios. En ambos casos habilita a cursar el nivel secundario."],["3","Secundario","Nivel que tiene por objeto profundizar los saberes, habilidades y valores en función de las áreas de conocimiento del mundo social y del trabajo, habilita para cursar el nivel superior. Constituye una unidad pedagógica obligatoria destinada a adolescentes, jóvenes y adultos que hayan aprobado el nivel primario. Consta de dos ciclos: a)Ciclo Básico: con contenidos curriculares comunes y b) Ciclo Orientado: de caracter especializado según las distintas áreas del conocimiento y el mundo del trabajo."],["4","Superior - Institutos no universitarios","Están destinados a la formación y capacitación para el ejercicio de la docencia y a la formación superior de carácter instrumental en las áreas humanísticas, sociales, artísticas de formación Técnico Profesional regidas por la ley 26.058"]],"OCF":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Densidad","Las masas de agua diferen en densidad."],["2","Salinidad","Las masas de agua diferen en salinidad."],["3","Temperatura","Las masas de agua diferen en temperatura"]],"ODN":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["0","False","Cuando no posee uno o mas nombres alternativos generalmente usados por las fuerzas"],["1","True","Cuando si posee uno o mas nombres alternativos generalmente usados por las fuerzas"]],"OFI":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Acumulación de objetos flotantes","El frente marino se manifiesta por la acumulacion de objetos flotantes en la superficie del agua."],["2","Espuma","El frente marino se manifiesta por la presencia por l tinente. Ejemplo: Canal de Beagle."],["3","Archipiélago","Conjunto de islas de diversos tamaños, en el mar, corriente de agua o espejo de agua, no muy distantes unas de otras."],["4","Delta","Desembocadura de una corriente de agua en un espejo de agua, mar, estuario, que frena su velocidad, perdiendo poder de carga y haciendo que deposite sus sedimentos. Tiene forma de delta griega."],["5","Estuario","Desembocadura ancha de una corriente de agua, donde accionan las mareas y se mezclan las aguas en marea alta."],["6","Ría","Valle de origen fluvial inundado por el mar. Ejemplo: Ría del Río Deseado."],["7","Golfo","Accidente marítimo de extensión variable y mayor rango dimensional que una bahía. Es una parte del mar que se interna en el continente, entre dos prominencias costeras."],["8","Bahía","Penetración profunda del mar en la costa, de entrada ancha y donde accionan las mareas."],["9","Península","Superficie de tierra que en su mayor parte se encuentra rodeada de agua, y que se une a una extensión de tierra mayor a través de un istmo. Se forma por erosión. Ejemplo: Península de Valdés (Provincia del Chubut), Península de San Pedro, Lago Nahuel Huapi (Provincia de Río Negro)."],["10","Istmo","Estrecha lengua de tierra que une dos continentes o una península con un continente."],["11","Punta","Superficie de tierra de baja altura que penetra en el mar, corriente de agua o espejo de agua. Ejemplo: Punta Dungeness, Provincia de Santa Cruz."],["12","Cabo","Superficie de tierra de relieve accidentado que sobresale de la línea de costa y penetra en el mar."],["13","Estrecho","Porción de mar relativamente larga y estrecha que conecta dos cuerpos de agua (mares, océanos o lagos), y por tanto, se encuentra entre dos masas de tierra. Ejemplo: Estrecho de Magallanes."],["14","Puerto natural","Zona de la costa que ofrece resguardo natural a las embarcaciones."]],"TAP":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Categoria Ia: Reserva natural estricta","Es un área que está protegida de todo uso humano excepto el ligero, con el fin de preservar las características geológicas y geomorfológicas de la región y su biodiversidad. Estas áreas están restringidas a toda perturbación humana fuera de los estudios científicos, el monitoreo ambiental y la educación, por ello proveen ambientes prístinos ideales para medir la influencia humana externa. En algunos casos las reservas naturales estrictas tienen un significado espiritual para las comunidades circundantes, y las áreas también están protegidas por esta razón. La gente que practica su fe en la región tiene derecho a seguir haciéndolo, siempre que esté en consonancia con los objetivos de conservación y gestión del área"],["2","Categoría Ib: Área silvestre","Similar a una reserva natural estricta, pero generalmente más grande y protegida de forma ligeramente menos estricta"],["3","Categoría II: Parque nacional","Un parque nacional o provincial es similar a un área silvestre en su tamaño y en su objetivo principal de proteger los ecosistemas que funcionan. Los parques se gestionan de forma que pueden contribuir a las economías locales mediante la promoción del turismo educativo y recreativo a una escala que no reducirá la eficacia de los esfuerzos de conservación. Las áreas circundantes de un parque pueden ser de \"uso consuntivo o no consuntivo\", pero deben actuar como una barrera para la defensa de las especies y comunidades nativas del área protegida para que puedan sostenerse a largo plazo."],["4","Categoria III: Monumento o característica natural","Un monumento o característica natural es un área comparativamente más pequeña que se asigna específicamente para proteger un monumento natural y sus hábitats circundantes. Estos monumentos pueden ser naturales en su sentido más amplio o incluir elementos que han sido influenciados o introducidos por el hombre. Estos últimos deberían contener asociaciones de biodiversidad o podrían clasificarse de otra manera como un sitio histórico o espiritual, aunque esta distinción puede ser bastante difícil de determinar."],["5","Categoria IV: Área de Manejo de Hábitat / Especies","Un hábitat o área de gestión de especies es similar a un monumento natural, pero se centra en áreas de conservación más específicas, como una especie o hábitat identificable que requiere protección continua en lugar de la de una característica natural. Estas áreas protegidas estarán suficientemente controladas para asegurar el mantenimiento, la conservación y la restauración de especies y hábitats particulares y se fomenta ampliamente la educación pública de dichas áreas como parte de los objetivos de gestión. Las áreas de gestión de hábitats o de especies pueden existir como una fracción de un ecosistema o área protegida más amplia y pueden requerir diversos niveles de protección activa como la prevención de la caza furtiva, la creación de hábitats artificiales y la detención de la sucesión natural."],["6","Categoría V: Paisaje protegido/ Marino/Área","Un paisaje terrestre o marino protegido cubre un conjunto entero de tierra o de océano con un plan de conservación natural explícito, pero normalmente también da cabida a una serie de actividades con ánimo de lucro"],["7","Categoría VI: Área protegida con uso sostenible de los recursos naturales","La participación humana es un factor importante en la gestión de esta categoría y puede permitirse una producción industrial a gran escala. La UICN recomienda que una proporción de la masa terrestre permanezca en su condición natural —una decisión que debe tomarse a nivel nacional, normalmente con una especificidad para cada área protegida. Se debe desarrollar la gobernanza para adaptar la diversa y creciente gama de intereses que surgen de la producción de recursos naturales sostenibles. Es adecuada para vastas áreas que ya tienen un bajo nivel de ocupación humana o en las que las comunidades locales y sus prácticas tradicionales han tenido poco impacto permanente en la salud ambiental de la región y difiere de la categoría V en que no es el resultado de una interacción humana a largo plazo que haya tenido un efecto transformador en los ecosistemas circundantes"]],"TAT":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Alojamiento turístico hotelero","Alojamientos categorizados como Hotel, Hotel Boutique y Apart Hotel."],["2","Alojamiento turístico para-hotelero","Alojamientos categorizados como Cama y Desayuno / Hostal / Bed & Breakfast; Albergue Turístico / Hostel; Hospedaje Turístico / Residencial Turístico; Hosterías; Cabañas/Bungalows, CAT y DAT"],["3","Alojamiento turístico extra-hotelero","Se trata de los campamentos turísticos y/o campings."]],"TBA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Con arbustos","El bosque abierto tiene predominancia de arbustos."],["2","Con estrato herbáceo","El bosque abierto tiene predominancia de estrato herbáceo."],["3","Con arbustos y emergentes","El bosque abierto tiene predominancia de arbustos y emergentes."]],"TBO":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["46","Flotadores perfilados","Plataforma que se desplaza libremente en la columna de agua y que periódicamente realiza recorridos verticales a través de la misma (por ejemplo, el flotador Argo)"],["47","Derivantes","Plataforma que flota libremente ya sea en la superficie de la columna de agua o a una profundidad predeterminada dentro de la columna de agua"],["48","Fija","Plataforma amarrada al fondo del mar para mantener una posición fija que puede incluir instrumentos oceanográficos con componentes en el fondo marino, en aguas intermedias y en superficie."]],"TC1":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Oficina postal","Local habilitado para el despacho de correspondencia local. Incluye es de los factores que inciden en los fenómenos locales."],["2","Permafrost","Regolito y sustrato rocoso permanentemente congelados, existiendo algunos casos en los que se descongelan en verano."]],"THH":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Bañado","Terreno bajo y de pobre escurrimiento superficial que hace que esté anegado durante todo el año a causa generalmente de las lluvias, y de los desbordes de aguas superficiales o afloramiento de la capa freática. Posee poca profundidad y piso fangoso e inestable, con cobertura vegetal hidrófila, con algo de leñosa y pajonales."],["2","Estero","Área de gran superficie, topográficamente deprimida y anegada permanentemente, manteniendo los suelos en hidromorfismo permanente. Esto permite el afianzamiento constante de vegetación hidrófila bentónica y flotante, con mayor producción y acumulación de materia orgánica y alimentando lagunas abiertas y permanentes que determinan un paisaje de dinámica distinta al bañado. La diferencia con éste es ecológica y energética, por la cantidad de materia orgánica producida y consumida."],["3","Cañada","Bañado formado en la planicie de inundación a lo largo de la corriente de agua, que al tener poca diferencia topográfica, es baja y está casi permanentemente inundada. Puede o no estar bien definida."],["4","Cangrejal","Terreno bajo, saturado de agua, en donde suelen criarse cangrejos. Generalmente es una zona lindera a un curso de agua o al litoral sometido a la invasión y retroceso casi regular de la marea."],["5","Mallín, vega, menuco","Valle o zona baja y húmeda, en una geografía montañosa, que da un suelo fértil originado por un curso de agua o vertiente, con vegetación herbácea o hidrófila natural."],["6","Turberas","Ambientes terrestres cuyo factor principal es el agua, caracterizados por el anegamiento constante, la acidez, la anoxia, una baja disponibilidad de nutrientes y escasa labilidad de sustratos que producen la acumulación de un depósito rico en materia orgánica descompuesta denominada turba. Albergan flora y fauna única adaptada a este tipo de ambientes. (IDETDF 2022)"]],"TIA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Exploración","Área permisada para la exploración"],["2","Explotación","Área concesionada para la explotación"]],"TIE":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Social y cultural",""],["2","Deportivo",""],["3","Artístico",""]],"TIP":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Estatal","Propiedad del estado nacional, provincial o municipal"],["2","Privado","Propiedad de un privado."]],"TIR":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Ida",""],["2","Ida y vuelta",""]],"TIT":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Unidades de atención al visitante","Obras que generan un espacio de encuentro con los visitantes. Ej.: centro de interpretación, centro de información y atencion al visitante, centro de control y acceso."],["2","Unidades de ordenamiento de visitación","Son construcciones o intervenciones que permiten el desarrollo de productos o actividades turísticas: miradores, refugios turísticos, pasarelas"]],"TLC":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Simple","Son aquellas que se extienden íntegramente sobre una jurisdicción de 2º orden y también sobre una sola área de gobierno local."],["2","Compuesta","Son aquellas que se extienden sobre dos o más áreas político administrativas."]],"TLG":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Alto","Punto o zona elevada respecto a su entorno."],["2","Bajo","Depresión u hondonada del terreno, que puede o no tener agua."],["3","Llano","Planicie enmarcada por cordones o sierras, de extensión variable, suelos áridos y vegetación xerófila."],["4","Llanura","Región extensa de escaso relieve, donde las pendientes son muy bajas (%°) y el relieve plano-cóncavo-convexo es evidenciado por el diseño meándrico de los cursos que drenan la región con una velocidad de escurrimiento lenta."],["5","Pampa","Nombre quechua que significa planicie sin árboles, para referirse a las extensas llanuras que componen gran parte de Argentina. Altiplanicie que constituye la parte superior de una meseta."],["6","Planicie","Superficie con una cobertura sedimentaria y notoria planitud en su configuración."],["7","Altiplano","Extensión con escaso relieve y elevada altitud, que se encuentra generalmente localizada entre dos o más cadenas montañosas, pero cuyo levantamiento no ocurrió al mismo tiempo. También suele denominarse altiplanicie."],["8","Puna","Voz quechua que significa \"tierras altas de la Cordillera\". Altiplanicie ubicada entre los 3.000 a 4.000 msnm, rodeada de montañas."]],"TLQ":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Dura","También llamada hard breakline. Es aquella que representa una discontinuidad abrupta (ejemplo: corriente de agua) en la pendiente de la superficie."],["2","Blanda","También llamada soft breakline. Es aquella que permite añadir mayor definición al modelo en zonas donde, aunque no cambia de forma abrupta la orientación de la pendiente, se recoge la forma de algún elemento determinado."]],"TP1":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Polo Norte geográfico","Extremo Norte del eje de rotación terrestre, donde convergen los meridianos, coincidiendo con las máximas latitudes."],["2","Polo Norte magnético","Punto ubicado en el hemisferio Norte donde convergen las líneas de fuerza del campo magnético terrestre."],["3","Polo Sur geográfico","Extremo Sur del eje de rotación terrestre, donde convergen los meridianos, coincidiendo con las máximas latitudes."],["4","Polo Sur magnético","Punto ubicado en el hemisferio Sur donde convergen las líneas de fuerza del campo magnético terrestre."]],"TPA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Urbano","Ubicación dentro del ejido urbano."],["2","Rural","Ubicación dentro del ejido rural."],["3","Suburbano","Ubicación dentro del ejido suburbano."],["4","Subrural","Ubicación dentro del ejido subrural."]],"TPE":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["13","Estructura de playa/intermareal","Estructura a la que se puede unir instrumentación que está en el aire o bajo el agua, según el estado de la marea y las condiciones climáticas."],["16","Instalacion/Estructura offshore (fuera de costa)","Estructura artificial fija (durante la realizacion de las mediciones) alejada de la costa enla que se puede instalar instrumental (por ejemplo, una plataforma petrolera, una plataforma de gas o una barcaza autoelevable)."],["17","Estructura costera","Estructura fija permanentemente unida a la tierra con acceso al agua en todos los estados de la marea en la que se puede instalar instrumentos de medicion (por ejemplo, un muelle)."],["20","Sumergible","Plataforma que opera en la columna de agua con propulsión limitada y sin operador humano a bordo."],["31","Buque de investigación","Plataforma de cualquier tamaño que opera en la superficie de la columna de agua equipada, tripulada y operada específicamente para la investigación científica, generalmente oceanográfica."],["32","Buque de oportunidad","Embarcación comercial de cualquier tamaño que recopila regularmente datos científicos (oceanográficos y meteorológicos)."],["33","Embarcacion a motor","Pequeña embarcacion a motor y que se puede sacar fácilmente del agua (p. ej., semirrígidas, botes)."],["36","Barco pesquero","Plataforma que opera en la superficie de la columna de agua cuyo objetivo principal es la recolección comercial de peces o mariscos, pero que puede estar involucrada en actividades científicas."],["38","Embarcación menor","Una plataforma que opera en la superficie de la columna de agua que se propulsa manualmente y no se puede quitar fácilmente."],["39","Embarcaciones de la Armada","Embarcación que está principalmente equipada, tripulada y operada con fines militares. Incluye buques de guerra de superficie de todos los tamaños y buques de apoyo logístico."],["68","Satellite","Un vehículo que opera más allá de la atmósfera terrestre sin ocupantes humanos que orbita la Tierra."],["70","Organismo","Ser vivo al que se la acoplan diferentes sensores."],["72","Buzo","Un ser humano con equipo autónomo o traje conectado a la superficie que permite operar dentro de la columna de agua."]],"TPL":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Pileta de tratamiento de efluentes cloacales","Depósito de líquidos de origen cloacal y domiciliario contenidos para su tratamiento."],["2","Pileta de tratamiento de efluentes industriales","Depósito de líquidos de origen industrial para su tratamiento."],["3","Pileta potabilizadora de agua","Depósito de agua para eliminar, por decantación, residuos finos en suspensión."],["4","Pileta de lixiviación","Depósito de líquidos lixiviados de depósitos de residuos."]],"TPR":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Aventura","Operadores que comercializan una modalidad de turismo cuyo propósito específico es participar en actividades en un medio ambiente natural o antrópico, que suponen la existencia de un riesgo controlado o de una preparación física específica."],["2","Convencional","Prestador que brinda servicios y/o actividades turísticas tradicionales, que no implican riesgos y/o no requiere preparación física de los participantes."]],"TRO":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Urbano","Cuando el radio está conformado por manzanas y/o sectores de una localidad, con población agrupada únicamente."],["2","Rural","Cuando el radio está conformado por viviendas diseminadas en campo abierto, con población dispersa únicamente."],["3","Mixto","Cuando el radio está conformado por viviendas diseminadas en campo abierto, con población rural dispersa, y con población agrupada en pequeños poblados o en bordes de amanzanados de localidades."]],"TSE":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Urbano","Cuando la senda se ubica en ejido urbano"],["2","Rural","Cuando la senda se ubica en ejido rural"],["3","Mixto","Cuando la senda se ubica en ejido mixto"]],"TSN":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Arenal","Suelo constituido por sedimento suelto, tamaño arena, sin tener la forma de médano y acumulado por el viento. Incluye el arenal con ripio."],["2","Barrial, barrizal, guadal","El barrial es un terreno bajo y sin desagüe que se inunda periódicamente formando un lodo gredoso y sin vegetación que cuando se seca por evaporación se transforma en un polvillo fino esparcido por el viento. El barrizal es un sitio lleno de barro permanente o durante o durante la mayor parte del año. El guadal es un pantano arenoso, de nula capacidad portante y poca vegetación."],["3","Escorial, colada lávica","Terreno cubierto de antigua lava volcánica formada por bloques irregulares en cuanto a tamaño, y que presentan superficies y aristas ásperas."],["4","Pedregal","Terreno cubierto de rocas sueltas, de tamaño mayor a la grava, generalmente angulosas y heterogéneas en cuanto a composición y tamaño."],["5","Salina, salar, salitral, boratera","Zona baja arreica donde se produce acumulación de sales por evaporación (cloruros y sulfatos principalmente), constituyendo un depósito natural de sales, cuya denominación varía según el tipo de sal. Salina o salar se refiere a la acumulación de sales en solución acuosa. Salitral es el depósito natural de salitre. Boratera es una salina donde la sal predominante es borato."],["6","Sedimento fluvial","Grava y bloques redondeados, arena y otros sedimentos finos transportados por la acción fluvial y que son depositados en las planicies aluviales actuales o antiguas (albardones y terrazas)."],["7","Tacuruzal","Terreno cubierto por montículos de tierra, compacta y resistente debido al accionar de hormigas para construir hormigueros."],["8","Turbal","Suelo con alto contenido de restos de vegetación en proceso de humidificación que cuando el proceso se completa toma color negro, de textura esponjosa y blanda con gran capacidad de absorber agua. Puede estar mezclada con limo o arcilla que favorece la unión. Su capacidad portante es casi nula."],["9","Franco","Suelo fino con proporciones óptimas de arena-limo-arcilla que le otorgan una textura relativamente suelta, fertilidad, y una adecuada retención de humedad."]],"TTR":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Trópico de Cáncer","Círculo imaginario de la esfera celeste paralelo al Ecuador, ubicado aproximadamente a la latitud geocéntrica 23º 26' 17'',43 Norte."],["2","Trópico de Capricornio","Círculo imaginario de la esfera celeste paralelo al Ecuador, ubicado aproximadamente a la latitud geocéntrica 23º 26' 17'',43 Sur."]],"TUP":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Vial","Puente destinado a soportar una red vial o calle."],["2","Ferrocarril","Puente destinado a permitir el paso de locomotoras y vagones."],["3","Mixto","Puente destinado a soportar y permitir el paso de locomotoras, vagones, red vial o calle."]],"TVA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Sin emergentes","La vegetación arbustiva no posee emergentes."],["2","Con árboles emergentes","La vegetación arbustiva posee árboles emergentes."],["3","Con arbustos emergentes","La vegetación arbustiva posee arbustos emergentes."]],"TVC":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Calle","Vía de circulación de tipo calle"],["2","Av","Vía de circulación de tipo avenida"],["3","Ruta","Vía de circulación de tipo ruta"],["4","Pje","Vía de circulación de tipo pasaje"],["5","Otro","Vía de circulación con codficación especial. Incluye Peatonal, Pasillo, Callejón, Camino secundario, Calle proyectada, Rotonda S N, Huella, Sendero, Escalera, Arroyo, Río, Cañada, Linea de costa, Terreno anegadizo, Canal, Acequia, Embalse, Represa, Zanja, Zanjón, Acantilado, Barranca, Barda, Huaico, Faldeo, Alambrado, Paredón, Lote, Ferrocarriles e Imaginario."]],"TVN":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Hidrófila","Vegetación natural cuyo medio es predominantemente acuático."],["2","Terrestre","Vegetación natural cuyo medio es predominantemente terrestre."]],"TYA":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Localidad","Refiere a una porción del territorio caracterizada por la continuidad de áreas edificadas y no edificadas conectadas entre sí por una red de calles donde se concentra población. (BAHRA)"],["2","Entidad","Las entidades son subdivisiones de una localidad (simple o compuesta) según la legislación del gobierno local. En algunos casos las entidades corresponden a localidades que en su origen fueron localidades separadas y que por efecto de la expansión urbana y la aplicación del criterio de continuidad física, actualmente se encuentra “comprendida” en una localidad simple o componente de localidad compuesta o aglomerado. En la ciudad de Buenos Aires se denominan “barrios”, en la provincia de Mendoza “distritos” o “secciones”, y en el resto de las provincias reciben el nombre de “localidades” o “barrios”. El uso de la unidad “entidad” es optativo, y se aplica en algunas provincias. (BAHRA)"],["3","Paraje","Se entiende por paraje a un lugar situado en un área rural, que se identifica con un topónimo y que puede presentar o no objetos geográficos (ver objetos geográficos de áreas rurales). El nombre con que se lo identifica puede provenir de un registro oficial o bien puede ser dado por lugareños. La mayoría de los parajes tienen límites indefinidos o parcialmente definidos. (BAHRA)"],["4","Base antártica","La base antártica por definición es un conjunto formado por edificios destinados a investigaciones científicas, servicios y viviendas que no se ajustan a la definición de localidad empleada en los censos nacionales por no constituir un amanzanamiento definido en el terreno. (BAHRA)"]],"TYM":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Manzana/macizo","Son extensiones de territorio cuya superficie no debe exceder las 1.5 hectáreas y están totalmente rodeadas de vías de comunicación. (ARBA 2018)"],["2","Quinta","Extensión de territorio cuya superficie es mayor a 1.5 hectáreas y no supere las 12 hectáreas. (ARBA 2018)"],["3","Chara","Extensión de territorio cuya superficie es superior a 12 hectáreas y no excede 120 hectáreas, totalmente rodeadas de vías de comunicación. (ARBA 2018)"],["4","Fracción","No tienen especificaciones de ningún tipo dentro de la Ley 10707, es por ello que podemos  encontrarlas como macizos puros, o como subdivisiones de algún macizo puro. (ARBA 2018)"]],"TYP":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["41","Autopista","Vía multicarril sin cruces a nivel con otra calle o ferrocarril, con puentes, con calzadas separadas físicamente y con limitación de ingreso directo desde los predios frentistas lindantes."],["52","Vía de autopista","Cada una de las calzadas independientes que componen una autopista."],["47","Autovía","Vía con calzadas separadas y restricciones de uso para determinadas categorías de tráfico. Puede contar con semáforos y cruces peatonales."],["53","Vía de autovía","Cada una de las calzadas independientes que componen una autovía."],["51","Camino de un carril","Vía de una sola calzada por donde se puede circular en un sólo sentido a la vez."],["54","Camino de dos carriles","Vía de una sola calzada por donde se puede circular en ambos sentidos de manera independiente."]],"TZ1":[["-1","Información no disponible","Cuando no se dispone o no se tiene certeza de los datos."],["1","Provincias de Entre Ríos, Corrientes y Misiones","Río Paraná Guazú (límite entre las provincias de Buenos Aires y Entre Ríos) desde su desembocadura hasta la Ruta Nacional Nº 12 y por la misma hasta su encuentro con la Ruta Nacional Nº 14. Por esta última hasta el cruce con el río Gualeguaychú y por este río hasta la intersección con el camino que une Santa Rosa con La Clarita. Por este camino hasta La Clarita y por vías del Ferrocarril General Urquiza (Km 322,5) hacia Arroyo Barú hasta San Salvador. Desde esta localidad por línea recta hasta el punto de reunión de los límites interdepartamentales de Colón, Concordia y Villaguay. Desde este punto por el Límite Concordia-Villaguay, luego Concordia-Federal, Federación-Federal y hasta intersección con Ruta Nacional Nº 127 y por ésta hacia el Norte hasta su intersección con la Ruta Nacional Nº 14. Desde este cruce (Cuatro Bocas) por la Ruta Nacional Nº 119 hasta Mercedes y desde allí por Ruta Provincial Nº 40 hasta Colonia Carlos Pellegrini. Desde este punto, por Ruta Provincial Nº 41 hasta la intersección con Ruta Provincial Nº 37 y desde allí por líneas rectas a las localidades de Loreto y Nuestra Señora del Rosario de Caa Catí para continuar por la Ruta Provincial Nº 5 hasta San Luis del Palmar y desde allí, por Ruta s/n a Paso de la Patria. La zona así delimitada incluye la totalidad del territorio de la Provincia de Misiones exceptuándose el ejido municipal de la Ciudad de Posadas."],["2","Provincias de Chaco, Formosa, Salta y Jujuy","Desde el río Paraná, siguiendo por los límites interdepartamentales Bermejo —1º de Mayo y Bermejo— Libertador General San Martín hasta el río de Oro. Desde este punto línea recta hasta el cruce del río Bermejo con el límite interdepartamental Laishi-Pirané. Siguiendo por este límite y luego por su similar Formosa-Pirané hasta las vías del Ferrocarril General Belgrano y por éstas hasta Salta (se exceptúa el ejido municipal de la Ciudad de Formosa). En esta provincia continúa por las vías mencionadas hasta Pichanal y desvío hacia Yuchán hasta el río San Francisco. Por éste hasta el límite interprovincial con Jujuy y por dicho límite hasta su intersección con la Ruta Provincial Nº 13. Por esta ruta hasta Hipólito Yrigoyen (estación Iturbe) y desde allí por las vías del Ferrocarril General Belgrano, hasta Abra Pampa y Ruta Provincial Nº 71 hasta el límite interdepartamental Cochinoca-Rinconada, luego Cochinoca-Susques y siguiendo por el límite interprovincial Jujuy-Salta (Sierra del Cobre) hasta la Ruta Provincial Nº 38 y por ésta hasta su intersección con la Ruta Nacional Nº 40 continuando por esta última hacia San Antonio de los Cobres. Luego por la Ruta Provincial Nº 51 y Ruta Provincial Nº 129 hacia Salar de Pocitos hasta la Ruta Provincial Nº 17 y por esta última hacia el límite con la Provincia de Catamarca."],["3","Provincias de Catamarca, San Juan y Mendoza","Desde el límite con Salta, Ruta Provincial Nº 43 hacia el sur hasta la intersección con la Ruta Nacional Nº 40 y por la misma, hasta el límite interprovincial con la provincia de La Rioja. En esta provincia, se continúa por la Ruta Nacional Nº 40 hasta su intersección con la Ruta Provincial Nº 18, y por esta última hasta Pagancillo, y desde esta localidad por Ruta Provincial Nº 26 hasta su intersección nuevamente con la Ruta Nacional Nº 40. Por ésta hasta el límite interprovincial con la provincia de San Juan. En esta provincia sigue por Ruta Nacional Nº 40 hacia el Sur, continuando por su superposición con la Ruta Nacional Nº 150 hasta Cruz de Piedra. Desde este punto por Ruta Provincial Nº 150 hasta Las Flores, continuándose por la Ruta Provincial Nº 436 hasta Iglesias y luego por la Ruta Provincial Nº 412 hasta el límite interprovincial, que se continúa en Mendoza como Ruta Provincial Nº 39. Por esta ruta hasta Uspallata y por Ruta Nacional Nº 7 hasta Potrerillos. Desde allí por la ruta que hacia el Sur llega a San José y por Ruta Provincial Nº 86 hasta su intersección con la Ruta Nacional Nº 40 y por la misma hasta la provincia del Neuquén."],["4","Provincias del Neuquén, Río Negro, Chubut Y Santa Cruz","Por la Ruta Nacional Nº 40 hasta la Ruta Provincial Nº 9 y por ésta hasta su nueva intersección con la Ruta Nacional Nº 40. Por la misma hasta su encuentro con la Ruta Nacional Nº 237. Por ella hasta el río Alicurá y de allí por camino secundario a Paso Flores. Continúa por la Ruta Nacional Nº 40 y prosigue, ya en la provincia de Chubut, hasta el cruce con la Ruta Provincial Nº 20 a 30 km al Sur de Gobernador Costa. Por dicha ruta hasta el cruce con la Ruta Provincial Nº 22 y por esta última hacia río Mayo continuando por la Ruta Nacional Nº 40 hacia el Sur hasta Santa Cruz. En esta provincia continúa hasta Cerrito y por Ruta Provincial Nº 5 hasta su intersección con la Ruta Nacional Nº 3. Desde este punto línea recta a intersección con arroyo sin nombre sobre Ruta Provincial Nº 1 a la altura sección Frailes del Cóndor y por el arroyo mencionado hasta su desembocadura en el Océano Atlántico."],["5","Provincia de Tierra del Fuego, Antártida e Islas del Atlántico Sur","Comprende la totalidad de la Provincia de Tierra del Fuego, Antártida e Islas del Atlántico Sur."],["6","Área de Frontera Ibicuy","Comprende la parte del Departamento Islas del Ibicuy incluida en la Zona de Frontera."],["7","Área de Frontera Federación","Comprende el Departamento Federación."],["8","Área de Frontera Paso de los Libres","Comprende los departamentos Monte Caseros, Paso de los Libres, San Martín, General Alvear, Santo Tomé y parte del Departamento Ituzaingó incluida en la Zona de Frontera."],["9","Área de Frontera Bernardo de Irigoyen","Comprende los departamentos 25 de Mayo, Guaraní, San Pedro, General Manuel Belgrano e Iguazú."],["10","Área de Frontera Bermejo","Comprende el Departamento Bermejo."],["11","Área de Frontera Clorinda","Comprende los departamentos Pilcomayo, Pilagas, completos, y, la parte del Departamento Patiño determinada por su límite interdepartamental con Pilagas y con Pirané hasta la intersección con la Ruta Provincial Nº 20; por esta ruta hasta Colonia Unión Escuelas, siguiendo por río Porteño hacia San Martín 1 y Pozo Hondo hasta la Ruta Provincial Nº 28 y por esta última hasta el límite internacional."],["12","Área de Frontera Ingeniero Juárez","Comprende el Departamento Ramón Lista y la parte del Departamento Matacos incluida la Zona de Frontera."],["13","Área de Frontera La Puna","Comprende los departamentos Yavi, Santa Catalina, Rinconada y Susques y la parte de los departamentos Humahuaca y Cochinoca incluida en la Zona de Frontera."],["14","Área de Frontera Tartagal","Comprende los departamentos Santa Victoria e Iruya y la parte de los departamentos Orán, San Martín y Rivadavia incluida en la Zona de Frontera."],["15","Área de Frontera Los Andes","Comprende la parte de los departamentos Los Andes y La Poma incluida en la Zona de Frontera."],["16","Área de Frontera San Francisco","Comprende la parte de los departamentos Antofagasta de la Sierra, Tinogasta y Belén incluida en la Zona de Frontera."],["17","Área de Frontera Famatina","Comprende los departamentos General A. V. Peñaloza, General Lamadrid y la parte de Coronel Felipe Varela comprendida en la Zona de Frontera."],["18","Área de Frontera Jáchal","Comprende los departamentos Iglesia y Calingasta y la parte del Depar
